<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Storm-Track Ultra 2.0 - 風暴領航 Pro</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#060913">
    <meta name="apple-mobile-web-app-title" content="StormTrack Ultra">
    <meta name="application-name" content="StormTrack Ultra">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNTYgMjU2Ij48cmVjdCB3aWR0aD0iMjU2IiBoZWlnaHQ9IjI1NiIgZmlsbD0iIzA2MDkxMyIvPjxjaXJjbGUgY3g9IjEyOCIAY3k9IjEyOCIgcj0iOTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzAwRTVGRiIgc3Ryb2tlLXdpZHRoPSIxNCIgc3Ryb2tlLWRhc2hhcnJheT0iMTIwIDYwIi8+PGNpcmNsZSBjeD0iMTI4IiBjeT0iMTI4IiByPSI0MCIgZmlsbD0iI0ZGMkU2MyIvPjxjaXJjbGUgY3g9IjEyOCIAY3k9IjEyOCIgcj0iMTYiIGZpbGw9IiMwNjA5MTMiLz48L3N2Zz4=">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
</div>

<div id="ultra-toast">📡 已同步最新多機構路徑與香港防風數據</div>

<div id="app-wrapper">
    <!-- Top Brand & Telemetry Bar -->
    <div class="top-header-bar">
        <div class="brand-group">
            <div class="brand-logo"><span class="brand-logo-spin">🌀</span></div>
            <div class="app-title-bar">STORM-TRACK</div>
            <div class="brand-badge">ULTRA 2.0</div>
        </div>
        <div class="top-actions">
            <div class="data-source-pill" id="api-status-pill" onclick="StormApp.syncLiveBackend(true)" title="點擊同步雲端 Worker 與 Open-Meteo 數據">
                <span id="api-status-dot" style="width:7px;height:7px;border-radius:50%;background:#10B981;display:inline-block;"></span>
                <span id="api-status-text">LIVE 同步</span>
            </div>
            <div class="live-clock" id="live-clock">00:00:00</div>
            <button class="icon-action-btn" title="鎖定香港天文台與風暴視角" onclick="AppNav.goTo(0);RadarMapManager.focusHKAndStorm()">🎯</button>
            <button class="icon-action-btn" id="theme-toggle-btn" title="切換深淵黑/日照白模式" onclick="ThemeManager.toggle()">☀️</button>
        </div>
    </div>

    <!-- Active Storm Quick Switcher Ribbon -->
    <div class="storm-selector-ribbon">
        <div class="active-storm-chip" onclick="AppNav.goTo(3)">
            <span class="storm-cat-dot" id="ribbon-cat-dot"></span>
            <span class="storm-chip-title" id="ribbon-storm-name">2518 超強颱風 樺加沙 RAGASA</span>
            <span class="storm-chip-meta" id="ribbon-storm-time">切換個案 ▾</span>
        </div>
        <div class="signal-live-pill" id="ribbon-signal-pill" onclick="AppNav.goTo(1)">
            <span id="ribbon-signal-text">⚠️ 評估信號：八號烈風 T8</span>
        </div>
    </div>

    <!-- Neo-Metro Pivot Sliding Headers -->
    <div id="pivot-headers">
        <h2 class="pivot-header active" data-index="0">radar</h2>
        <h2 class="pivot-header" data-index="1">threat</h2>
        <h2 class="pivot-header" data-index="2">agencies</h2>
        <h2 class="pivot-header" data-index="3">replay</h2>
    </div>

    <!-- Multi-Page Viewport -->
    <div id="pivot-content">
        <div class="pivot-page active" id="page-radar"></div>
        <div class="pivot-page" id="page-threat"></div>
        <div class="pivot-page" id="page-agencies"></div>
        <div class="pivot-page" id="page-replay"></div>
    </div>
</div>

<!-- Floating Glass Bottom Navigation Dock -->
<div id="bottom-nav">
    <div class="nav-tab active" data-index="0" onclick="AppNav.goTo(0)">
        <span class="nav-icon">📡</span>
        <span class="nav-label">戰術海圖</span>
    </div>
    <div class="nav-tab" data-index="1" onclick="AppNav.goTo(1)">
        <span class="nav-icon">🛡️</span>
        <span class="nav-label">香港防風</span>
    </div>
    <div class="nav-tab" data-index="2" onclick="AppNav.goTo(2)">
        <span class="nav-icon">🧭</span>
        <span class="nav-label">機構共識</span>
    </div>
    <div class="nav-tab" data-index="3" onclick="AppNav.goTo(3)">
        <span class="nav-icon">⏪</span>
        <span class="nav-label">歷史重演</span>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script>
    async function bootstrapApp() {
        const pages = ['radar', 'threat', 'agencies', 'replay'];
        for (const p of pages) {
            try {
                const res = await fetch(`pages/${p}.html`);
                if (res.ok) {
                    document.getElementById(`page-${p}`).innerHTML = await res.text();
                }
            } catch (e) {
                console.error('Failed loading view:', p, e);
            }
        }
        ThemeManager.init();
        AppNav.init();
        StormApp.init();
    }
    document.addEventListener('DOMContentLoaded', bootstrapApp);
</script>
</body>
</html>
