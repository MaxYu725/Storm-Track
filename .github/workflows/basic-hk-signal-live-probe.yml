name: Basic HK signal live probe

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/basic-hk-signal-live-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run current basic forecast against 2026-08-21 live storm snapshot
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const impactEngine = require('./analysis/hk-impact-engine.js');
          const signalEngine = require('./analysis/hko-signal-risk-inputs.js');
          const basic = require('./analysis/basic-hk-signal-forecast.js');
          const point=(time,lat,lon,extra={})=>({time,lat,lon,...extra});
          const snapshot={
            schemaVersion:'storm-analysis-snapshot/v1',
            generatedAt:'2026-08-21T10:53:00Z',
            storm:{key:'LIVE-HKO-2629',displayName:'Tropical Storm 2629'},
            referencePoint:{name:'Hong Kong',lat:22.3023,lon:114.1746},
            comparison:{referenceBaseTime:'2026-08-21T09:00:00Z',spread:{distanceKm:null}},
            sources:{
              HKO:{state:'ok',baseTime:'2026-08-21T09:00:00Z',positions:[point('2026-08-21T09:00:00Z',20.7,108.5,{kind:'analysis',maximumWind:'65km/h',intensity:'Tropical Storm'})],forecast:[
                point('2026-08-22T09:00:00Z',20.9,108.0,{kind:'forecast',maximumWind:'75km/h',intensity:'Tropical Storm'}),
                point('2026-08-23T09:00:00Z',20.4,108.1,{kind:'forecast',maximumWind:'75km/h',intensity:'Tropical Storm'}),
                point('2026-08-24T09:00:00Z',19.8,108.4,{kind:'forecast',maximumWind:'85km/h',intensity:'Tropical Storm'}),
                point('2026-08-25T09:00:00Z',20.5,109.7,{kind:'forecast',maximumWind:'75km/h',intensity:'Tropical Storm'}),
                point('2026-08-26T09:00:00Z',21.4,110.2,{kind:'forecast',maximumWind:'55km/h',intensity:'Tropical Depression'})
              ]},
              CMA:{state:'ok',baseTime:'2026-08-21T10:00:00Z',positions:[point('2026-08-21T10:00:00Z',20.6,108.3,{kind:'analysis',maximumWind:18,intensity:'TS',windRadii:[{level:'30KTS',ne:100,se:120,sw:150,nw:100}]})],forecast:[
                point('2026-08-21T16:00:00Z',20.8167,108.4667,{kind:'forecast',maximumWind:18,intensity:'TS'}),
                point('2026-08-21T22:00:00Z',20.8833,108.2667,{kind:'forecast',maximumWind:18,intensity:'TS'}),
                point('2026-08-22T04:00:00Z',20.7667,108.1,{kind:'forecast',maximumWind:20,intensity:'TS'}),
                point('2026-08-22T10:00:00Z',20.5833,108.1167,{kind:'forecast',maximumWind:23,intensity:'TS'}),
                point('2026-08-22T22:00:00Z',20.3917,108.3333,{kind:'forecast',maximumWind:25,intensity:'STS'}),
                point('2026-08-23T10:00:00Z',20.3083,108.7333,{kind:'forecast',maximumWind:23,intensity:'TS'}),
                point('2026-08-23T22:00:00Z',20.4167,109.125,{kind:'forecast',maximumWind:20,intensity:'TS'}),
                point('2026-08-24T10:00:00Z',20.6167,109.4042,{kind:'forecast',maximumWind:20,intensity:'TS'}),
                point('2026-08-25T10:00:00Z',21.0333,109.4958,{kind:'forecast',maximumWind:18,intensity:'TS'}),
                point('2026-08-26T10:00:00Z',21.8333,109.3958,{kind:'forecast',maximumWind:15,intensity:'TD'})
              ]},
              JMA:{state:'missing'},
              CWA:{state:'ok',baseTime:'2026-08-21T06:00:00Z',positions:[point('2026-08-21T06:00:00Z',20.4,107.8,{kind:'analysis',maximumWind:15,maximumGust:23,pressure:998})],forecast:[
                point('2026-08-21T12:00:00Z',20.9,108.8,{kind:'forecast',maximumWind:15}),
                point('2026-08-21T18:00:00Z',21.2,108.2,{kind:'forecast',maximumWind:18,windRadii:[{level:'15m/s',ne:100,se:100,sw:100,nw:100}]}),
                point('2026-08-22T00:00:00Z',21.2,108.2,{kind:'forecast',maximumWind:18,windRadii:[{level:'15m/s',ne:100,se:100,sw:100,nw:100}]}),
                point('2026-08-22T06:00:00Z',21.2,108.2,{kind:'forecast',maximumWind:18,windRadii:[{level:'15m/s',ne:100,se:100,sw:100,nw:100}]}),
                point('2026-08-22T18:00:00Z',20.7,108.1,{kind:'forecast',maximumWind:18,windRadii:[{level:'15m/s',ne:100,se:100,sw:100,nw:100}]}),
                point('2026-08-23T06:00:00Z',20.6,108.1,{kind:'forecast',maximumWind:18,windRadii:[{level:'15m/s',ne:100,se:100,sw:100,nw:100}]}),
                point('2026-08-24T06:00:00Z',20.4,108.8,{kind:'forecast',maximumWind:18,windRadii:[{level:'15m/s',ne:100,se:100,sw:100,nw:100}]}),
                point('2026-08-25T06:00:00Z',21.2,109.9,{kind:'forecast',maximumWind:10})
              ]}
            }
          };
          const impact=impactEngine.buildHongKongImpact(snapshot);
          const signalInputs=signalEngine.buildHkoSignalRiskInputs(snapshot,impact,{sources:snapshot.sources});
          const forecast=basic.buildBasicHkSignalForecast({impact,signalInputs});
          console.log('=== IMPACT SUMMARY ===');
          console.log(JSON.stringify({closestApproach:impact.closestApproach,trend:impact.trend,uncertainty:impact.uncertainty,distanceBands:Object.fromEntries(['800','500','400','300','200'].map(k=>[k,impact.distanceBands[k]]))},null,2));
          console.log('=== BASIC SIGNAL FORECAST V1 ===');
          console.log(JSON.stringify(forecast,null,2));
          NODE
