name: Basic HK signal live probe

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/basic-hk-signal-live-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read live Storm Track sources only
        shell: bash
        run: |
          set -euo pipefail
          base='https://storm.max-yu.workers.dev'
          echo '=== HEALTH ==='
          curl --fail -sS "$base/health" | jq .
          echo '=== HKO TC 2629 TRACK ==='
          curl --fail -sS --get "$base/" --data-urlencode 'url=https://www.weather.gov.hk/wxinfo/currwx/hko_tctrack_2629.xml' | head -c 30000
          echo
          echo '=== CMA NAMELESS 3304364 ==='
          curl --fail -sS --get "$base/" --data-urlencode 'url=https://typhoon.nmc.cn/weatherservice/typhoon/jsons/view_3304364?callback=typhoon_jsons_view_3304364' | head -c 30000
          echo
