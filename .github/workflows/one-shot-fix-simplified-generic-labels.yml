name: One-shot simplified generic storm label fix

on:
  push:
    branches:
      - fix/simplified-generic-storm-labels

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/simplified-generic-storm-labels
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply bounded identity fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          generic_old = 'TROPICALDEPRESSION|TROPICALSTORM|熱帶低氣壓|熱帶風暴'
          generic_new = 'TROPICALDEPRESSION|TROPICALSTORM|熱帶低氣壓|熱帶低壓|热带低气压|热带低压|熱帶風暴|热带风暴'
          unnamed_old = '未命名熱帶氣旋|未命名'
          unnamed_new = '未命名熱帶氣旋|未命名热带气旋|未命名'

          for filename in ['index.html', 'analysis/storm-case-identity.js']:
              path = Path(filename)
              text = path.read_text()
              if generic_old not in text:
                  raise SystemExit(f'missing generic-name marker in {filename}')
              text = text.replace(generic_old, generic_new)
              if unnamed_old not in text:
                  raise SystemExit(f'missing unnamed marker in {filename}')
              text = text.replace(unnamed_old, unnamed_new)
              path.write_text(text)

          frontend = Path('tests/frontend-storm-identity-grouping.test.cjs')
          text = frontend.read_text()
          label_marker = "  '熱帶風暴',\n"
          if label_marker not in text:
              raise SystemExit('missing frontend generic label marker')
          text = text.replace(label_marker, label_marker + "  '热带低压',\n  '热带风暴',\n", 1)
          case_marker = 'const distinctNamedStorms = mergeStormSources(['
          if case_marker not in text:
              raise SystemExit('missing distinct named storm marker')
          gaenari_case = """const gaenariRename = mergeStormSources([\n  storm({ agency: 'CMA', sourceId: '3308554', nameTc: '热带低压', nameEn: null, lat: 25.5, lon: 124.9, time: '2026-08-22T03:00:00Z' }),\n  storm({ agency: 'JMA', sourceId: 'TC2623', nameTc: '簡拉維', nameEn: 'GAENARI', lat: 25.0, lon: 123.8, time: '2026-08-22T06:00:00Z' })\n]);\nassert.equal(gaenariRename.length, 1, 'simplified Chinese generic TD label must merge with the newly named GAENARI track');\nassert.deepEqual(Object.keys(gaenariRename[0].sources).sort(), ['CMA', 'JMA']);\n\n"""
          text = text.replace(case_marker, gaenari_case + case_marker, 1)
          frontend.write_text(text)

          case_test = Path('tests/storm-case-identity.test.cjs')
          text = case_test.read_text()
          source_marker = 'function source(agency, sourceId, time, lat, lon) {'
          if source_marker not in text:
              raise SystemExit('missing case identity source marker')
          generic_assertions = """assert.equal(identity.isGenericName('热带低压'), true, 'simplified Chinese tropical depression label must be generic');\nassert.equal(identity.isGenericName('热带风暴'), true, 'simplified Chinese tropical storm label must be generic');\nassert.equal(identity.isGenericName('GAENARI'), false, 'formal storm names must remain specific');\n\n"""
          text = text.replace(source_marker, generic_assertions + source_marker, 1)
          case_test.write_text(text)
          PY

      - name: Run identity regressions
        run: |
          set -euo pipefail
          node tests/frontend-storm-identity-grouping.test.cjs
          node tests/storm-case-identity.test.cjs
          git diff --check

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-fix-simplified-generic-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html analysis/storm-case-identity.js tests/frontend-storm-identity-grouping.test.cjs tests/storm-case-identity.test.cjs .github/workflows/one-shot-fix-simplified-generic-labels.yml
          git commit -m "Fix simplified generic storm labels"
          git push origin HEAD:fix/simplified-generic-storm-labels
