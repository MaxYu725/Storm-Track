name: AI-18 Activate storm-analysis admin secrets

on:
  push:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/ai18-activate-admin-secrets.yml
      - .github/ai18-activation-trigger.txt
      - docs/AI18_SECURE_ADMIN_ACTIVATION.md
      - tests/storm-analysis-ai18.test.mjs
      - workers/storm-analysis/package.json
  workflow_dispatch:
    inputs:
      activate:
        description: Activate BACKFILL_TOKEN and ANALYSIS_ADMIN_TOKEN after explicit operator preparation
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai18-storm-analysis-admin-activation
  cancel-in-progress: false

jobs:
  validate-and-activate:
    if: github.ref == 'refs/heads/feature/ai-analysis-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BACKFILL_TOKEN: ${{ secrets.BACKFILL_TOKEN }}
      ANALYSIS_ADMIN_TOKEN: ${{ secrets.ANALYSIS_ADMIN_TOKEN }}
      WORKER_URL: https://storm-analysis.max-yu.workers.dev
    steps:
      - name: Checkout AI branch
        uses: actions/checkout@v6
        with:
          ref: feature/ai-analysis-engine
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned deployment toolchain
        working-directory: workers/storm-analysis
        run: npm install --no-audit --no-fund

      - name: Run complete Node checkpoint suite
        working-directory: workers/storm-analysis
        run: npm test

      - name: Run Workers Vitest / Miniflare D1 integration
        working-directory: workers/storm-analysis
        run: npm run test:integration

      - name: Bundle-only Wrangler dry run
        working-directory: workers/storm-analysis
        run: npm run deploy:dry-run

      - name: Resolve explicit activation request
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          requested=false
          trigger="$(tr -d '\r\n' < .github/ai18-activation-trigger.txt)"
          if [[ "$trigger" == "ACTIVATE_AI18" ]]; then requested=true; fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.activate }}" == "true" ]]; then requested=true; fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "AI18_ACTIVATION_REQUESTED=$requested"

      - name: Verify Cloudflare identity and existing isolated service
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'Cloudflare deployment credentials are missing.' >&2; exit 1; }
          npx wrangler whoami >/dev/null
          health="$(curl --fail --retry 5 --retry-delay 2 --retry-all-errors -sS "${WORKER_URL}/health")"
          printf '%s' "$health" | jq -e '
            .ok == true and
            .service == "storm-analysis" and
            .analysisDbBound == true and
            .workersAiEnabled == false and
            .promotionApiEnabled == true and
            .automaticPromotionEnabled == false and
            .productionStormWorkerModified == false and
            ((.importEnabled == false and .analysisAdminEnabled == false) or
             (.importEnabled == true and .analysisAdminEnabled == true))
          ' >/dev/null
          if [[ "${{ steps.gate.outputs.requested }}" != "true" ]]; then
            echo 'AI-18 mutation path is not requested.'
          fi

      - name: Validate application secrets before any mutation
        if: steps.gate.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$BACKFILL_TOKEN" && -n "$ANALYSIS_ADMIN_TOKEN" ]] || { echo 'AI-18 requires both BACKFILL_TOKEN and ANALYSIS_ADMIN_TOKEN GitHub Secrets.' >&2; exit 1; }
          [[ "$BACKFILL_TOKEN" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'BACKFILL_TOKEN must be exactly 64 hexadecimal characters generated from 32 random bytes.' >&2; exit 1; }
          [[ "$ANALYSIS_ADMIN_TOKEN" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'ANALYSIS_ADMIN_TOKEN must be exactly 64 hexadecimal characters generated from 32 random bytes.' >&2; exit 1; }
          [[ "$BACKFILL_TOKEN" != "$ANALYSIS_ADMIN_TOKEN" ]] || { echo 'The two application secrets must be distinct.' >&2; exit 1; }

      - name: Capture pre-activation deployment
        if: steps.gate.outputs.requested == 'true'
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          deployment="$(npx wrangler deployments status --name storm-analysis --json --experimental-provision=false)"
          before_id="$(printf '%s' "$deployment" | jq -r '.id // .deployment_id // empty')"
          [[ -n "$before_id" ]] || { echo 'Unable to resolve pre-activation deployment ID.' >&2; exit 1; }
          echo "AI18_DEPLOYMENT_BEFORE=$before_id" >> "$GITHUB_ENV"

      - name: Atomically activate both application secrets
        if: steps.gate.outputs.requested == 'true'
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('/tmp/ai18-secrets.json', JSON.stringify({
            BACKFILL_TOKEN: process.env.BACKFILL_TOKEN,
            ANALYSIS_ADMIN_TOKEN: process.env.ANALYSIS_ADMIN_TOKEN
          }));
          NODE
          npx wrangler secret bulk --experimental-provision=false < /tmp/ai18-secrets.json
          rm -f /tmp/ai18-secrets.json

      - name: Verify secret names and new deployment
        if: steps.gate.outputs.requested == 'true'
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --format json --experimental-provision=false > /tmp/ai18-secret-list.json
          jq -e '[.[].name] | (index("BACKFILL_TOKEN") != null) and (index("ANALYSIS_ADMIN_TOKEN") != null)' /tmp/ai18-secret-list.json >/dev/null
          deployment="$(npx wrangler deployments status --name storm-analysis --json --experimental-provision=false)"
          after_id="$(printf '%s' "$deployment" | jq -r '.id // .deployment_id // empty')"
          [[ -n "$after_id" ]] || { echo 'Unable to resolve post-activation deployment ID.' >&2; exit 1; }
          echo "AI18_DEPLOYMENT_AFTER=$after_id" >> "$GITHUB_ENV"

      - name: Verify enabled health and authorization boundaries without data writes
        if: steps.gate.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          health=''
          for attempt in {1..15}; do
            health="$(curl -sS "${WORKER_URL}/health" || true)"
            if printf '%s' "$health" | jq -e '.ok == true and .importEnabled == true and .analysisAdminEnabled == true' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          printf '%s' "$health" | jq -e '
            .ok == true and .analysisDbBound == true and
            .importEnabled == true and .analysisAdminEnabled == true and
            .workersAiEnabled == false and .automaticPromotionEnabled == false and
            .productionStormWorkerModified == false
          ' >/dev/null

          for endpoint in /api/backfill/import /api/admin/signal-training/preview /api/admin/signal-risk/promotion/preview; do
            status="$(curl -sS -o /tmp/ai18-unauth.json -w '%{http_code}' -X POST "${WORKER_URL}${endpoint}")"
            [[ "$status" == "401" ]] || { echo "Expected 401 for unauthenticated ${endpoint}, got ${status}." >&2; exit 1; }
          done

          status="$(curl -sS -o /tmp/ai18-cross.json -w '%{http_code}' -X POST "${WORKER_URL}/api/backfill/import" -H "Authorization: Bearer ${ANALYSIS_ADMIN_TOKEN}")"
          [[ "$status" == "401" ]] || { echo 'ANALYSIS_ADMIN_TOKEN must not authorize backfill import.' >&2; exit 1; }
          status="$(curl -sS -o /tmp/ai18-cross.json -w '%{http_code}' -X POST "${WORKER_URL}/api/admin/signal-training/preview" -H "Authorization: Bearer ${BACKFILL_TOKEN}")"
          [[ "$status" == "401" ]] || { echo 'BACKFILL_TOKEN must not authorize analysis-admin endpoints.' >&2; exit 1; }

          status="$(curl -sS -o /tmp/ai18-authorized.json -w '%{http_code}' -X POST "${WORKER_URL}/api/backfill/import" -H "Authorization: Bearer ${BACKFILL_TOKEN}")"
          [[ "$status" == "400" ]] || { echo "Expected safe authorized backfill probe to fail 400 before import, got ${status}." >&2; exit 1; }
          jq -e '(.error == "missing-body") or (.error == "invalid-json")' /tmp/ai18-authorized.json >/dev/null
          status="$(curl -sS -o /tmp/ai18-authorized.json -w '%{http_code}' -X POST "${WORKER_URL}/api/admin/signal-training/preview" -H "Authorization: Bearer ${ANALYSIS_ADMIN_TOKEN}")"
          [[ "$status" == "400" ]] || { echo "Expected safe authorized admin probe to fail 400 before preview, got ${status}." >&2; exit 1; }
          jq -e '(.error == "missing-body") or (.error == "invalid-json")' /tmp/ai18-authorized.json >/dev/null

          curl --fail -sS "${WORKER_URL}/api/models/champion" | jq -e '.ok == true and .readOnly == true and .model.modelVersion == "builtin-equal-v1" and .model.persisted == false' >/dev/null
          curl --fail -sS "${WORKER_URL}/api/signal-risk/profiles/champion" | jq -e '.ok == true and .readOnly == true and .available == false and .profile == null' >/dev/null

      - name: Verify ANALYSIS_DB remained unchanged by activation probes
        if: steps.gate.outputs.requested == 'true'
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute storm-analysis --remote --json --experimental-provision=false --command "SELECT (SELECT COUNT(*) FROM backfill_runs) AS backfill_runs, (SELECT COUNT(*) FROM historical_storms) AS historical_storms, (SELECT COUNT(*) FROM signal_calibration_training_runs) AS training_runs, (SELECT COUNT(*) FROM signal_outcome_curations) AS curations, (SELECT COUNT(*) FROM signal_profile_promotion_events) AS promotion_events, (SELECT generation FROM signal_calibration_state WHERE state_id = 1) AS generation, (SELECT champion_profile_id FROM signal_calibration_state WHERE state_id = 1) AS champion_profile_id;" > /tmp/ai18-db-state.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/ai18-db-state.json', 'utf8'));
          const rows = input => {
            if (Array.isArray(input)) return input.flatMap(rows);
            if (input && typeof input === 'object') {
              if (Array.isArray(input.results)) return input.results;
              return Object.values(input).flatMap(rows);
            }
            return [];
          };
          const row = rows(value).find(item => item && Object.hasOwn(item, 'backfill_runs'));
          if (!row) throw new Error('AI-18 could not resolve database state row');
          for (const key of ['backfill_runs','historical_storms','training_runs','curations','promotion_events','generation']) {
            if (Number(row[key]) !== 0) throw new Error(`AI-18 expected ${key}=0 after auth-only activation`);
          }
          if (row.champion_profile_id != null) throw new Error('AI-18 expected no signal calibration Champion');
          NODE

      - name: Record successful activation checkpoint
        if: steps.gate.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'workers/storm-analysis/wrangler.jsonc';
          let source = fs.readFileSync(path, 'utf8');
          if (!source.includes('"secrets"')) {
            const marker = '  "d1_databases": [';
            if (!source.includes(marker)) throw new Error('Could not locate D1 config marker');
            source = source.replace(marker, '  "secrets": {\n    "required": ["BACKFILL_TOKEN", "ANALYSIS_ADMIN_TOKEN"]\n  },\n  "d1_databases": [');
            fs.writeFileSync(path, source);
          }
          NODE

          cat > docs/AI18_ACTIVATION_RESULT.md <<EOF
          # AI-18 — Secure Admin Activation Result

          Status: **activated and auth-boundary verified**

          - Source commit: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`
          - Worker: \`storm-analysis\`
          - Worker URL: \`${WORKER_URL}\`
          - Deployment before secret activation: \`${AI18_DEPLOYMENT_BEFORE}\`
          - Deployment after atomic secret activation: \`${AI18_DEPLOYMENT_AFTER}\`
          - \`BACKFILL_TOKEN\`: configured as Worker secret; value not recorded
          - \`ANALYSIS_ADMIN_TOKEN\`: configured as Worker secret; value not recorded
          - Secret activation method: \`wrangler secret bulk\` in one request
          - \`importEnabled\`: true
          - \`analysisAdminEnabled\`: true
          - Cross-token authorization: rejected with HTTP 401
          - Authorized zero-body probes: HTTP 400 request-body validation before any data operation
          - ANALYSIS_DB write-state after probes: unchanged / empty
          - Signal Champion: NONE / generation 0
          - Workers AI: disabled
          - Automatic signal-profile promotion: disabled
          - Production Storm Worker modified: no

          AI-18 did not execute historical backfill, training, curation, promotion, rollback, or production Storm Worker changes.
          EOF

          printf '%s\n' 'COMPLETED_AI18' > .github/ai18-activation-trigger.txt

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['workers/storm-analysis/wrangler.jsonc','docs/AI18_ACTIVATION_RESULT.md','.github/ai18-activation-trigger.txt'];
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            for (const [name, value] of [['BACKFILL_TOKEN', process.env.BACKFILL_TOKEN], ['ANALYSIS_ADMIN_TOKEN', process.env.ANALYSIS_ADMIN_TOKEN]]) {
              if (value && text.includes(value)) throw new Error(`${name} value must never be written to repository`);
            }
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workers/storm-analysis/wrangler.jsonc docs/AI18_ACTIVATION_RESULT.md .github/ai18-activation-trigger.txt
          git diff --cached --check
          git commit -m "AI-18: record secure admin activation [skip ci]"
          git push origin HEAD:feature/ai-analysis-engine
