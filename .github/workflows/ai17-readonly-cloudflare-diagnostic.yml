name: AI-17 Read-only Cloudflare Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ai17-readonly-cloudflare-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify diagnostic credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'DIAG_CLOUDFLARE_ACCOUNT_ID=missing'; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'DIAG_CLOUDFLARE_API_TOKEN=missing'; exit 1; }
          echo 'DIAG_CLOUDFLARE_CREDENTIALS=present'

      - name: Install pinned Wrangler
        working-directory: workers/storm-analysis
        run: npm install --no-audit --no-fund

      - name: Inspect Cloudflare state without writes
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          dbs="$(npx wrangler d1 list --json --experimental-provision=false)"
          count="$(printf '%s' "$dbs" | jq '[.[] | select(.name == "storm-analysis")] | length')"
          echo "DIAG_STORM_ANALYSIS_D1_COUNT=$count"
          if [[ "$count" == "1" ]]; then
            id="$(printf '%s' "$dbs" | jq -r '.[] | select(.name == "storm-analysis") | (.uuid // .id // empty)')"
            echo "DIAG_STORM_ANALYSIS_D1_ID=$id"
          fi

          set +e
          deployment="$(npx wrangler deployments status --name storm-analysis --json --experimental-provision=false 2>&1)"
          rc=$?
          set -e
          echo "DIAG_DEPLOYMENT_STATUS_RC=$rc"
          if [[ $rc -eq 0 ]]; then
            printf '%s\n' "$deployment" | jq -c '{id: (.id // .deployment_id // null), source: (.source // null), strategy: (.strategy // null)}' 2>/dev/null || echo 'DIAG_DEPLOYMENT_STATUS=present'
          else
            echo 'DIAG_DEPLOYMENT_STATUS=absent-or-unavailable'
          fi

          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/subdomain.json
          subdomain="$(jq -r '.result.subdomain // empty' /tmp/subdomain.json)"
          echo "DIAG_WORKERS_SUBDOMAIN=$subdomain"
          if [[ -n "$subdomain" ]]; then
            url="https://storm-analysis.${subdomain}.workers.dev/health"
            set +e
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$url")"
            set -e
            echo "DIAG_HEALTH_HTTP=$code"
            if [[ "$code" == "200" ]]; then
              jq -c '{ok,service,analysisDbBound,importEnabled,analysisAdminEnabled,workersAiEnabled,promotionApiEnabled,automaticPromotionEnabled,productionStormWorkerModified}' /tmp/health.json
            fi
          fi
