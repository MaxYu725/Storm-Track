name: Audit historical replay feasibility

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - analysis/historical-replay-feasibility.js
      - scripts/audit-historical-replay-feasibility.mjs
      - tests/historical-replay-feasibility.test.cjs
      - docs/HISTORICAL_REPLAY_REUSE_AUDIT.md
      - .github/workflows/historical-replay-feasibility-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOURCE_DB_NAME: storm-track-db
      SOURCE_DB_UUID: eb0bf995-3ea7-4bf6-bbca-b425892c4d7e
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run local audit regression
        run: |
          set -euo pipefail
          node --check analysis/historical-replay-feasibility.js
          node --check scripts/audit-historical-replay-feasibility.mjs
          node tests/historical-replay-feasibility.test.cjs

      - name: Install pinned read-only D1 client
        run: npm install --no-save --ignore-scripts wrangler@4.124.0

      - name: Verify production source identity
        shell: bash
        run: |
          set -euo pipefail
          databases="$(npx wrangler d1 list --json --experimental-provision=false)"
          source_id="$(printf '%s' "$databases" | jq -r --arg name "$SOURCE_DB_NAME" '.[] | select(.name == $name) | (.uuid // .id // empty)')"
          [[ "$source_id" == "$SOURCE_DB_UUID" ]]
          echo "HISTORICAL_AUDIT_SOURCE=${SOURCE_DB_NAME}:${source_id}"
          echo 'HISTORICAL_AUDIT_WRITES=false'

      - name: Inventory 2025-2026 production storms using SELECT only
        shell: bash
        run: |
          set -euo pipefail
          SQL="
            SELECT
              s.id AS storm_key,
              s.international_number,
              s.name_en,
              s.name_zh,
              s.status,
              s.merged_into_id,
              s.first_seen_at,
              s.last_seen_at,
              COUNT(DISTINCT CASE WHEN tp.point_type='forecast' THEN a.id END) AS forecast_advisory_count,
              COUNT(CASE WHEN tp.point_type='forecast' THEN 1 END) AS forecast_point_count,
              COUNT(DISTINCT CASE WHEN tp.point_type='forecast' THEN a.agency END) AS forecast_agency_count,
              GROUP_CONCAT(DISTINCT CASE WHEN tp.point_type='forecast' THEN a.agency END) AS forecast_agencies,
              MIN(CASE WHEN tp.point_type='forecast' THEN a.issued_at END) AS first_forecast_issue_at,
              MAX(CASE WHEN tp.point_type='forecast' THEN a.issued_at END) AS last_forecast_issue_at,
              MIN(CASE WHEN tp.point_type='forecast' THEN tp.valid_at END) AS first_forecast_valid_at,
              MAX(CASE WHEN tp.point_type='forecast' THEN tp.valid_at END) AS last_forecast_valid_at
            FROM storms s
            LEFT JOIN advisories a ON a.storm_id=s.id
            LEFT JOIN track_points tp ON tp.advisory_id=a.id
            WHERE s.first_seen_at >= '2025-01-01T00:00:00Z'
              AND s.first_seen_at < '2027-01-01T00:00:00Z'
            GROUP BY s.id, s.international_number, s.name_en, s.name_zh, s.status, s.merged_into_id, s.first_seen_at, s.last_seen_at
            ORDER BY s.first_seen_at, s.id;"
          npx wrangler d1 execute "$SOURCE_DB_NAME" --remote --json --experimental-provision=false --command "$SQL" > /tmp/historical-storms-raw.json
          jq '[.. | objects | select(has("storm_key") and has("forecast_point_count"))]' /tmp/historical-storms-raw.json > /tmp/historical-storms.json
          echo "HISTORICAL_AUDIT_STORM_COUNT=$(jq 'length' /tmp/historical-storms.json)"
          echo "HISTORICAL_AUDIT_STORM_IDENTITIES=$(jq -c '[.[]|{storm_key,international_number,name_en,name_zh,status,merged_into_id,first_seen_at,last_seen_at,forecast_agency_count,forecast_advisory_count,forecast_point_count}]' /tmp/historical-storms.json)"

      - name: Inventory forecast-bearing advisories using SELECT only
        shell: bash
        run: |
          set -euo pipefail
          SQL="
            SELECT
              a.id,
              a.storm_id,
              a.agency,
              a.issued_at,
              a.fetched_at,
              a.source_code,
              a.source_url,
              a.source_hash,
              a.raw_object_key,
              a.parser_version,
              COUNT(CASE WHEN tp.point_type='forecast' THEN 1 END) AS forecast_point_count,
              MIN(CASE WHEN tp.point_type='forecast' THEN tp.valid_at END) AS first_forecast_valid_at,
              MAX(CASE WHEN tp.point_type='forecast' THEN tp.valid_at END) AS last_forecast_valid_at
            FROM advisories a
            JOIN storms s ON s.id=a.storm_id
            LEFT JOIN track_points tp ON tp.advisory_id=a.id
            WHERE s.first_seen_at >= '2025-01-01T00:00:00Z'
              AND s.first_seen_at < '2027-01-01T00:00:00Z'
            GROUP BY a.id, a.storm_id, a.agency, a.issued_at, a.fetched_at, a.source_code, a.source_url, a.source_hash, a.raw_object_key, a.parser_version
            HAVING forecast_point_count > 0
            ORDER BY a.storm_id, a.issued_at, a.agency, a.id;"
          npx wrangler d1 execute "$SOURCE_DB_NAME" --remote --json --experimental-provision=false --command "$SQL" > /tmp/historical-advisories-raw.json
          jq '[.. | objects | select(has("storm_id") and has("agency") and has("forecast_point_count"))]' /tmp/historical-advisories-raw.json > /tmp/historical-advisories.json
          echo "HISTORICAL_AUDIT_FORECAST_ADVISORY_COUNT=$(jq 'length' /tmp/historical-advisories.json)"

      - name: Inspect identity and wind-radii schemas using SELECT only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$SOURCE_DB_NAME" --remote --json --experimental-provision=false --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND name IN ('storm_aliases','wind_radii') ORDER BY name;" > /tmp/historical-support-schema.json
          echo "HISTORICAL_AUDIT_SUPPORT_SCHEMA=$(jq -c '[.. | objects | select((.name? == "storm_aliases") or (.name? == "wind_radii"))]' /tmp/historical-support-schema.json)"

      - name: Build deterministic replay feasibility report
        shell: bash
        env:
          AUDIT_GENERATED_AT: ${{ github.event.pull_request.updated_at || github.event.repository.updated_at }}
        run: |
          set -euo pipefail
          node scripts/audit-historical-replay-feasibility.mjs /tmp/historical-storms.json /tmp/historical-advisories.json > /tmp/historical-replay-audit.json
          jq -e '
            .schemaVersion == "historical-replay-feasibility/v1" and
            .targetCount == 2 and
            .source.database == "storm-track-db" and
            .source.mode == "read-only-select" and
            .source.productionDatabaseWritten == false and
            .source.productionWorkerModified == false and
            .semantics.currentV1ForecastModelNotModified == true and
            .semantics.calibrationOrTrainingPerformed == false
          ' /tmp/historical-replay-audit.json >/dev/null
          jq '{schemaVersion,generatedAt,matchedCount,cases:[.cases[]|{targetId,status,storm,replayCapability,cutoffCoverage,provenance,agencies,windRadiiAuditRequired}],semantics}' /tmp/historical-replay-audit.json

      - name: Check branch whitespace
        run: git diff --check origin/main...HEAD
