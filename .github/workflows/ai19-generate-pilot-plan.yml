name: AI-19 Generate canonical forecast-only pilot plan

on:
  push:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/ai19-plan-generation-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai19-generate-canonical-pilot-plan
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/feature/ai-analysis-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://storm-analysis.max-yu.workers.dev
    steps:
      - name: Checkout AI branch
        uses: actions/checkout@v6
        with:
          ref: feature/ai-analysis-engine
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        working-directory: workers/storm-analysis
        run: npm install --no-audit --no-fund

      - name: Run pre-plan regression gates
        shell: bash
        run: |
          set -euo pipefail
          (cd workers/storm-analysis && npm test)
          node tests/historical-backfill-importer.test.cjs
          node tests/storm-analysis-ai19.test.mjs
          (cd workers/storm-analysis && npm run test:integration)
          (cd workers/storm-analysis && npm run deploy:dry-run)

      - name: Verify AI-18 complete and AI-19 import locked
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < .github/ai18-activation-trigger.txt)" == "COMPLETED_AI18" ]]
          [[ "$(tr -d '\r\n' < .github/ai19-backfill-trigger.txt)" == "PENDING_AI19" ]]
          echo 'AI19_IMPORT_LOCKED=true'

      - name: Verify source identity and analysis Worker health
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          databases="$(npx wrangler d1 list --json --experimental-provision=false)"
          source_id="$(printf '%s' "$databases" | jq -r '.[] | select(.name == "storm-track-db") | (.uuid // .id // empty)')"
          [[ "$source_id" == "eb0bf995-3ea7-4bf6-bbca-b425892c4d7e" ]]
          health="$(curl --fail -sS "${WORKER_URL}/health")"
          printf '%s' "$health" | jq -e '.ok == true and .service == "storm-analysis" and .analysisDbBound == true and .importEnabled == true and .analysisAdminEnabled == true and .workersAiEnabled == false and .automaticPromotionEnabled == false and .productionStormWorkerModified == false' >/dev/null
          echo 'AI19_SOURCE_AND_WORKER_READY=true'

      - name: Read exact forecast evidence from production D1
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          selected_sql="WITH cutoffs(as_of) AS (VALUES ('2026-08-06T00:00:00.000Z'),('2026-08-08T00:00:00.000Z'),('2026-08-10T00:00:00.000Z'),('2026-08-12T02:00:28.000Z')), ranked AS (SELECT c.as_of, a.id, a.storm_id, a.agency, a.issued_at, a.fetched_at, a.source_code, a.source_url, a.source_hash, a.raw_object_key, a.parser_version, a.point_count, a.ingest_status, ROW_NUMBER() OVER (PARTITION BY c.as_of, a.agency ORDER BY a.issued_at DESC, a.fetched_at DESC, a.id DESC) AS rn FROM cutoffs c JOIN advisories a ON a.storm_id='WP-2026-15' AND a.issued_at <= c.as_of WHERE EXISTS (SELECT 1 FROM track_points tp WHERE tp.advisory_id=a.id AND tp.point_type='forecast' AND tp.valid_at > c.as_of)) SELECT as_of,id,storm_id,agency,issued_at,fetched_at,source_code,source_url,source_hash,raw_object_key,parser_version,point_count,ingest_status FROM ranked WHERE rn=1 ORDER BY as_of,agency;"
          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command "$selected_sql" > /tmp/ai19-selected-raw.json
          jq '[.. | objects | select(has("as_of") and has("agency") and has("id"))]' /tmp/ai19-selected-raw.json > /tmp/ai19-selected.json

          points_sql="WITH cutoffs(as_of) AS (VALUES ('2026-08-06T00:00:00.000Z'),('2026-08-08T00:00:00.000Z'),('2026-08-10T00:00:00.000Z'),('2026-08-12T02:00:28.000Z')), ranked AS (SELECT c.as_of, a.id, a.agency, a.issued_at, ROW_NUMBER() OVER (PARTITION BY c.as_of, a.agency ORDER BY a.issued_at DESC, a.fetched_at DESC, a.id DESC) AS rn FROM cutoffs c JOIN advisories a ON a.storm_id='WP-2026-15' AND a.issued_at <= c.as_of WHERE EXISTS (SELECT 1 FROM track_points x WHERE x.advisory_id=a.id AND x.point_type='forecast' AND x.valid_at > c.as_of)) SELECT r.as_of,r.agency,r.id AS advisory_id,r.issued_at,tp.valid_at,tp.forecast_hour,tp.latitude,tp.longitude,tp.pressure_hpa,tp.wind_ms,tp.gust_ms,tp.wind_averaging_minutes,tp.intensity_code,tp.intensity_label,tp.probability_radius_km,tp.source_order FROM ranked r JOIN track_points tp ON tp.advisory_id=r.id WHERE r.rn=1 AND tp.point_type='forecast' AND tp.valid_at > r.as_of ORDER BY r.as_of,r.agency,tp.valid_at,tp.source_order,tp.id;"
          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command "$points_sql" > /tmp/ai19-points-raw.json
          jq '[.. | objects | select(has("as_of") and has("advisory_id") and has("valid_at"))]' /tmp/ai19-points-raw.json > /tmp/ai19-points.json

          [[ "$(jq 'length' /tmp/ai19-selected.json)" -eq 13 ]]
          [[ "$(jq 'length' /tmp/ai19-points.json)" -eq 69 ]]
          jq -e 'all(.[]; .valid_at > .as_of)' /tmp/ai19-points.json >/dev/null
          echo 'AI19_PRODUCTION_EVIDENCE_READ_ONLY=true'

      - name: Build deterministic evidence fixture and import plan
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/ai19
          node workers/storm-analysis/scripts/ai19-build-pilot-plan.mjs \
            --advisories /tmp/ai19-selected.json \
            --points /tmp/ai19-points.json \
            --output data/ai19 \
            > /tmp/ai19-builder.json
          cat /tmp/ai19-builder.json | jq -c '{ok,evidenceSha256,planSha256,runId,rowCount,tableCounts,capability}'
          jq -e '.ok == true and .rowCount == 6 and .snapshotCount == 4 and .forecastPointCount == 69 and .capability.mode == "forecast-only" and .capability.eligibleForAgencySkill == false' /tmp/ai19-builder.json >/dev/null

      - name: Verify canonical plan using live dry-run endpoint
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/ai19-live-preview.json -w '%{http_code}' -X POST "${WORKER_URL}/api/backfill/plan" -H 'content-type: application/json' --data-binary @data/ai19/chan-hom-import-plan.json)"
          [[ "$status" == "200" ]]
          jq -e '.ok == true and .dryRun == true and .writesPerformed == false and .rowCount == 6 and .tableCounts.backfill_runs == 1 and .tableCounts.historical_storms == 1 and .tableCounts.forecast_snapshots == 4 and .tableCounts.truth_datasets == 0 and .tableCounts.truth_points == 0 and .tableCounts.signal_outcomes == 0 and .semantics.productionDatabaseWritten == false' /tmp/ai19-live-preview.json >/dev/null
          echo "AI19_LIVE_PLAN_PREVIEW=$(jq -c '.' /tmp/ai19-live-preview.json)"

      - name: Verify ANALYSIS_DB is still pristine after dry-run
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute storm-analysis --remote --json --experimental-provision=false \
            --command "SELECT (SELECT COUNT(*) FROM backfill_runs) AS backfill_runs,(SELECT COUNT(*) FROM historical_storms) AS historical_storms,(SELECT COUNT(*) FROM truth_datasets) AS truth_datasets,(SELECT COUNT(*) FROM truth_points) AS truth_points,(SELECT COUNT(*) FROM forecast_snapshots) AS forecast_snapshots,(SELECT COUNT(*) FROM signal_outcomes) AS signal_outcomes,(SELECT COUNT(*) FROM verification_results) AS verification_results,(SELECT COUNT(*) FROM agency_skill_profiles) AS agency_skill_profiles,(SELECT COUNT(*) FROM adaptive_weight_candidates) AS adaptive_weight_candidates,(SELECT COUNT(*) FROM signal_calibration_training_runs) AS training_runs,(SELECT COUNT(*) FROM signal_outcome_curations) AS curations,(SELECT COUNT(*) FROM signal_profile_promotion_events) AS promotion_events,(SELECT generation FROM signal_calibration_state WHERE state_id=1) AS generation,(SELECT champion_profile_id FROM signal_calibration_state WHERE state_id=1) AS champion_profile_id;" > /tmp/ai19-pristine.json
          row="$(jq -c '.. | objects | select(has("backfill_runs"))' /tmp/ai19-pristine.json | head -n 1)"
          echo "AI19_PRE_IMPORT_STATE=${row}"
          printf '%s' "$row" | jq -e '.backfill_runs==0 and .historical_storms==0 and .truth_datasets==0 and .truth_points==0 and .forecast_snapshots==0 and .signal_outcomes==0 and .verification_results==0 and .agency_skill_profiles==0 and .adaptive_weight_candidates==0 and .training_runs==0 and .curations==0 and .promotion_events==0 and .generation==0 and .champion_profile_id==null' >/dev/null
          echo 'AI19_ANALYSIS_DB_PRISTINE=true'

      - name: Record reviewed plan checkpoint
        shell: bash
        run: |
          set -euo pipefail
          evidence_hash="$(jq -r '.evidenceSha256' data/ai19/chan-hom-pilot-summary.json)"
          plan_hash="$(jq -r '.planSha256' data/ai19/chan-hom-pilot-summary.json)"
          run_id="$(jq -r '.runId' data/ai19/chan-hom-pilot-summary.json)"
          run_source="$(jq -r '.runSource' data/ai19/chan-hom-pilot-summary.json)"
          cat > docs/AI19_PILOT_PLAN_RESULT.md <<EOF
          # AI-19 — Forecast-only Pilot Plan Result

          Status: **canonical plan generated and live dry-run verified; import still locked**

          - Pilot storm: \`WP-2026-15\` / CHAN-HOM / 昌鴻
          - Production source: \`storm-track-db\` (read-only)
          - Selected advisories: 13
          - Future-only forecast points: 69
          - Historical snapshots: 4
          - Truth datasets / points: 0 / 0
          - Signal outcomes: 0
          - Backfill mode: \`forecast-only\`
          - Agency-skill eligible: no
          - Evidence SHA-256: \`${evidence_hash}\`
          - Canonical plan SHA-256: \`${plan_hash}\`
          - Run ID: \`${run_id}\`
          - Run source: \`${run_source}\`
          - Canonical plan rows: 6
          - Live \`POST /api/backfill/plan\`: HTTP 200, dry-run true, writesPerformed false
          - ANALYSIS_DB after dry-run: pristine / all historical and learning row counts zero
          - AI-19 trigger: \`PENDING_AI19\`

          The run source includes the complete evidence SHA-256, binding import-run idempotency to the exact selected advisory metadata and forecast points. Any evidence change produces a different run fingerprint.

          No production D1 write, ANALYSIS_DB write, training, curation, promotion, rollback, Worker deployment, secret mutation, or Workers AI operation was executed while generating this checkpoint.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ai19 docs/AI19_PILOT_PLAN_RESULT.md
          git diff --cached --check
          git commit -m "AI-19: record canonical forecast-only pilot plan [skip ci]"
          git push origin HEAD:feature/ai-analysis-engine
          echo 'AI19_PLAN_RECORDED=true'
          echo 'DIAG_CLOUDFLARE_MUTATIONS_PERFORMED=false'
