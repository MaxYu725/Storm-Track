name: AI-23 Read-only runtime observer

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/ai23-runtime-observer-probe.txt
      - .github/workflows/ai23-runtime-observer.yml

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ANALYSIS_DB_ID: 99c692b2-c932-4774-bf8d-2d7f10f6c6f8
  WORKER_URL: https://storm-analysis.max-yu.workers.dev

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical AI branch
        uses: actions/checkout@v6
        with:
          ref: feature/ai-analysis-engine
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Worker toolchain
        working-directory: workers/storm-analysis
        run: npm install --no-audit --no-fund

      - name: Observe live Worker health only
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --retry 5 --retry-delay 2 --retry-all-errors -sS "${WORKER_URL}/health")"
          printf '%s\n' "$health" | jq .
          printf '%s' "$health" | jq -e '.ok==true and .service=="storm-analysis" and .productionStormWorkerModified==false' >/dev/null
          echo "AI23_OBSERVER_VERIFICATION_VERSION=$(printf '%s' "$health" | jq -r '.verificationPersistenceVersion // "MISSING"')"
          echo "AI23_OBSERVER_TRUTH_VERSION=$(printf '%s' "$health" | jq -r '.truthAugmentationVersion // "MISSING"')"

      - name: Observe remote analysis D1 using SELECT only
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          databases="$(npx wrangler d1 list --json --experimental-provision=false)"
          analysis_id="$(printf '%s' "$databases" | jq -r '.[] | select(.name == "storm-analysis") | (.uuid // .id // empty)')"
          [[ "$analysis_id" == "$ANALYSIS_DB_ID" ]]
          npx wrangler d1 execute storm-analysis --remote --json --experimental-provision=false --command "SELECT name FROM d1_migrations ORDER BY id; SELECT (SELECT COUNT(*) FROM historical_storms) historical_storms,(SELECT COUNT(*) FROM forecast_snapshots) forecast_snapshots,(SELECT COUNT(*) FROM corpus_capture_windows) capture_windows,(SELECT COUNT(*) FROM corpus_capture_runs) capture_runs,(SELECT COUNT(*) FROM storm_identity_bindings) identity_bindings,(SELECT COUNT(*) FROM storm_identity_merges) identity_merges,(SELECT COUNT(*) FROM truth_datasets) truth_datasets,(SELECT COUNT(*) FROM truth_points) truth_points,(SELECT COUNT(*) FROM verification_results) verification_results,(SELECT COUNT(*) FROM agency_skill_profiles) agency_skill_profiles,(SELECT COUNT(*) FROM adaptive_weight_candidates) adaptive_weight_candidates,(SELECT COUNT(*) FROM signal_calibration_training_runs) training_runs,(SELECT COUNT(*) FROM signal_outcome_curations) curations,(SELECT COUNT(*) FROM signal_profile_promotion_events) promotion_events,(SELECT generation FROM signal_calibration_state WHERE state_id=1) generation,(SELECT champion_profile_id FROM signal_calibration_state WHERE state_id=1) champion_profile_id;"
          echo 'AI23_OBSERVER_REMOTE_WRITES_PERFORMED=false'
