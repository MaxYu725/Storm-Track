name: D1 hotfix validation

on:
  push:
    branches:
      - fix/d1-write-amplification-20260901
    paths:
      - scripts/patch-production-worker-d1-write-amplification.mjs
      - tests/production-worker-d1-patcher.test.mjs
      - .github/workflows/d1-hotfix-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check patcher syntax
        run: node --check scripts/patch-production-worker-d1-write-amplification.mjs
      - name: Run patcher regression
        run: node tests/production-worker-d1-patcher.test.mjs
