name: Apply Checkpoint 2 lifecycle patch

on:
  push:
    branches:
      - agent/checkpoint2-lifecycle-stability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/checkpoint2-lifecycle-stability

      - name: Apply targeted lifecycle patch
        run: python tools/apply_checkpoint2_lifecycle.py

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/storm-inline.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/storm-inline.js

      - name: Commit patched index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Improve PWA foreground recovery"
          git push origin HEAD:agent/checkpoint2-lifecycle-stability
