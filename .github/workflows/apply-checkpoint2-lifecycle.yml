name: Apply Checkpoint 2 lifecycle patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'Apply Checkpoint 2 lifecycle patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply targeted lifecycle patch
        run: python tools/apply_checkpoint2_lifecycle.py

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/storm-inline.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/storm-inline.js

      - name: Commit final lifecycle fix and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-checkpoint2-lifecycle.yml tools/apply_checkpoint2_lifecycle.py
          git commit -m "Improve PWA foreground recovery"
          git push origin HEAD:main
