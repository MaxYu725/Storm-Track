name: Run HK threat optimization

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/hk-threat-optimization-run.yml
      - .github/workflows/hk-threat-optimization.yml
      - scripts/hk-threat-optimization-followup.py
      - scripts/hk-threat-optimization-followup2.py
      - scripts/hk-threat-optimization-followup3.py
      - scripts/hk-threat-optimization-followup4.py
      - scripts/hk-threat-optimization-followup5.py
      - scripts/hk-threat-optimization-followup6.py
      - scripts/hk-threat-optimization-followup7.py
      - scripts/hk-threat-optimization-followup8.py
      - scripts/hk-threat-optimization-followup9.py
      - scripts/hk-threat-optimization-followup10.py
      - scripts/hk-threat-optimization-followup11.py
      - scripts/hk-threat-optimization-followup12.py
      - scripts/hk-threat-optimization-followup13.py
      - scripts/hk-threat-optimization-followup14.py
      - scripts/hk-threat-optimization-followup15.py
      - scripts/hk-threat-optimization-followup16.py
      - scripts/hk-threat-optimization-followup17.py
      - scripts/hk-threat-optimization-followup18.py
      - scripts/hk-threat-optimization-diagnostics.py
      - scripts/hk-live-source-smoke.mjs
      - scripts/hk-live-engine-probe.mjs
      - analysis/**
      - tests/**
      - workers/storm-analysis/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/basic-hk-signal-forecast
          fetch-depth: 0

      - name: Execute optimization patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/hk-threat-optimization.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(block, 'hk-threat-optimization.py', 'exec'), {'__name__': '__main__'})
          PY
          python scripts/hk-threat-optimization-followup.py
          python scripts/hk-threat-optimization-followup2.py
          python scripts/hk-threat-optimization-followup3.py
          python scripts/hk-threat-optimization-followup4.py
          python scripts/hk-threat-optimization-followup5.py
          python scripts/hk-threat-optimization-followup6.py
          python scripts/hk-threat-optimization-followup7.py
          python scripts/hk-threat-optimization-followup8.py
          python scripts/hk-threat-optimization-followup9.py
          python scripts/hk-threat-optimization-followup10.py
          python scripts/hk-threat-optimization-followup11.py
          python scripts/hk-threat-optimization-followup12.py
          python scripts/hk-threat-optimization-followup13.py
          python scripts/hk-threat-optimization-followup14.py
          python scripts/hk-threat-optimization-followup15.py
          python scripts/hk-threat-optimization-followup16.py
          python scripts/hk-threat-optimization-followup17.py
          python scripts/hk-threat-optimization-followup18.py
          python scripts/hk-threat-optimization-diagnostics.py
          git diff --check

      - name: Run focused tests
        working-directory: workers/storm-analysis
        run: |
          node ../../tests/hk-threat-assessment.test.cjs
          node ../../tests/hk-threat-rule-scenarios.test.cjs
          node ../../tests/hk-missing-numeric-semantics.test.cjs
          node ../../tests/hk-agency-evidence-independence.test.cjs
          node ../../tests/hk-signal-timing-uncertainty.test.cjs
          node ../../tests/hk-signal-timing-cadence-invariance.test.cjs
          node ../../tests/hk-signal-crossing-invariants.test.cjs
          node ../../tests/hk-forecast-horizon-invariants.test.cjs
          node ../../tests/hk-wind-field-selection-invariants.test.cjs
          node ../../tests/hk-interpolation-reliability-invariants.test.cjs
          node ../../tests/hk-interpolation-chord-invariants.test.cjs
          node ../../tests/hk-wind-field-interpolation-independence.test.cjs
          node ../../tests/hk-wind-field-freshness-escalation-invariants.test.cjs
          node ../../tests/basic-hk-signal-forecast.test.cjs
          node ../../tests/frontend-hk-threat-ui.test.cjs

      - name: Run full regression
        working-directory: workers/storm-analysis
        run: npm test

      - name: Read-only live source smoke
        run: node scripts/hk-live-source-smoke.mjs

      - name: Run live HKO CMA CWA acceptance through patched engine
        run: node scripts/hk-live-engine-probe.mjs
