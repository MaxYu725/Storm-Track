name: V2 terminal lifecycle check

on:
  push:
    branches:
      - feat/v2-terminal-lifecycle-decay

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          node --check analysis/frontend-hk-threat-ui.js
          node tests/hk-signal-v2-shadow.test.cjs
          node tests/frontend-hk-threat-ui.test.cjs
