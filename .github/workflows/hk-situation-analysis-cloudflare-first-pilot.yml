name: First controlled Cloudflare AI situation pilot

on:
  push:
    branches:
      - pilot/cloudflare-ai-situation-20260902
    paths:
      - .github/workflows/hk-situation-analysis-cloudflare-first-pilot.yml

permissions:
  contents: write

concurrency:
  group: hk-situation-cloudflare-first-pilot
  cancel-in-progress: false

env:
  INPUT_DATA_BRANCH: data/hk-situation-analysis-shadow-packets
  OUTPUT_DATA_BRANCH: data/hk-situation-analysis-shadow-inferences
  MODEL: '@cf/openai/gpt-oss-120b'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify Cloudflare adapter regressions
        run: |
          set -euo pipefail
          node --check analysis/hk-situation-analysis-prompt.js
          node --check scripts/run-hk-situation-analysis-shadow-cloudflare.mjs
          node tests/hk-situation-analysis-cloudflare-inference.test.cjs

      - name: Resolve Workers AI credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          account_id="${CLOUDFLARE_ACCOUNT_ID:-${CF_ACCOUNT_ID:-}}"
          api_token="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
          test -n "$account_id" || { echo "Cloudflare account ID missing" >&2; exit 2; }
          test -n "$api_token" || { echo "Cloudflare API token missing" >&2; exit 2; }
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$api_token" >> "$GITHUB_ENV"

      - name: Load immutable SAUDEL and KROVANH packets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${INPUT_DATA_BRANCH}:refs/remotes/origin/${INPUT_DATA_BRANCH}"
          git show "refs/remotes/origin/${INPUT_DATA_BRANCH}:latest.json" > /tmp/hk-situation-packet-batch.json
          jq -e '.schemaVersion == "hk-situation-analysis-shadow-packet-batch/v0.1"' /tmp/hk-situation-packet-batch.json >/dev/null
          jq --arg case_id 'STC-2026-JMA-TC2621' -e '[.packets[] | select(.caseId == $case_id)] | if length == 1 then .[0] else error("SAUDEL packet unavailable or ambiguous") end' /tmp/hk-situation-packet-batch.json > /tmp/saudel-packet.json
          jq --arg case_id 'STC-2026-JMA-TC2628' -e '[.packets[] | select(.caseId == $case_id)] | if length == 1 then .[0] else error("KROVANH packet unavailable or ambiguous") end' /tmp/hk-situation-packet-batch.json > /tmp/krovanh-packet.json
          jq '{caseId,groupKey,packetFingerprint,sourceObservationObservedAt,provenance:{localWindJoin:.provenance.localWindJoin}}' /tmp/saudel-packet.json
          jq '{caseId,groupKey,packetFingerprint,sourceObservationObservedAt,provenance:{localWindJoin:.provenance.localWindJoin}}' /tmp/krovanh-packet.json

      - name: Run SAUDEL stress inference
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-hk-situation-analysis-shadow-cloudflare.mjs /tmp/saudel-packet.json "$MODEL" > /tmp/saudel-inference.json
          test -s /tmp/saudel-inference.json

      - name: Run KROVANH control inference
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-hk-situation-analysis-shadow-cloudflare.mjs /tmp/krovanh-packet.json "$MODEL" > /tmp/krovanh-inference.json
          test -s /tmp/krovanh-inference.json

      - name: Validate both inference isolation contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in /tmp/saudel-inference.json /tmp/krovanh-inference.json; do
            jq -e '
              .schemaVersion == "hk-situation-analysis-shadow-inference/v0.1" and
              .prompt.version == "hk-situation-analysis-prompt/v0.1" and
              .provider.name == "cloudflare-workers-ai-chat-completions" and
              .provider.requestedModel == "@cf/openai/gpt-oss-120b" and
              .provider.store == false and
              .provider.toolsEnabled == false and
              .output.schemaVersion == "hk-situation-analysis-shadow-output/v0.1" and
              .semantics.shadowOnly == true and
              .semantics.affectsForecast == false and
              .semantics.affectsEvaluator == false and
              .semantics.noTruthFeedback == true and
              .semantics.noExternalTools == true and
              .semantics.noWebSearch == true and
              .semantics.inputPacketIsSoleMeteorologicalEvidence == true and
              .semantics.caseSpecificRulesForbidden == true and
              .semantics.localValidationRequired == true
            ' "$file" >/dev/null
          done
          echo 'SAUDEL:'
          jq '{input,provider:{requestedModel,returnedModel,usage},output}' /tmp/saudel-inference.json
          echo 'KROVANH:'
          jq '{input,provider:{requestedModel,returnedModel,usage},output}' /tmp/krovanh-inference.json

      - name: Persist both immutable pilot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$OUTPUT_DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$OUTPUT_DATA_BRANCH"
            git switch -C "$OUTPUT_DATA_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$OUTPUT_DATA_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          provider_slug='cloudflare-workers-ai'
          for src in /tmp/saudel-inference.json /tmp/krovanh-inference.json; do
            case_id="$(jq -r '.input.caseId' "$src")"
            case_slug="$(printf '%s' "$case_id" | sed -E 's/[^A-Za-z0-9._-]+/_/g')"
            packet_fingerprint="$(jq -r '.input.packetFingerprint' "$src")"
            request_fingerprint="$(jq -r '.prompt.requestFingerprint' "$src")"
            created_at="$(jq -r '.createdAt' "$src")"
            day_path="$(date -u -d "$created_at" +'%Y/%m/%d')"
            stamp="$(date -u -d "$created_at" +'%Y%m%dT%H%M%SZ')"
            destination="inferences/${case_slug}/${provider_slug}/${day_path}/${stamp}-${packet_fingerprint:0:12}-${request_fingerprint:0:12}.json"
            provider_latest="cases/${case_slug}/providers/${provider_slug}/latest.json"
            mkdir -p "$(dirname "$destination")" "$(dirname "$provider_latest")"
            cp "$src" "$destination"
            cp "$src" "$provider_latest"
            cp "$src" latest.json
            jq -c '{schemaVersion,createdAt,input,prompt,provider:{name:.provider.name,requestedModel:.provider.requestedModel,returnedModel:.provider.returnedModel,responseId:.provider.responseId,status:.provider.status,temperature:.provider.temperature,seed:.provider.seed,maxTokens:.provider.maxTokens,usage:.provider.usage},summary:{currentPhase:.output.currentPhase,currentPhaseConfidence:.output.currentPhaseConfidence,nextDecisionQuestion:.output.nextDecisionWindow.question},semantics}' "$src" >> index.ndjson
          done

          git add inferences cases latest.json index.ndjson
          git commit -m 'Record first Cloudflare AI situation pilot SAUDEL and KROVANH'
          git push origin "HEAD:${OUTPUT_DATA_BRANCH}"
