name: Live HK threat probe runner

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/live-hk-threat-probe-runner.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Reuse live probe program in ESM mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/live-hk-threat-probe.yml').read_text(encoding='utf-8')
          marker = "          node <<'NODE'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          NODE", start)
          lines = source[start:end].splitlines()
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          program = program.replace("require('./analysis/storm-analysis-core.js');", "await import('./analysis/storm-analysis-core.js');")
          program = program.replace("require('./analysis/hk-impact-engine.js');", "await import('./analysis/hk-impact-engine.js');")
          program = program.replace("require('./analysis/hko-signal-risk-inputs.js');", "await import('./analysis/hko-signal-risk-inputs.js');")
          program = program.replace("require('./analysis/hk-threat-assessment.js');", "await import('./analysis/hk-threat-assessment.js');")
          program = program.replace("require('./analysis/basic-hk-signal-forecast.js');", "await import('./analysis/basic-hk-signal-forecast.js');")
          program = program.replace("require('./analysis/frontend-hk-threat-ui.js');", "await import('./analysis/frontend-hk-threat-ui.js');")
          Path('live-probe.mjs').write_text(program + '\n', encoding='utf-8')
          PY
          node live-probe.mjs
