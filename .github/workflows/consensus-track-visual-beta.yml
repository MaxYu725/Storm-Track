name: CT-0 visual consensus-track Beta

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - consensus.html
      - analysis/consensus-track-overlay.js
      - analysis/storm-analysis-core.js
      - tests/consensus-track-overlay.test.cjs
      - scripts/validate-consensus-track-visual.mjs
      - .github/workflows/consensus-track-visual-beta.yml

permissions:
  contents: read

jobs:
  visual-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate consensus visual modules
        run: |
          set -euo pipefail
          node --check analysis/consensus-track-overlay.js
          node --check scripts/validate-consensus-track-visual.mjs
          node tests/storm-analysis-core.test.cjs
          node tests/consensus-track-overlay.test.cjs
          grep -F 'src="./?beta=hk-signal&consensusTrack=1"' consensus.html
          grep -F "script.src = './analysis/consensus-track-overlay.js'" consensus.html

      - name: Install lightweight browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0

      - name: Start PR-local frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/storm-track-http.log 2>&1 &
          echo $! > /tmp/storm-track-http.pid
          sleep 2
          curl --fail --retry 3 -sS http://127.0.0.1:4173/consensus.html >/dev/null

      - name: Run live visual smoke check
        shell: bash
        env:
          CONSENSUS_BETA_URL: http://127.0.0.1:4173/consensus.html
          CONSENSUS_SCREENSHOT: /tmp/consensus-track-beta.png
        run: |
          set -euo pipefail
          node scripts/validate-consensus-track-visual.mjs > /tmp/consensus-track-visual.json
          jq -e '
            .state.enabled == true and
            .state.trackCount > 0 and
            .state.pointCount > 0 and
            .state.segmentCount > 0 and
            .hudVisible == true and
            .paneInstalled == true and
            .semantics.displayOnly == true and
            .semantics.officialAgencyLayersModified == false and
            .semantics.hkSignalInputsModified == false and
            .semantics.probabilityCalibrated == false
          ' /tmp/consensus-track-visual.json >/dev/null
          cat /tmp/consensus-track-visual.json
          test -s /tmp/consensus-track-beta.png

      - name: Upload visual smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: consensus-track-beta-visual
          path: |
            /tmp/consensus-track-visual.json
            /tmp/consensus-track-beta.png
          if-no-files-found: error
          retention-days: 7

      - name: Check whitespace
        run: git diff --check origin/main...HEAD
