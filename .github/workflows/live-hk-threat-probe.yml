name: Live HK threat probe

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/live-hk-threat-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch live agencies and run sub-daily HK threat analysis
        shell: bash
        run: |
          node <<'NODE'
          const HK = { lat: 22.3023, lon: 114.1746 };
          const WORKER = 'https://storm.max-yu.workers.dev';
          const HKO_LIST = 'https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml';
          const NMC_LIST = 'https://typhoon.nmc.cn/weatherservice/typhoon/jsons/list_default';

          const textTag = (xml, tag) => {
            const match = String(xml || '').match(new RegExp(`<${tag}(?:\\s[^>]*)?>([\\s\\S]*?)<\\/${tag}>`, 'i'));
            return match ? match[1].replace(/<[^>]+>/g, '').trim() : '';
          };
          const blocks = (xml, tag) => [...String(xml || '').matchAll(new RegExp(`<${tag}(?:\\s[^>]*)?>([\\s\\S]*?)<\\/${tag}>`, 'gi'))].map(match => match[1]);
          const coord = value => {
            const raw = String(value || '').trim().toUpperCase();
            const number = Number.parseFloat(raw.replace(/[^0-9.+-]/g, ''));
            if (!Number.isFinite(number)) return null;
            return raw.endsWith('S') || raw.endsWith('W') ? -number : number;
          };
          const distanceKm = (a, b) => {
            const R = 6371;
            const rad = d => d * Math.PI / 180;
            const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(h));
          };
          const fetchText = async url => {
            const response = await fetch(url, { headers: { Accept: '*/*' }, cache: 'no-store' });
            const body = await response.text();
            if (!response.ok) throw new Error(`${url} -> HTTP ${response.status}: ${body.slice(0, 160)}`);
            return body;
          };
          const proxyText = url => fetchText(`${WORKER}/?url=${encodeURIComponent(url)}`);
          const jsonp = text => {
            const raw = String(text || '').replace(/^\uFEFF/, '').trim();
            const candidates = [raw];
            const l = raw.indexOf('('), r = raw.lastIndexOf(')');
            if (l >= 0 && r > l) {
              let inner = raw.slice(l + 1, r).trim();
              candidates.push(inner);
              while (inner.startsWith('(') && inner.endsWith(')')) {
                inner = inner.slice(1, -1).trim();
                candidates.push(inner);
              }
            }
            const os = raw.indexOf('{'), oe = raw.lastIndexOf('}');
            if (os >= 0 && oe > os) candidates.push(raw.slice(os, oe + 1));
            for (const candidate of [...new Set(candidates)]) {
              try { return JSON.parse(candidate); } catch {}
            }
            throw new Error(`JSONP parse failed: ${raw.slice(0, 120)}`);
          };
          const nmcTime = value => {
            const raw = String(value ?? '').trim();
            if (!raw) return null;
            if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return /Z$|[+-]\d{2}:?\d{2}$/.test(raw) ? raw : `${raw.replace(' ', 'T')}Z`;
            const digits = raw.replace(/\D/g, '');
            return digits.length >= 12 ? `${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}T${digits.slice(8,10)}:${digits.slice(10,12)}:00Z` : raw;
          };
          const addHours = (base, hours) => new Date(new Date(base).getTime() + Number(hours) * 3600000).toISOString();
          const finitePoint = point => point && Number.isFinite(Number(point.lat)) && Number.isFinite(Number(point.lon));

          function parseHkoPoint(xml, kind) {
            const lat = coord(textTag(xml, 'Latitude'));
            const lon = coord(textTag(xml, 'Longitude'));
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
            return {
              kind,
              lat,
              lon,
              time: textTag(xml, 'Time') || null,
              intensity: textTag(xml, 'Intensity') || null,
              maximumWind: textTag(xml, 'MaximumWind') || null,
              pressure: textTag(xml, 'CentralPressure') || null
            };
          }
          async function loadHko() {
            const list = await fetchText(HKO_LIST);
            const refs = blocks(list, 'TropicalCyclone').map(block => ({
              sourceId: textTag(block, 'TropicalCycloneID'),
              nameTc: textTag(block, 'TropicalCycloneChineseName'),
              nameEn: textTag(block, 'TropicalCycloneEnglishName'),
              url: textTag(block, 'TropicalCycloneURL')
            })).filter(item => item.url);
            const storms = [];
            for (const ref of refs) {
              const xml = await fetchText(ref.url.replace(/^http:/, 'https:'));
              const report = blocks(xml, 'WeatherReport')[0] || xml;
              const positions = [
                ...blocks(report, 'PastInformation').map(item => parseHkoPoint(item, 'past')),
                ...blocks(report, 'AnalysisInformation').map(item => parseHkoPoint(item, 'analysis'))
              ].filter(finitePoint);
              const forecast = blocks(report, 'ForecastInformation').map(item => parseHkoPoint(item, 'forecast')).filter(finitePoint);
              storms.push({
                agency: 'HKO', ...ref, bulletinTime: textTag(xml, 'BulletinTime') || positions.at(-1)?.time || null,
                positions, forecast,
                displayName: ref.nameEn && ref.nameEn !== ref.nameTc ? `${ref.nameTc} (${ref.nameEn})` : (ref.nameTc || ref.nameEn)
              });
            }
            return storms;
          }

          function parseNmcPast(point) {
            if (!Array.isArray(point)) return null;
            const lon = Number(point[4]), lat = Number(point[5]);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
            const windRadii = Array.isArray(point[10]) ? point[10].map(item => Array.isArray(item) ? ({
              level: String(item[0] || ''), ne: Number(item[1]) || 0, se: Number(item[2]) || 0,
              sw: Number(item[3]) || 0, nw: Number(item[4]) || 0
            }) : null).filter(Boolean) : [];
            return { kind: 'past', lat, lon, time: nmcTime(point[1]), pressure: point[6] ?? null, maximumWind: point[7] ?? null, intensity: point[3] ?? null, windRadii };
          }
          function parseNmcForecast(point) {
            if (!Array.isArray(point)) return null;
            const lon = Number(point[2]), lat = Number(point[3]);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
            const baseTime = nmcTime(point[1]);
            return { kind: 'forecast', forecastHour: Number(point[0]), lat, lon, time: addHours(baseTime, point[0]), baseTime, pressure: point[4] ?? null, maximumWind: point[5] ?? null, intensity: point[7] ?? null };
          }
          async function loadCma() {
            const listUrl = `${NMC_LIST}?t=${Date.now()}&callback=typhoon_jsons_list_default`;
            const listData = jsonp(await proxyText(listUrl));
            const active = (Array.isArray(listData?.typhoonList) ? listData.typhoonList : []).filter(item => ['start','active','1'].includes(String(item?.[7] || '').trim().toLowerCase()));
            const storms = [];
            for (const item of active) {
              const id = String(item[0] || '').trim();
              const callback = `typhoon_jsons_view_${id.replace(/[^A-Za-z0-9_]/g, '_')}`;
              const url = `https://typhoon.nmc.cn/weatherservice/typhoon/jsons/view_${encodeURIComponent(id)}?t=${Date.now()}&callback=${callback}`;
              const detail = jsonp(await proxyText(url));
              const stormInfo = detail?.typhoon;
              if (!Array.isArray(stormInfo)) continue;
              const pastRaw = Array.isArray(stormInfo[8]) ? stormInfo[8] : [];
              const positions = pastRaw.map(parseNmcPast).filter(finitePoint);
              let source = null;
              for (let index = pastRaw.length - 1; index >= 0; index--) {
                const container = pastRaw[index]?.[11];
                if (!container || typeof container !== 'object' || Array.isArray(container)) continue;
                const key = Object.keys(container).find(value => value.toUpperCase() === 'BABJ');
                if (key && Array.isArray(container[key]) && container[key].length) { source = { base: pastRaw[index], points: container[key] }; break; }
              }
              const forecast = (source?.points || []).map(parseNmcForecast).filter(finitePoint);
              if (!forecast.length) continue;
              storms.push({ agency: 'CMA', sourceId: id, nameEn: String(item[1] || '').trim(), nameTc: String(item[2] || '').trim(), bulletinTime: nmcTime(source?.base?.[1]) || positions.at(-1)?.time || null, positions, forecast });
            }
            return storms;
          }

          const asArray = value => Array.isArray(value) ? value : (value == null ? [] : [value]);
          const cwaTime = value => { const d = new Date(String(value || '').trim()); return Number.isNaN(d.getTime()) ? String(value || '') : d.toISOString(); };
          function cwaPoint(item, forecast) {
            const lon = Number(item?.CoordinateLongitude), lat = Number(item?.CoordinateLatitude);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
            const forecastHour = forecast ? Number(item.ForecastHour) : null;
            const baseTime = forecast ? cwaTime(item.InitialTime) : null;
            const windRadii = [];
            for (const [level, circle] of [['15 m/s', item?.Circle15ms], ['25 m/s', item?.Circle25ms]]) {
              if (!circle || typeof circle !== 'object') continue;
              const scalar = Number(circle.Radius) || 0;
              const radii = { level, ne: scalar, se: scalar, sw: scalar, nw: scalar };
              for (const entry of asArray(circle?.QuadrantRadii?.Radius)) {
                const dir = String(entry?.dir || '').toLowerCase(), value = Number(entry?.value);
                if (dir in radii && Number.isFinite(value)) radii[dir] = value;
              }
              windRadii.push(radii);
            }
            return {
              kind: forecast ? 'forecast' : 'analysis', lat, lon,
              time: forecast ? addHours(baseTime, forecastHour) : cwaTime(item.DateTime),
              baseTime, forecastHour,
              maximumWind: item.MaxWindSpeed ?? null, maximumGust: item.MaxGustSpeed ?? null,
              pressure: item.Pressure ?? null, windRadii
            };
          }
          async function loadCwa() {
            const response = await fetch(`${WORKER}/api/cwa`, { headers: { Accept: 'application/json' }, cache: 'no-store' });
            const data = await response.json();
            if (!response.ok) throw new Error(`CWA HTTP ${response.status}: ${JSON.stringify(data).slice(0,160)}`);
            const raw = data?.records?.TropicalCyclones?.TropicalCyclone;
            return asArray(raw).map(cyclone => {
              const positions = asArray(cyclone?.AnalysisData?.Fix).map(item => cwaPoint(item, false)).filter(finitePoint);
              const forecast = asArray(cyclone?.ForecastData?.Fix).map(item => cwaPoint(item, true)).filter(finitePoint);
              if (!positions.length && !forecast.length) return null;
              return {
                agency: 'CWA', sourceId: `${cyclone.Year || ''}-${cyclone.CwaTyNo || cyclone.CwaTdNo || cyclone.TyphoonName || 'unknown'}`,
                nameEn: String(cyclone.TyphoonName || '').trim(), nameTc: String(cyclone.CwaTyphoonName || '').trim(),
                bulletinTime: forecast[0]?.baseTime || positions.at(-1)?.time || null, positions, forecast
              };
            }).filter(Boolean);
          }

          const [hkoStorms, cmaStorms, cwaStorms] = await Promise.all([loadHko(), loadCma(), loadCwa()]);
          const currentOf = storm => storm?.positions?.at(-1) || storm?.forecast?.[0] || null;
          const distanceToHk = storm => { const p = currentOf(storm); return p ? distanceKm(HK, p) : Infinity; };
          const hko = hkoStorms.slice().sort((a,b) => distanceToHk(a) - distanceToHk(b))[0];
          if (!hko) throw new Error('No HKO active storm available');
          const hkoCurrent = currentOf(hko);
          const compatible = storm => {
            const current = currentOf(storm);
            if (!current) return Infinity;
            const separation = distanceKm(hkoCurrent, current);
            const timeGap = Math.abs(new Date(hkoCurrent.time).getTime() - new Date(current.time).getTime()) / 3600000;
            return timeGap <= 18 ? separation : Infinity;
          };
          const cma = cmaStorms.slice().sort((a,b) => compatible(a) - compatible(b))[0];
          const cwa = cwaStorms.slice().sort((a,b) => compatible(a) - compatible(b))[0];
          const sources = { HKO: hko };
          if (cma && compatible(cma) <= 350) sources.CMA = cma;
          if (cwa && compatible(cwa) <= 350) sources.CWA = cwa;
          const group = { key: `LIVE-${hko.sourceId}`, displayName: hko.displayName || hko.nameTc || hko.nameEn || hko.sourceId, nameTc: hko.nameTc, nameEn: hko.nameEn, sources };

          require('./analysis/storm-analysis-core.js');
          require('./analysis/hk-impact-engine.js');
          require('./analysis/hko-signal-risk-inputs.js');
          require('./analysis/hk-threat-assessment.js');
          require('./analysis/basic-hk-signal-forecast.js');
          require('./analysis/frontend-hk-threat-ui.js');

          const currentTimes = Object.values(sources).map(source => currentOf(source)?.time).filter(Boolean).map(value => new Date(value).getTime()).filter(Number.isFinite);
          const generatedAt = new Date(Math.max(...currentTimes)).toISOString();
          const result = globalThis.StormHkThreatUi.analyzeGroup(group, { generatedAt });
          if (!result.available) throw new Error(`analysis unavailable: ${result.reason} ${result.error || ''}`);

          const sourceSummary = Object.fromEntries(Object.entries(sources).map(([agency, source]) => {
            const current = currentOf(source);
            return [agency, {
              sourceId: source.sourceId, nameEn: source.nameEn, currentTime: current?.time,
              lat: current?.lat, lon: current?.lon, distanceToHkKm: current ? Math.round(distanceKm(HK, current)) : null,
              wind: current?.maximumWind, forecastPoints: source.forecast?.length || 0,
              proximityMatchKm: agency === 'HKO' ? 0 : Math.round(compatible(source))
            }];
          }));
          const timeline = result.threatAssessment.timeline.map(item => ({
            label: item.label, validTime: item.validTime, distanceMedianKm: item.distanceMedianKm == null ? null : Math.round(item.distanceMedianKm),
            windMedianMs: item.windMedianMs, support: item.supportAgencyCount, officialSupport: item.exactOfficialSupportCount,
            approachRateKmh: item.approachRateKmh == null ? null : Number(item.approachRateKmh.toFixed(1)),
            strengtheningRateMsPerHour: item.strengtheningRateMsPerHour == null ? null : Number(item.strengtheningRateMsPerHour.toFixed(2)),
            rapidEvolutionIndex: Number(item.rapidEvolutionIndex.toFixed(3)), threatIndex: Number(item.threatIndex.toFixed(3))
          }));
          const signals = Object.fromEntries(['T1','T3','T8'].map(code => [code, {
            likelihood: result.basicForecast.signals[code].likelihood,
            riskIndex: Number(result.basicForecast.signals[code].riskIndex.toFixed(3)),
            estimatedWindow: result.basicForecast.signals[code].estimatedWindow
          }]));
          console.log('LIVE_SOURCE_SUMMARY=' + JSON.stringify(sourceSummary, null, 2));
          console.log('LIVE_THREAT_SUMMARY=' + JSON.stringify({
            generatedAt,
            impact: result.basicForecast.impact,
            analyzers: result.threatAssessment.analyzers,
            fastestEvolution: result.threatAssessment.summary.fastestEvolution,
            strongestTimelineThreat: result.threatAssessment.summary.strongestTimelineThreat,
            signals,
            timeline
          }, null, 2));
          NODE
