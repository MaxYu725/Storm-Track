name: Apply D1 cross-advisory alpha.4

on:
  push:
    branches:
      - fix/d1-cross-advisory-dedup-alpha4
    paths:
      - scripts/patch-production-worker-d1-cross-advisory.mjs
      - tests/production-worker-d1-alpha4-patcher.test.mjs
      - .github/workflows/apply-d1-cross-advisory-alpha4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d1-cross-advisory-dedup-alpha4

      - name: Validate alpha.4 patcher
        run: node tests/production-worker-d1-alpha4-patcher.test.mjs

      - name: Generate alpha.4 Worker
        run: |
          node scripts/patch-production-worker-d1-cross-advisory.mjs backend/worker.js /tmp/worker.alpha4.js
          mv /tmp/worker.alpha4.js backend/worker.js

      - name: Validate generated Worker
        run: |
          node --check backend/worker.js
          grep -F "const VERSION = '3.3.0-alpha.4';" backend/worker.js
          grep -F "const latestAnalysis = normalizedAnalysis.reduce" backend/worker.js
          grep -F "const seenAnalysisTimes = new Set();" backend/worker.js

      - name: Commit generated Worker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/worker.js
          if git diff --cached --quiet; then
            echo "Generated Worker is already current."
            exit 0
          fi
          git commit -m "Generate production Worker v3.3.0-alpha.4"
          git push origin HEAD:fix/d1-cross-advisory-dedup-alpha4
