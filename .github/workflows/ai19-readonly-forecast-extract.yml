name: AI-19 Read-only forecast evidence extraction

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/ai19-readonly-forecast-extract.yml
      - tests/storm-analysis-ai19.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    if: github.base_ref == 'feature/ai-analysis-engine' || github.ref == 'refs/heads/feature/ai-analysis-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ai-analysis-engine
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        working-directory: workers/storm-analysis
        run: npm install --no-audit --no-fund

      - name: Run AI-19 read-only guard
        run: node tests/storm-analysis-ai19.test.mjs

      - name: Verify interlock and source identity
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < ../../.github/ai19-backfill-trigger.txt)" == "PENDING_AI19" ]]
          databases="$(npx wrangler d1 list --json --experimental-provision=false)"
          source_id="$(printf '%s' "$databases" | jq -r '.[] | select(.name == "storm-track-db") | (.uuid // .id // empty)')"
          [[ "$source_id" == "eb0bf995-3ea7-4bf6-bbca-b425892c4d7e" ]]
          echo 'AI19_IMPORT_LOCKED=true'

      - name: Extract deterministic forecast evidence using SELECT only
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          selected_sql="WITH cutoffs(as_of) AS (VALUES ('2026-08-06T00:00:00.000Z'),('2026-08-08T00:00:00.000Z'),('2026-08-10T00:00:00.000Z'),('2026-08-12T02:00:28.000Z')), ranked AS (SELECT c.as_of, a.id, a.storm_id, a.agency, a.issued_at, a.fetched_at, a.source_code, a.source_url, a.source_hash, a.raw_object_key, a.parser_version, a.point_count, a.ingest_status, ROW_NUMBER() OVER (PARTITION BY c.as_of, a.agency ORDER BY a.issued_at DESC, a.fetched_at DESC, a.id DESC) AS rn FROM cutoffs c JOIN advisories a ON a.storm_id='WP-2026-15' AND a.issued_at <= c.as_of WHERE EXISTS (SELECT 1 FROM track_points tp WHERE tp.advisory_id=a.id AND tp.point_type='forecast')) SELECT as_of,id,storm_id,agency,issued_at,fetched_at,source_code,source_url,source_hash,raw_object_key,parser_version,point_count,ingest_status FROM ranked WHERE rn=1 ORDER BY as_of,agency;"
          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command "$selected_sql" > /tmp/ai19-selected-advisories.json
          selected="$(jq -c '[.. | objects | select(has("as_of") and has("agency") and has("id"))]' /tmp/ai19-selected-advisories.json)"
          echo "AI19_SELECTED_ADVISORIES=${selected}"
          [[ "$(printf '%s' "$selected" | jq 'length')" -le 16 ]]
          [[ "$(printf '%s' "$selected" | jq '[.[].as_of] | unique | length')" -eq 4 ]]

          points_sql="WITH cutoffs(as_of) AS (VALUES ('2026-08-06T00:00:00.000Z'),('2026-08-08T00:00:00.000Z'),('2026-08-10T00:00:00.000Z'),('2026-08-12T02:00:28.000Z')), ranked AS (SELECT c.as_of, a.id, a.agency, a.issued_at, ROW_NUMBER() OVER (PARTITION BY c.as_of, a.agency ORDER BY a.issued_at DESC, a.fetched_at DESC, a.id DESC) AS rn FROM cutoffs c JOIN advisories a ON a.storm_id='WP-2026-15' AND a.issued_at <= c.as_of WHERE EXISTS (SELECT 1 FROM track_points x WHERE x.advisory_id=a.id AND x.point_type='forecast')) SELECT r.as_of,r.agency,r.id AS advisory_id,r.issued_at,tp.valid_at,tp.forecast_hour,tp.latitude,tp.longitude,tp.pressure_hpa,tp.wind_ms,tp.gust_ms,tp.wind_averaging_minutes,tp.intensity_code,tp.intensity_label,tp.probability_radius_km,tp.source_order FROM ranked r JOIN track_points tp ON tp.advisory_id=r.id WHERE r.rn=1 AND tp.point_type='forecast' ORDER BY r.as_of,r.agency,tp.valid_at,tp.source_order,tp.id;"
          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command "$points_sql" > /tmp/ai19-forecast-points.json
          points="$(jq -c '[.. | objects | select(has("as_of") and has("advisory_id") and has("valid_at"))]' /tmp/ai19-forecast-points.json)"
          echo "AI19_FORECAST_POINTS=${points}"
          echo "AI19_FORECAST_POINT_COUNT=$(printf '%s' "$points" | jq 'length')"

          coverage="$(printf '%s' "$points" | jq -c 'group_by(.as_of) | map({asOf:.[0].as_of,agencies:(group_by(.agency)|map({agency:.[0].agency,points:length,advisoryId:.[0].advisory_id,issuedAt:.[0].issued_at}))})')"
          echo "AI19_SNAPSHOT_COVERAGE=${coverage}"

      - name: Reconfirm production source and ANALYSIS_DB were not mutated
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command "SELECT COUNT(*) AS advisories FROM advisories WHERE storm_id='WP-2026-15';" > /tmp/ai19-prod-count.json
          echo "AI19_PROD_CHANHOM_ADVISORIES=$(jq -c '[.. | objects | select(has("advisories")) | .advisories]' /tmp/ai19-prod-count.json)"
          npx wrangler d1 execute storm-analysis --remote --json --experimental-provision=false --command "SELECT (SELECT COUNT(*) FROM backfill_runs) AS backfill_runs,(SELECT COUNT(*) FROM historical_storms) AS historical_storms,(SELECT COUNT(*) FROM truth_points) AS truth_points,(SELECT COUNT(*) FROM forecast_snapshots) AS forecast_snapshots,(SELECT COUNT(*) FROM signal_calibration_training_runs) AS training_runs,(SELECT generation FROM signal_calibration_state WHERE state_id=1) AS generation,(SELECT champion_profile_id FROM signal_calibration_state WHERE state_id=1) AS champion_profile_id;" > /tmp/ai19-state.json
          row="$(jq -c '.. | objects | select(has("backfill_runs"))' /tmp/ai19-state.json | head -n 1)"
          echo "AI19_ANALYSIS_STATE=${row}"
          printf '%s' "$row" | jq -e '.backfill_runs==0 and .historical_storms==0 and .truth_points==0 and .forecast_snapshots==0 and .training_runs==0 and .generation==0 and .champion_profile_id==null' >/dev/null
          echo 'DIAG_MUTATIONS_PERFORMED=false'
