name: AI-22C Read-only WP-2026-16 lifecycle preview

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/ai22-lifecycle-trigger.txt
      - .github/workflows/ai22-readonly-wp16-lifecycle-preview.yml
      - workers/storm-analysis/scripts/ai22-select-lifecycle-cutoffs.mjs
      - workers/storm-analysis/scripts/ai22-build-lifecycle-capture.mjs
      - tests/storm-analysis-ai22-selector.test.mjs
      - workers/storm-analysis/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai22c-wp16-readonly-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOURCE_DB_ID: eb0bf995-3ea7-4bf6-bbca-b425892c4d7e
      ANALYSIS_DB_ID: 99c692b2-c932-4774-bf8d-2d7f10f6c6f8
      STORM_KEY: WP-2026-16
      WINDOW_ID: wp-2026-16-operational-202608
    steps:
      - name: Checkout canonical AI branch
        uses: actions/checkout@v6
        with:
          ref: feature/ai-analysis-engine
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Worker toolchain
        working-directory: workers/storm-analysis
        run: npm install --no-audit --no-fund

      - name: Verify AI-22 selector and deployment config
        working-directory: workers/storm-analysis
        run: |
          npm test
          npm run check:config

      - name: Verify pinned Cloudflare database identities
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          databases="$(npx wrangler d1 list --json --experimental-provision=false)"
          source_id="$(printf '%s' "$databases" | jq -r '.[] | select(.name == "storm-track-db") | (.uuid // .id // empty)')"
          analysis_id="$(printf '%s' "$databases" | jq -r '.[] | select(.name == "storm-analysis") | (.uuid // .id // empty)')"
          [[ "$source_id" == "$SOURCE_DB_ID" ]]
          [[ "$analysis_id" == "$ANALYSIS_DB_ID" ]]
          echo 'AI22_DATABASE_IDENTITIES_VERIFIED=true'

      - name: Extract WP-2026-16 source evidence using SELECT only
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command \
            "SELECT id,name_zh,name_en,status,international_number,merged_into_id,created_at,updated_at FROM storms WHERE id='${STORM_KEY}' LIMIT 1;" \
            > /tmp/ai22-wp16-storm-raw.json
          jq '[.. | objects | select(.id == "WP-2026-16" and has("status"))] | first' /tmp/ai22-wp16-storm-raw.json > /tmp/ai22-wp16-storm.json
          jq -e '.id == "WP-2026-16" and (.merged_into_id == null) and (.status != "merged")' /tmp/ai22-wp16-storm.json >/dev/null

          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command \
            "SELECT a.id,a.storm_id,a.agency,a.issued_at,a.fetched_at,a.source_code,a.source_url,a.source_hash,a.raw_object_key,a.parser_version FROM advisories a WHERE a.storm_id='${STORM_KEY}' AND EXISTS (SELECT 1 FROM track_points tp WHERE tp.advisory_id=a.id AND tp.point_type='forecast' AND tp.valid_at>a.issued_at) ORDER BY a.issued_at,a.agency,a.id;" \
            > /tmp/ai22-wp16-advisories-raw.json
          jq '[.. | objects | select(.storm_id == "WP-2026-16" and has("agency") and has("source_hash"))]' /tmp/ai22-wp16-advisories-raw.json > /tmp/ai22-wp16-advisories.json

          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command \
            "SELECT a.storm_id,a.agency,tp.advisory_id,tp.valid_at,tp.forecast_hour,tp.latitude,tp.longitude,tp.pressure_hpa,tp.wind_ms,tp.gust_ms,tp.wind_averaging_minutes,tp.intensity_code,tp.intensity_label,tp.probability_radius_km,tp.source_order FROM advisories a JOIN track_points tp ON tp.advisory_id=a.id WHERE a.storm_id='${STORM_KEY}' AND tp.point_type='forecast' ORDER BY a.issued_at,a.agency,tp.valid_at,tp.source_order;" \
            > /tmp/ai22-wp16-points-raw.json
          jq '[.. | objects | select(.storm_id == "WP-2026-16" and has("advisory_id") and has("valid_at"))]' /tmp/ai22-wp16-points-raw.json > /tmp/ai22-wp16-points.json

          advisory_count="$(jq 'length' /tmp/ai22-wp16-advisories.json)"
          point_count="$(jq 'length' /tmp/ai22-wp16-points.json)"
          [[ "$advisory_count" -gt 0 ]]
          [[ "$point_count" -gt 0 ]]
          echo "AI22_SOURCE_FORECAST_ADVISORIES=$advisory_count"
          echo "AI22_SOURCE_FORECAST_POINTS=$point_count"

      - name: Select deterministic lifecycle cutoffs and build no-write capture request
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ai22-wp16-build
          node scripts/ai22-select-lifecycle-cutoffs.mjs \
            --storm /tmp/ai22-wp16-storm.json \
            --advisories /tmp/ai22-wp16-advisories.json \
            --points /tmp/ai22-wp16-points.json \
            --window-id "$WINDOW_ID" \
            --snapshots 4 \
            --output /tmp/ai22-wp16-evidence.json \
            --summary /tmp/ai22-wp16-selection.json \
            > /tmp/ai22-wp16-selection-stdout.json
          node scripts/ai22-build-lifecycle-capture.mjs \
            --evidence /tmp/ai22-wp16-evidence.json \
            --output /tmp/ai22-wp16-build \
            > /tmp/ai22-wp16-capture-summary.json

          jq -e '.stormKey == "WP-2026-16" and .selectedSnapshotCount > 0 and .selectedSnapshotCount <= 4 and .maxAgencyCount >= 1 and .lifecycle.windowId == "wp-2026-16-operational-202608"' /tmp/ai22-wp16-selection.json >/dev/null
          jq -e '.ok == true and .stormCount == 1 and .snapshotCount > 0 and .snapshotCount <= 4 and .tableCounts.truth_datasets == null and .tableCounts.truth_points == null and .tableCounts.signal_outcomes == null and .remoteWritesPerformed == false' /tmp/ai22-wp16-capture-summary.json >/dev/null
          request_bytes="$(wc -c < /tmp/ai22-wp16-build/lifecycle-capture-request.json)"
          [[ "$request_bytes" -lt 1000000 ]]
          echo "AI22_CAPTURE_REQUEST_BYTES=$request_bytes"
          echo 'AI22_WP16_SELECTION:'
          jq '{stormKey,status,productionInternationalNumber,maxAgencyCount,preferredCandidateCount,selectedSnapshotCount,cutoffs,selectedAdvisoryCount,forecastPointCount,firstForecastIssueAt,lastForecastIssueAt,generatedAt,lifecycle}' /tmp/ai22-wp16-selection.json
          echo 'AI22_WP16_CAPTURE_SUMMARY:'
          jq '{runId,evidenceSha256,planSha256,captureFingerprint,stormCount,snapshotCount,identityProposalCount,captureWindows,tableCounts,remoteWritesPerformed}' /tmp/ai22-wp16-capture-summary.json
          echo 'AI22_WP16_SELECTED_ADVISORIES:'
          jq '[.storms[0].selectedAdvisories[] | {as_of,id,agency,issued_at,source_hash}]' /tmp/ai22-wp16-evidence.json

      - name: Inspect remote storm-analysis state using SELECT only
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute storm-analysis --remote --json --experimental-provision=false --command \
            "SELECT name FROM d1_migrations ORDER BY id; SELECT (SELECT COUNT(*) FROM backfill_runs) backfill_runs,(SELECT COUNT(*) FROM historical_storms) historical_storms,(SELECT COUNT(*) FROM forecast_snapshots) forecast_snapshots,(SELECT COUNT(*) FROM forecast_snapshots WHERE storm_key='WP-2026-16') wp16_snapshots,(SELECT COUNT(*) FROM truth_datasets) truth_datasets,(SELECT COUNT(*) FROM truth_points) truth_points,(SELECT COUNT(*) FROM verification_results) verification_results,(SELECT COUNT(*) FROM agency_skill_profiles) agency_skill_profiles,(SELECT COUNT(*) FROM adaptive_weight_candidates) adaptive_weight_candidates,(SELECT COUNT(*) FROM signal_calibration_training_runs) training_runs,(SELECT COUNT(*) FROM signal_profile_promotion_events) promotion_events,(SELECT generation FROM signal_calibration_state WHERE state_id=1) generation,(SELECT champion_profile_id FROM signal_calibration_state WHERE state_id=1) champion_profile_id; SELECT COUNT(*) AS lifecycle_table_count FROM sqlite_master WHERE type='table' AND name='corpus_capture_windows';" \
            > /tmp/ai22-analysis-prestate.json
          echo 'AI22_REMOTE_ANALYSIS_PRESTATE:'
          jq '[.. | objects | select(has("backfill_runs") or has("name") or has("lifecycle_table_count"))]' /tmp/ai22-analysis-prestate.json
          row="$(jq -c '.. | objects | select(has("backfill_runs"))' /tmp/ai22-analysis-prestate.json | head -n1)"
          ROW="$row" node --input-type=module <<'NODE'
          const row=JSON.parse(process.env.ROW);
          for (const key of ['truth_datasets','truth_points','verification_results','agency_skill_profiles','adaptive_weight_candidates','training_runs','promotion_events','generation','wp16_snapshots']) {
            if (Number(row[key]) !== 0) throw new Error(`AI-22 read-only preview refuses unexpected ${key}=${row[key]}`);
          }
          if (row.champion_profile_id != null) throw new Error('AI-22 read-only preview refuses pre-existing Champion');
          NODE

      - name: Verify no mutation trigger is active
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < .github/ai19-backfill-trigger.txt)" == "COMPLETED_AI19" ]]
          [[ "$(tr -d '\r\n' < .github/ai20-truth-trigger.txt)" == "PENDING_AI20" ]]
          [[ "$(tr -d '\r\n' < .github/ai21-corpus-trigger.txt)" == "COMPLETED_AI21" ]]
          [[ "$(tr -d '\r\n' < .github/ai22-lifecycle-trigger.txt)" == "PENDING_AI22" ]]
          echo 'AI22_PRODUCTION_SOURCE_WRITTEN=false'
          echo 'AI22_ANALYSIS_DB_WRITTEN=false'
          echo 'AI22_WORKER_DEPLOYED=false'
          echo 'AI22_TRUTH_WRITTEN=false'
          echo 'AI22_VERIFICATION_WRITTEN=false'
          echo 'AI22_TRAINING_WRITTEN=false'
          echo 'AI22_PROMOTION_WRITTEN=false'
