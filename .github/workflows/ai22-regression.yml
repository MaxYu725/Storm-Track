name: AI-22/23 analysis regression

on:
  push:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/ai22-lifecycle-trigger.txt
      - .github/workflows/ai22-regression.yml
      - docs/AI22_CORPUS_LIFECYCLE_IDENTITY.md
      - docs/AI22_COMPLETION_RESULT.md
      - tests/storm-analysis-ai22.test.mjs
      - tests/storm-analysis-ai23.test.mjs
      - tests/storm-analysis-ai23-api.test.mjs
      - workers/storm-analysis/package.json
      - workers/storm-analysis/wrangler.jsonc
      - workers/storm-analysis/schema/0007_corpus_lifecycle.sql
      - workers/storm-analysis/scripts/check-deploy-config.mjs
      - workers/storm-analysis/scripts/ai22-build-lifecycle-capture.mjs
      - workers/storm-analysis/scripts/ai23-build-generic-truth-augmentation.mjs
      - workers/storm-analysis/scripts/ai23-build-generic-verification.mjs
      - workers/storm-analysis/src/corpus-lifecycle-repository.js
      - workers/storm-analysis/src/verification-result-repository.js
      - workers/storm-analysis/src/truth-augmentation-repository.js
      - workers/storm-analysis/src/index-base.js
      - workers/storm-analysis/src/index-ai23.js
      - workers/storm-analysis/src/index.js
      - workers/storm-analysis/test/corpus-lifecycle-repository.integration.test.js
      - workers/storm-analysis/test/verification-result-repository.integration.test.js
      - workers/storm-analysis/test/truth-augmentation-repository.integration.test.js
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/ai22-lifecycle-trigger.txt
      - .github/workflows/ai22-regression.yml
      - docs/AI22_CORPUS_LIFECYCLE_IDENTITY.md
      - docs/AI22_COMPLETION_RESULT.md
      - tests/storm-analysis-ai22.test.mjs
      - tests/storm-analysis-ai23.test.mjs
      - tests/storm-analysis-ai23-api.test.mjs
      - workers/storm-analysis/package.json
      - workers/storm-analysis/wrangler.jsonc
      - workers/storm-analysis/schema/0007_corpus_lifecycle.sql
      - workers/storm-analysis/scripts/check-deploy-config.mjs
      - workers/storm-analysis/scripts/ai22-build-lifecycle-capture.mjs
      - workers/storm-analysis/scripts/ai23-build-generic-truth-augmentation.mjs
      - workers/storm-analysis/scripts/ai23-build-generic-verification.mjs
      - workers/storm-analysis/src/corpus-lifecycle-repository.js
      - workers/storm-analysis/src/verification-result-repository.js
      - workers/storm-analysis/src/truth-augmentation-repository.js
      - workers/storm-analysis/src/index-base.js
      - workers/storm-analysis/src/index-ai23.js
      - workers/storm-analysis/src/index.js
      - workers/storm-analysis/test/corpus-lifecycle-repository.integration.test.js
      - workers/storm-analysis/test/verification-result-repository.integration.test.js
      - workers/storm-analysis/test/truth-augmentation-repository.integration.test.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    if: github.base_ref == 'feature/ai-analysis-engine' || github.ref == 'refs/heads/feature/ai-analysis-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ai-analysis-engine
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Worker toolchain
        working-directory: workers/storm-analysis
        run: npm install --no-audit --no-fund

      - name: Run complete regression suite through AI-23
        working-directory: workers/storm-analysis
        run: npm test

      - name: Run isolated D1 integration suite including lifecycle, truth and verification persistence
        working-directory: workers/storm-analysis
        run: npm run test:integration

      - name: Validate independent deployment configuration
        working-directory: workers/storm-analysis
        run: npm run check:config

      - name: Build Worker deployment dry-run without provisioning
        working-directory: workers/storm-analysis
        run: npm run deploy:dry-run

      - name: Verify phase locks remain safe
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < .github/ai19-backfill-trigger.txt)" == "COMPLETED_AI19" ]]
          [[ "$(tr -d '\r\n' < .github/ai20-truth-trigger.txt)" == "PENDING_AI20" ]]
          [[ "$(tr -d '\r\n' < .github/ai21-corpus-trigger.txt)" == "COMPLETED_AI21" ]]
          [[ "$(tr -d '\r\n' < .github/ai22-lifecycle-trigger.txt)" == "COMPLETED_AI22" ]]
          echo 'AI22_LIFECYCLE_PHASE=COMPLETED_AI22'
          echo 'AI23_REMOTE_TRUTH_IMPORT_PERFORMED=false'
          echo 'AI23_REMOTE_VERIFICATION_PERSISTED=false'
          echo 'AI23_TRAINING_PERFORMED=false'
          echo 'AI23_PROMOTION_PERFORMED=false'
          echo 'AI23_PRODUCTION_STORM_WORKER_MODIFIED=false'
