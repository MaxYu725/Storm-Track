name: Apply Checkpoint 3 UX patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/checkpoint3-ux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply targeted UX patch
        run: python tools/apply_checkpoint3_ux.py

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/storm-inline.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/storm-inline.js

      - name: Commit final UX changes and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-checkpoint3-ux.yml tools/apply_checkpoint3_ux.py
          git commit -m "Improve PWA and Archive UX"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
