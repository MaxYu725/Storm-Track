name: AI-22 Runtime read-only observer

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/ai22-runtime-observe.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WORKER_URL: https://storm-analysis.max-yu.workers.dev

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ai-analysis-engine
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Worker toolchain
        working-directory: workers/storm-analysis
        run: npm install --no-audit --no-fund

      - name: Observe remote analysis D1 using SELECT only
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute storm-analysis --remote --json --experimental-provision=false --command "SELECT name FROM d1_migrations ORDER BY id; SELECT COUNT(*) AS lifecycle_table_count FROM sqlite_master WHERE type='table' AND name='corpus_capture_windows'; SELECT (SELECT COUNT(*) FROM backfill_runs) backfill_runs,(SELECT COUNT(*) FROM historical_storms) historical_storms,(SELECT COUNT(*) FROM forecast_snapshots) forecast_snapshots,(SELECT COUNT(*) FROM forecast_snapshots WHERE storm_key='WP-2026-16') wp16_snapshots,(SELECT COUNT(*) FROM truth_datasets) truth_datasets,(SELECT COUNT(*) FROM truth_points) truth_points,(SELECT COUNT(*) FROM verification_results) verification_results,(SELECT COUNT(*) FROM signal_calibration_training_runs) training_runs,(SELECT COUNT(*) FROM signal_profile_promotion_events) promotion_events,(SELECT generation FROM signal_calibration_state WHERE state_id=1) generation,(SELECT champion_profile_id FROM signal_calibration_state WHERE state_id=1) champion_profile_id;" > /tmp/ai22-observe-db.json
          echo 'AI22_OBSERVER_D1:'
          jq '[.. | objects | select(has("name") or has("lifecycle_table_count") or has("backfill_runs"))]' /tmp/ai22-observe-db.json

      - name: Observe deployed Worker health without authorization
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/ai22-observe-health.json -w '%{http_code}' --retry 3 --retry-delay 1 "${WORKER_URL}/health")"
          echo "AI22_OBSERVER_HEALTH_STATUS=$status"
          cat /tmp/ai22-observe-health.json
          preview_status="$(curl -sS -o /tmp/ai22-observe-preview.json -w '%{http_code}' -X POST "${WORKER_URL}/api/corpus/capture/preview" -H 'content-type: application/json' --data '{}')"
          echo "AI22_OBSERVER_UNAUTH_PREVIEW_STATUS=$preview_status"
          cat /tmp/ai22-observe-preview.json

      - name: Confirm observer is read-only
        run: |
          echo 'AI22_OBSERVER_REMOTE_WRITES=false'
          echo 'AI22_OBSERVER_DEPLOY=false'
          echo 'AI22_OBSERVER_PRODUCTION_SOURCE_ACCESS=false'

# CI probe only: branch-level comment to trigger the pull_request observer.
