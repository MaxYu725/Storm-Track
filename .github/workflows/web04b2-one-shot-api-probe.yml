name: WEB-04B-2 one-shot public API read-only probe

on:
  push:
    branches:
      - feature/web-04b-advisory-cursor-readiness
    paths:
      - .github/workflows/web04b2-one-shot-api-probe.yml

permissions:
  contents: read

jobs:
  production-api-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Public production advisory API capability probe (GET only, at most 3 requests)
        run: node scripts/audit-web04b-production-api.mjs
