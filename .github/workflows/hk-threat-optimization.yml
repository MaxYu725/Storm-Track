name: HK threat optimization

on:
  push:
    branches:
      - feature/basic-hk-signal-forecast
    paths:
      - .github/workflows/hk-threat-optimization.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/basic-hk-signal-forecast
          fetch-depth: 0

      - name: Apply evidence-model refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return updated

          # 1) Reuse signal-input wind-field evidence with signal-specific wind thresholds.
          path = Path('analysis/hko-signal-risk-inputs.js')
          text = path.read_text(encoding='utf-8')
          marker = "    function median(values) {"
          if marker not in text:
              raise SystemExit('signal-inputs: median marker missing')
          insert = r'''    const HKO_STRONG_WIND_MS = 41 / 3.6;
    const HKO_GALE_WIND_MS = 63 / 3.6;
    const BEAUFORT_LOWER_BOUND_MS = Object.freeze({ 7: 13.9, 10: 24.5, 12: 32.7 });

    function parseWindRadiusThresholdMs(value) {
        if (value == null || value === '') return null;
        const text = String(value).trim().toLowerCase();
        const number = parseMetricNumber(value);
        if (number == null) return null;
        if (/m\s*\/?\s*s|mps|米.*秒/.test(text)) return number;
        if (/km\s*\/?\s*h|kmh|kph|公里.*小時/.test(text)) return number / 3.6;
        if (/\bkt\b|kts|knot|節/.test(text)) return number * 0.514444;
        if (/^(7|10|12)(?:\.0+)?$/.test(text)) return BEAUFORT_LOWER_BOUND_MS[Math.round(number)] ?? null;
        return null;
    }

'''
          text = text.replace(marker, insert + marker, 1)

          text = sub_once(
              text,
              r"    function windFieldEvidence\(point, referencePoint\) \{.*?\n    \}\n\n    function buildAgencyInput",
              r'''    function windFieldEvidence(point, referencePoint) {
        if (!point || !point.windRadii.length) return null;
        const distanceKm = haversineKm(point.lat, point.lon, referencePoint.lat, referencePoint.lon);
        const bearingToHongKong = initialBearingDegrees(point.lat, point.lon, referencePoint.lat, referencePoint.lon);
        const quadrant = quadrant4(bearingToHongKong);
        if (!Number.isFinite(distanceKm) || !quadrant) return null;
        const levels = point.windRadii.map(radius => {
            const quadrantRadiusKm = finiteNumber(radius[quadrant]) ?? 0;
            const thresholdMs = parseWindRadiusThresholdMs(radius.level);
            return {
                level: radius.level,
                thresholdMs,
                quadrant,
                quadrantRadiusKm,
                hongKongInside: quadrantRadiusKm > 0 && distanceKm <= quadrantRadiusKm
            };
        });
        const coveredLevels = levels.filter(level => level.hongKongInside);
        const knownCoveredThresholds = coveredLevels.map(level => level.thresholdMs).filter(Number.isFinite);
        return {
            time: point.time,
            stormDistanceToHongKongKm: distanceKm,
            bearingStormToHongKongDegrees: bearingToHongKong,
            hongKongQuadrantFromStorm: quadrant.toUpperCase(),
            levels,
            anyCoverage: coveredLevels.length > 0,
            strongWindCoverage: coveredLevels.some(level => Number.isFinite(level.thresholdMs) && level.thresholdMs >= HKO_STRONG_WIND_MS),
            galeCoverage: coveredLevels.some(level => Number.isFinite(level.thresholdMs) && level.thresholdMs >= HKO_GALE_WIND_MS),
            maximumCoveredThresholdMs: knownCoveredThresholds.length ? Math.max(...knownCoveredThresholds) : null,
            unknownThresholdCoverage: coveredLevels.some(level => !Number.isFinite(level.thresholdMs))
        };
    }

    function buildAgencyInput''',
              'signal-inputs windFieldEvidence',
              re.S
          )

          old = """        const windRadiusAgencies = usable.filter(item => item.windField.radiusPointCount > 0);\n        const latestWindCoverageAgencies = usable.filter(item => item.windField.latestEvidence?.anyCoverage);\n        const closestWindCoverageAgencies = usable.filter(item => item.windField.closestTimeEvidence?.anyCoverage);"""
          new = """        const windRadiusAgencies = usable.filter(item => item.windField.radiusPointCount > 0);\n        const latestWindCoverageAgencies = usable.filter(item => item.windField.latestEvidence?.anyCoverage);\n        const closestWindCoverageAgencies = usable.filter(item => item.windField.closestTimeEvidence?.anyCoverage);\n        const latestStrongWindCoverageAgencies = usable.filter(item => item.windField.latestEvidence?.strongWindCoverage);\n        const closestStrongWindCoverageAgencies = usable.filter(item => item.windField.closestTimeEvidence?.strongWindCoverage);\n        const latestGaleCoverageAgencies = usable.filter(item => item.windField.latestEvidence?.galeCoverage);\n        const closestGaleCoverageAgencies = usable.filter(item => item.windField.closestTimeEvidence?.galeCoverage);\n        const unknownThresholdCoverageAgencies = usable.filter(item =>\n            item.windField.latestEvidence?.unknownThresholdCoverage || item.windField.closestTimeEvidence?.unknownThresholdCoverage);"""
          if text.count(old) != 1:
              raise SystemExit('signal-inputs: coverage declaration anchor mismatch')
          text = text.replace(old, new, 1)

          old = """            windField: {\n                agenciesWithRadii: windRadiusAgencies.map(item => item.agency),\n                latestCoverageAgencies: latestWindCoverageAgencies.map(item => item.agency),\n                closestTimeCoverageAgencies: closestWindCoverageAgencies.map(item => item.agency),\n                quadrantMethod: 'bearing-storm-to-hong-kong-v1'\n            },"""
          new = """            windField: {\n                agenciesWithRadii: windRadiusAgencies.map(item => item.agency),\n                latestCoverageAgencies: latestWindCoverageAgencies.map(item => item.agency),\n                closestTimeCoverageAgencies: closestWindCoverageAgencies.map(item => item.agency),\n                latestStrongWindCoverageAgencies: latestStrongWindCoverageAgencies.map(item => item.agency),\n                closestStrongWindCoverageAgencies: closestStrongWindCoverageAgencies.map(item => item.agency),\n                latestGaleCoverageAgencies: latestGaleCoverageAgencies.map(item => item.agency),\n                closestGaleCoverageAgencies: closestGaleCoverageAgencies.map(item => item.agency),\n                unknownThresholdCoverageAgencies: unknownThresholdCoverageAgencies.map(item => item.agency),\n                strongWindThresholdMs: HKO_STRONG_WIND_MS,\n                galeWindThresholdMs: HKO_GALE_WIND_MS,\n                quadrantMethod: 'bearing-storm-to-hong-kong-v1'\n            },"""
          if text.count(old) != 1:
              raise SystemExit('signal-inputs: windField output anchor mismatch')
          text = text.replace(old, new, 1)

          old = """                windRadiusAgencyCount: windRadiusAgencies.length,\n                latestWindFieldCoverageAgencyCount: latestWindCoverageAgencies.length,\n                closestTimeWindFieldCoverageAgencyCount: closestWindCoverageAgencies.length"""
          new = """                windRadiusAgencyCount: windRadiusAgencies.length,\n                latestWindFieldCoverageAgencyCount: latestWindCoverageAgencies.length,\n                closestTimeWindFieldCoverageAgencyCount: closestWindCoverageAgencies.length,\n                latestStrongWindFieldCoverageAgencyCount: latestStrongWindCoverageAgencies.length,\n                closestTimeStrongWindFieldCoverageAgencyCount: closestStrongWindCoverageAgencies.length,\n                latestGaleWindFieldCoverageAgencyCount: latestGaleCoverageAgencies.length,\n                closestTimeGaleWindFieldCoverageAgencyCount: closestGaleCoverageAgencies.length,\n                unknownThresholdWindFieldCoverageAgencyCount: unknownThresholdCoverageAgencies.length"""
          if text.count(old) != 1:
              raise SystemExit('signal-inputs: feature vector anchor mismatch')
          text = text.replace(old, new, 1)

          old = """        normalizeWindRadii,\n        buildHkoSignalRiskInputs"""
          new = """        normalizeWindRadii,\n        parseWindRadiusThresholdMs,\n        HKO_STRONG_WIND_MS,\n        HKO_GALE_WIND_MS,\n        buildHkoSignalRiskInputs"""
          if text.count(old) != 1:
              raise SystemExit('signal-inputs: export anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 2) Threat assessment: separate physical threat from confidence and preserve minority scenarios.
          path = Path('analysis/hk-threat-assessment.js')
          text = path.read_text(encoding='utf-8')

          text = sub_once(
              text,
              r"  function buildTimeline\(agencyTracks, referencePoint, referenceTimeMs\) \{.*?\n  \}\n\n  function representativeMinimumFromImpact",
              r'''  function buildTimeline(agencyTracks, referencePoint, referenceTimeMs) {
    const checkpointTimes = collectCheckpointTimes(agencyTracks);
    const checkpoints = checkpointTimes.map(targetMs => {
      const agencyEntries = [];
      Object.entries(agencyTracks).forEach(([agency, track]) => {
        const sample = interpolateTrackAtTime(track, targetMs, referencePoint, referenceTimeMs);
        if (!sample) return;
        agencyEntries.push({
          agency,
          time: sample.time,
          leadHours: sample.leadHours,
          distanceKm: sample.distanceKm,
          maximumWindMs: sample.maximumWindMs,
          exactOfficialTime: sample.exactOfficialTime === true,
          windRadiiAvailable: sample.windRadiiAvailable === true
        });
      });
      if (!agencyEntries.length) return null;
      const leadHours = (targetMs - referenceTimeMs) / HOUR_MS;
      const distances = agencyEntries.map(entry => entry.distanceKm).filter(Number.isFinite);
      const winds = agencyEntries.map(entry => entry.maximumWindMs).filter(Number.isFinite);
      const minimumKm = distances.length ? Math.min(...distances) : null;
      const maximumKm = distances.length ? Math.max(...distances) : null;
      const distanceMedianKm = median(distances);
      const windMedianMs = median(winds);
      const agreementIndex = distances.length > 1
        ? Math.exp(-(maximumKm - minimumKm) / 260)
        : 0.65;
      const proximityIndex = smoothCloser(distanceMedianKm, 650);
      const windSeverityIndex = Number.isFinite(windMedianMs) ? clamp((windMedianMs - 10) / 30) : 0;
      const timeRelevance = softTimeRelevance(leadHours);
      const physicalThreatIndex = clamp(proximityIndex * 0.70 + windSeverityIndex * 0.30);
      const threatIndex = clamp(physicalThreatIndex * (0.55 + 0.45 * timeRelevance));
      return {
        label: checkpointLabel(leadHours),
        validTime: iso(targetMs),
        leadHours,
        supportAgencyCount: agencyEntries.length,
        exactOfficialSupportCount: agencyEntries.filter(entry => entry.exactOfficialTime).length,
        windSupportAgencyCount: winds.length,
        distanceMedianKm,
        distanceRangeKm: Number.isFinite(minimumKm) && Number.isFinite(maximumKm) ? { min: minimumKm, max: maximumKm } : null,
        windMedianMs,
        proximityIndex,
        windSeverityIndex,
        agreementIndex,
        timeRelevance,
        physicalThreatIndex,
        threatIndex,
        agencies: agencyEntries
      };
    }).filter(Boolean);

    return checkpoints.map((checkpoint, index) => {
      const previous = index > 0 ? checkpoints[index - 1] : null;
      const intervalHours = previous && Number.isFinite(previous.leadHours)
        ? checkpoint.leadHours - previous.leadHours : null;
      const distanceDeltaKm = previous && Number.isFinite(previous.distanceMedianKm) && Number.isFinite(checkpoint.distanceMedianKm)
        ? checkpoint.distanceMedianKm - previous.distanceMedianKm : null;
      const windDeltaMs = previous && Number.isFinite(previous.windMedianMs) && Number.isFinite(checkpoint.windMedianMs)
        ? checkpoint.windMedianMs - previous.windMedianMs : null;
      const approachRateKmh = Number.isFinite(distanceDeltaKm) && Number.isFinite(intervalHours) && intervalHours > 0
        ? -distanceDeltaKm / intervalHours : null;
      const strengtheningRateMsPerHour = Number.isFinite(windDeltaMs) && Number.isFinite(intervalHours) && intervalHours > 0
        ? windDeltaMs / intervalHours : null;
      const agencies = checkpoint.agencies.map(entry => {
        const previousEntry = previous?.agencies?.find(item => item.agency === entry.agency) ?? null;
        const agencyDistanceDeltaKm = previousEntry && Number.isFinite(previousEntry.distanceKm) && Number.isFinite(entry.distanceKm)
          ? entry.distanceKm - previousEntry.distanceKm : null;
        const agencyWindDeltaMs = previousEntry && Number.isFinite(previousEntry.maximumWindMs) && Number.isFinite(entry.maximumWindMs)
          ? entry.maximumWindMs - previousEntry.maximumWindMs : null;
        const agencyApproachRateKmh = Number.isFinite(agencyDistanceDeltaKm) && Number.isFinite(intervalHours) && intervalHours > 0
          ? -agencyDistanceDeltaKm / intervalHours : null;
        const agencyStrengtheningRateMsPerHour = Number.isFinite(agencyWindDeltaMs) && Number.isFinite(intervalHours) && intervalHours > 0
          ? agencyWindDeltaMs / intervalHours : null;
        const agencyRapidEvolutionIndex = clamp(
          (Number.isFinite(agencyApproachRateKmh) ? clamp(agencyApproachRateKmh / 25) : 0) * 0.6
          + (Number.isFinite(agencyStrengtheningRateMsPerHour) ? clamp(agencyStrengtheningRateMsPerHour / 1.2) : 0) * 0.4
        );
        return {
          ...entry,
          distanceDeltaFromPreviousKm: agencyDistanceDeltaKm,
          windDeltaFromPreviousMs: agencyWindDeltaMs,
          approachRateKmh: agencyApproachRateKmh,
          strengtheningRateMsPerHour: agencyStrengtheningRateMsPerHour,
          rapidEvolutionIndex: agencyRapidEvolutionIndex
        };
      });
      const agencyRapidValues = agencies.map(entry => entry.rapidEvolutionIndex).filter(Number.isFinite);
      const rapidEvolutionIndex = agencyRapidValues.length ? median(agencyRapidValues) : 0;
      const scenarioRapidEvolutionIndex = agencyRapidValues.length ? Math.max(...agencyRapidValues) : 0;
      return {
        ...checkpoint,
        agencies,
        intervalFromPreviousHours: intervalHours,
        distanceDeltaFromPreviousKm: distanceDeltaKm,
        windDeltaFromPreviousMs: windDeltaMs,
        approachRateKmh,
        strengtheningRateMsPerHour,
        rapidEvolutionIndex,
        scenarioRapidEvolutionIndex
      };
    });
  }

  function representativeMinimumFromImpact''',
              'threat buildTimeline',
              re.S
          )

          old = """    const featureVector = signalInputs?.featureVector || {};\n    const usableAgencyCount = finite(featureVector.usableAgencyCount)\n      ?? finite(signalInputs?.coverage?.usableAgencyCount)\n      ?? patterns.length;\n    const windFieldCoverageCount = finite(featureVector.closestTimeWindFieldCoverageAgencyCount) ?? 0;\n    const representativeWindMs = finite(featureVector.closestMaximumWindMedianMs)\n      ?? finite(featureVector.currentMaximumWindMedianMs);\n    const windFieldConfidence = clamp((usableAgencyCount > 0 ? windFieldCoverageCount / usableAgencyCount : 0) * 0.65\n      + (Number.isFinite(representativeWindMs) ? clamp(representativeWindMs / 35) * 0.35 : 0));"""
          new = """    const featureVector = signalInputs?.featureVector || {};\n    const usableAgencyCount = finite(featureVector.usableAgencyCount)\n      ?? finite(signalInputs?.coverage?.usableAgencyCount)\n      ?? patterns.length;\n    const latestWindFieldCoverageCount = finite(featureVector.latestWindFieldCoverageAgencyCount) ?? 0;\n    const closestWindFieldCoverageCount = finite(featureVector.closestTimeWindFieldCoverageAgencyCount) ?? 0;\n    const latestStrongWindCoverageCount = finite(featureVector.latestStrongWindFieldCoverageAgencyCount) ?? 0;\n    const closestStrongWindCoverageCount = finite(featureVector.closestTimeStrongWindFieldCoverageAgencyCount) ?? 0;\n    const latestGaleCoverageCount = finite(featureVector.latestGaleWindFieldCoverageAgencyCount) ?? 0;\n    const closestGaleCoverageCount = finite(featureVector.closestTimeGaleWindFieldCoverageAgencyCount) ?? 0;\n    const windRadiusAgencyCount = finite(featureVector.windRadiusAgencyCount) ?? 0;\n    const representativeWindMs = finite(featureVector.closestMaximumWindMedianMs)\n      ?? finite(featureVector.currentMaximumWindMedianMs);\n    const coverageFraction = count => usableAgencyCount > 0 ? clamp(count / usableAgencyCount) : 0;\n    const windFieldConfidence = Math.max(\n      coverageFraction(latestWindFieldCoverageCount),\n      coverageFraction(closestWindFieldCoverageCount)\n    );"""
          if text.count(old) != 1:
              raise SystemExit('threat: wind field block anchor mismatch')
          text = text.replace(old, new, 1)

          old = """    const strongestTimelineThreat = timeline.reduce((best, item) => item.threatIndex > (best?.threatIndex ?? -1) ? item : best, null);\n    const fastestEvolution = timeline.reduce((best, item) => item.rapidEvolutionIndex > (best?.rapidEvolutionIndex ?? -1) ? item : best, null);\n    const currentDistanceKm = median(patterns.map(pattern => pattern.currentDistanceKm).filter(Number.isFinite));"""
          new = """    const strongestTimelineThreat = timeline.reduce((best, item) => item.threatIndex > (best?.threatIndex ?? -1) ? item : best, null);\n    const fastestEvolution = timeline.reduce((best, item) => item.scenarioRapidEvolutionIndex > (best?.scenarioRapidEvolutionIndex ?? -1) ? item : best, null);\n    const currentDistanceKm = finite(featureVector.currentDistanceMedianKm)\n      ?? median(patterns.map(pattern => pattern.currentDistanceKm).filter(Number.isFinite));"""
          if text.count(old) != 1:
              raise SystemExit('threat: timeline summary anchor mismatch')
          text = text.replace(old, new, 1)

          old = """    const rapidEvolutionConfidence = clamp(finite(fastestEvolution?.rapidEvolutionIndex) ?? 0);\n    const overallThreatIndex = clamp(\n      currentProximityIndex * 0.22\n      + futureProximityIndex * 0.28\n      + trajectoryConfidence * 0.20\n      + windFieldConfidence * 0.10\n      + rapidEvolutionConfidence * 0.12\n      + (1 - agencyDisagreementConfidence) * 0.08\n    );\n    const confidenceIndex = clamp(1 - agencyDisagreementConfidence * 0.55 - forecastEdgeConfidence * 0.25);"""
          new = """    const rapidEvolutionConfidence = clamp(finite(fastestEvolution?.scenarioRapidEvolutionIndex) ?? 0);\n    const overallThreatIndex = clamp(\n      currentProximityIndex * 0.24\n      + futureProximityIndex * 0.32\n      + trajectoryConfidence * 0.22\n      + windFieldConfidence * 0.10\n      + rapidEvolutionConfidence * 0.12\n    );\n    const agencyCoverageConfidence = clamp(usableAgencyCount / 3);\n    const confidenceIndex = clamp(\n      (1 - agencyDisagreementConfidence * 0.55 - forecastEdgeConfidence * 0.25)\n      * (0.55 + 0.45 * agencyCoverageConfidence)\n    );"""
          if text.count(old) != 1:
              raise SystemExit('threat: overall risk anchor mismatch')
          text = text.replace(old, new, 1)

          old = """          rapidEvolutionIndex: fastestEvolution.rapidEvolutionIndex,\n          approachRateKmh: fastestEvolution.approachRateKmh,\n          strengtheningRateMsPerHour: fastestEvolution.strengtheningRateMsPerHour"""
          new = """          rapidEvolutionIndex: fastestEvolution.scenarioRapidEvolutionIndex,\n          medianRapidEvolutionIndex: fastestEvolution.rapidEvolutionIndex,\n          approachRateKmh: fastestEvolution.approachRateKmh,\n          strengtheningRateMsPerHour: fastestEvolution.strengtheningRateMsPerHour"""
          if text.count(old) != 1:
              raise SystemExit('threat: fastest evolution output anchor mismatch')
          text = text.replace(old, new, 1)

          old = """        windField: {\n          confidence: windFieldConfidence,\n          representativeWindMs,\n          coverageAgencyCount: windFieldCoverageCount\n        },"""
          new = """        windField: {\n          confidence: windFieldConfidence,\n          representativeWindMs,\n          dataAgencyCount: windRadiusAgencyCount,\n          latestCoverageAgencyCount: latestWindFieldCoverageCount,\n          closestCoverageAgencyCount: closestWindFieldCoverageCount,\n          latestStrongWindCoverageAgencyCount: latestStrongWindCoverageCount,\n          closestStrongWindCoverageAgencyCount: closestStrongWindCoverageCount,\n          latestGaleCoverageAgencyCount: latestGaleCoverageCount,\n          closestGaleCoverageAgencyCount: closestGaleCoverageCount,\n          strongWindCoverageFraction: Math.max(coverageFraction(latestStrongWindCoverageCount), coverageFraction(closestStrongWindCoverageCount)),\n          galeCoverageFraction: Math.max(coverageFraction(latestGaleCoverageCount), coverageFraction(closestGaleCoverageCount))\n        },"""
          if text.count(old) != 1:
              raise SystemExit('threat: wind analyzer output anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 3) Signal forecast: scenario envelopes, persistence, signal-specific wind-field evidence.
          path = Path('analysis/basic-hk-signal-forecast.js')
          text = path.read_text(encoding='utf-8')
          marker = "  function softTimeRelevance(lead) {"
          if marker not in text:
              raise SystemExit('basic: soft time marker missing')
          median_fn = r'''  function median(values) {
    const usable = values.filter(Number.isFinite).slice().sort((a, b) => a - b);
    if (!usable.length) return null;
    const middle = Math.floor(usable.length / 2);
    return usable.length % 2 ? usable[middle] : (usable[middle - 1] + usable[middle]) / 2;
  }

'''
          text = text.replace(marker, median_fn + marker, 1)

          text = sub_once(
              text,
              r"  function firstBandEntry\(impact, weightedImpact, thresholds\) \{.*?\n  \}\n\n  function windowAround",
              r'''  function nextBandEntry(impact, weightedImpact, thresholds, referenceTime) {
    const referenceMs = timeMs(referenceTime);
    if (!Number.isFinite(referenceMs)) return null;
    const candidates = [];
    thresholds.forEach(threshold => {
      const weightedBand = weightedImpact?.distanceBands?.[String(threshold)];
      const weightedIntervals = Array.isArray(weightedBand?.intervals) ? weightedBand.intervals : [];
      weightedIntervals.forEach(interval => {
        const enterMs = timeMs(interval?.enterTime);
        if (Number.isFinite(enterMs) && enterMs >= referenceMs) {
          candidates.push({ thresholdKm: threshold, time: iso(enterMs), source: 'weighted-consensus', supportAgencyCount: null });
        }
      });
      const agencies = impact?.distanceBands?.[String(threshold)]?.agencies;
      if (Array.isArray(agencies)) {
        agencies.forEach(item => (Array.isArray(item?.intervals) ? item.intervals : []).forEach(interval => {
          const enterMs = timeMs(interval?.enterTime);
          if (Number.isFinite(enterMs) && enterMs >= referenceMs) {
            candidates.push({ thresholdKm: threshold, time: iso(enterMs), source: `agency-${item.agency || 'unknown'}`, supportAgencyCount: 1 });
          }
        }));
      }
      const fallback = timeMs(weightedBand?.firstEntryTime ?? impact?.distanceBands?.[String(threshold)]?.entryWindow?.start);
      if (Number.isFinite(fallback) && fallback >= referenceMs) {
        candidates.push({ thresholdKm: threshold, time: iso(fallback), source: weightedBand?.firstEntryTime ? 'weighted-consensus' : 'agency-window', supportAgencyCount: null });
      }
    });
    candidates.sort((a, b) => timeMs(a.time) - timeMs(b.time));
    return candidates[0] ?? null;
  }

  function windowAround''',
              'basic nextBandEntry',
              re.S
          )

          text = sub_once(
              text,
              r"  function checkpointEvidence\(checkpoint, signal\) \{.*?\n  \}\n\n  function timelineAnchor",
              r'''  function signalThresholds(signal) {
    if (signal === 'T8') return { possible: 0.40, likely: 0.70 };
    if (signal === 'T3') return { possible: 0.38, likely: 0.65 };
    return { possible: 0.35, likely: 0.58 };
  }

  function pointSignalEvidence(entry, checkpoint, signal) {
    const distanceKm = finite(entry?.distanceKm) ?? finite(checkpoint?.distanceMedianKm);
    const windMs = finite(entry?.maximumWindMs) ?? finite(checkpoint?.windMedianMs);
    const timeRelevance = clamp(finite(checkpoint?.timeRelevance) ?? softTimeRelevance(finite(checkpoint?.leadHours)));
    const rapid = clamp(finite(entry?.rapidEvolutionIndex) ?? finite(checkpoint?.rapidEvolutionIndex) ?? 0);
    let proximity;
    let intensityPotential;
    if (signal === 'T8') {
      proximity = smoothCloser(distanceKm, 300);
      intensityPotential = Number.isFinite(windMs) ? clamp((windMs - 20) / 22) : 0;
    } else if (signal === 'T3') {
      proximity = smoothCloser(distanceKm, 500);
      intensityPotential = Number.isFinite(windMs) ? clamp((windMs - 12) / 18) : 0;
    } else {
      proximity = smoothCloser(distanceKm, 800);
      intensityPotential = Number.isFinite(windMs) ? clamp((windMs - 10) / 25) : 0;
    }
    const exposureIntensity = intensityPotential * proximity;
    const exposureRapid = rapid * Math.max(proximity, 0.20);
    const physical = signal === 'T8'
      ? proximity * 0.56 + exposureIntensity * 0.29 + exposureRapid * 0.15
      : (signal === 'T3'
        ? proximity * 0.55 + exposureIntensity * 0.28 + exposureRapid * 0.17
        : proximity * 0.62 + intensityPotential * 0.12 + rapid * 0.26);
    return clamp(physical * (0.55 + 0.45 * timeRelevance));
  }

  function checkpointEvidence(checkpoint, signal) {
    const agencies = Array.isArray(checkpoint?.agencies) ? checkpoint.agencies : [];
    const perAgency = agencies.map(entry => ({ agency: entry.agency, evidence: pointSignalEvidence(entry, checkpoint, signal) }));
    if (!perAgency.length) {
      const fallback = pointSignalEvidence({}, checkpoint, signal);
      return { aggregate: fallback, consensus: fallback, scenarioMax: fallback, supportAgencyCount: 0, totalAgencyCount: 0, perAgency: [] };
    }
    const values = perAgency.map(item => item.evidence).filter(Number.isFinite);
    const consensus = median(values) ?? 0;
    const scenarioMax = values.length ? Math.max(...values) : 0;
    const threshold = signalThresholds(signal).possible;
    const supportAgencyCount = perAgency.filter(item => item.evidence >= threshold).length;
    const totalAgencyCount = perAgency.length;
    const supportFraction = totalAgencyCount > 0 ? supportAgencyCount / totalAgencyCount : 0;
    const coverageCredibility = totalAgencyCount >= 3 ? 1 : (totalAgencyCount === 2 ? 0.82 : 0.60);
    const scenarioCredibility = coverageCredibility * (0.45 + 0.55 * supportFraction);
    const aggregate = clamp(Math.max(consensus, scenarioMax * scenarioCredibility));
    return { aggregate, consensus, scenarioMax, supportAgencyCount, totalAgencyCount, scenarioCredibility, perAgency };
  }

  function segmentDurationAbove(left, right, threshold) {
    const leftLead = finite(left?.checkpoint?.leadHours);
    const rightLead = finite(right?.checkpoint?.leadHours);
