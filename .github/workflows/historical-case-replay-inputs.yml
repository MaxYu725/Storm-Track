name: Validate historical replay case inputs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - historical/cases/**
      - scripts/cwa-historical-adapter.mjs
      - tests/historical-case-replay-inputs.test.mjs
      - .github/workflows/historical-case-replay-inputs.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate local contracts
        run: |
          set -euo pipefail
          node --check scripts/cwa-historical-adapter.mjs
          node tests/historical-case-replay-inputs.test.mjs

      - name: Probe official CWA archive index for Noul
        run: |
          set -euo pipefail
          node scripts/cwa-historical-adapter.mjs historical/cases/2026-noul.json > /tmp/noul-cwa.json
          jq -e '.caseId=="2026-noul" and .archive.archiveTyphoonId=="202612" and .archive.nameEn=="NOUL" and .archive.warningBulletinCount==12 and .readiness.indexVerified==true and .readiness.asIssuedForecastPointsExtracted==false and .semantics.currentV1ModelModified==false' /tmp/noul-cwa.json >/dev/null
          jq '{caseId,archive,readiness,semantics}' /tmp/noul-cwa.json

      - name: Probe official CWA archive index for Ragasa
        run: |
          set -euo pipefail
          node scripts/cwa-historical-adapter.mjs historical/cases/2025-ragasa.json > /tmp/ragasa-cwa.json
          jq -e '.caseId=="2025-ragasa" and .archive.archiveTyphoonId=="202518" and .archive.nameEn=="RAGASA" and .archive.warningBulletinCount==21 and .readiness.indexVerified==true and .readiness.asIssuedForecastPointsExtracted==false and .semantics.currentV1ModelModified==false' /tmp/ragasa-cwa.json >/dev/null
          jq '{caseId,archive,readiness,semantics}' /tmp/ragasa-cwa.json

      - name: Check whitespace
        run: git diff --check
