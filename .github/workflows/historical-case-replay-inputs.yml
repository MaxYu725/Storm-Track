name: Validate historical replay case inputs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - historical/cases/**
      - scripts/cma-historical-adapter.mjs
      - tests/historical-case-replay-inputs.test.mjs
      - .github/workflows/historical-case-replay-inputs.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate local contracts
        run: |
          set -euo pipefail
          node --check scripts/cma-historical-adapter.mjs
          node tests/historical-case-replay-inputs.test.mjs

      - name: Extract official CMA/NMC as-issued history for Noul
        run: |
          set -euo pipefail
          node scripts/cma-historical-adapter.mjs historical/cases/2026-noul.json --summary > /tmp/noul-cma.json
          jq -e '.schemaVersion=="cma-historical-adapter/v1" and .caseId=="2026-noul" and .source.agency=="CMA" and .source.storm.nameEn=="NOUL" and .snapshotCount>0 and .semantics.asIssuedForecastHistory==true and .semantics.HkoTruthUsedAsForecastInput==false and .semantics.currentV1ModelModified==false' /tmp/noul-cma.json >/dev/null
          cat /tmp/noul-cma.json

      - name: Extract official CMA/NMC as-issued history for Ragasa
        run: |
          set -euo pipefail
          node scripts/cma-historical-adapter.mjs historical/cases/2025-ragasa.json --summary > /tmp/ragasa-cma.json
          jq -e '.schemaVersion=="cma-historical-adapter/v1" and .caseId=="2025-ragasa" and .source.agency=="CMA" and .source.storm.nameEn=="RAGASA" and .snapshotCount>0 and .semantics.asIssuedForecastHistory==true and .semantics.HkoTruthUsedAsForecastInput==false and .semantics.currentV1ModelModified==false' /tmp/ragasa-cma.json >/dev/null
          cat /tmp/ragasa-cma.json

      - name: Check whitespace
        run: git diff --check
