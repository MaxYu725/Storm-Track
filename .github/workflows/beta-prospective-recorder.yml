name: Record HK signal Beta prospective snapshots

on:
  schedule:
    - cron: '7-52/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - analysis/**
      - index.html
      - scripts/capture-beta-prospective.mjs
      - scripts/build-beta-case-watch.mjs
      - scripts/reconcile-beta-case-identities.mjs
      - .github/workflows/beta-prospective-recorder.yml
      - tests/frontend-beta-prospective-observation.test.cjs
      - tests/storm-case-identity.test.cjs
  pull_request:
    branches:
      - main
    paths:
      - analysis/**
      - index.html
      - scripts/capture-beta-prospective.mjs
      - scripts/build-beta-case-watch.mjs
      - scripts/reconcile-beta-case-identities.mjs
      - .github/workflows/beta-prospective-recorder.yml
      - tests/frontend-beta-prospective-observation.test.cjs
      - tests/storm-case-identity.test.cjs

permissions:
  contents: write

concurrency:
  group: beta-prospective-recorder
  cancel-in-progress: false

env:
  DATA_BRANCH: data/beta-prospective-observations
  PRODUCTION_BETA_URL: https://maxyu725.github.io/Storm-Track/?beta=hk-signal
  PROSPECTIVE_HEARTBEAT_MAX_AGE_SECONDS: 1800
  CASE_WATCH_ACTIVE: 'true'
  CASE_WATCH_ID: '2026-saudel'
  CASE_WATCH_CANONICAL_NAME: 'SAUDEL'
  CASE_WATCH_ALIASES: 'SAUDEL,TC2621'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run recorder unit regression
        run: |
          node --check analysis/frontend-hk-threat-ui.js
          node --check analysis/storm-case-identity.js
          node --check scripts/capture-beta-prospective.mjs
          node --check scripts/build-beta-case-watch.mjs
          node --check scripts/reconcile-beta-case-identities.mjs
          node tests/frontend-beta-prospective-observation.test.cjs
          node tests/frontend-hk-threat-ui.test.cjs
          node tests/storm-case-identity.test.cjs

      - name: Reconcile existing prospective corpus
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/beta-case-corpus
          mkdir -p /tmp/beta-case-corpus
          if git show-ref --verify --quiet "refs/remotes/origin/${DATA_BRANCH}"; then
            git archive "origin/${DATA_BRANCH}" | tar -x -C /tmp/beta-case-corpus
            node scripts/reconcile-beta-case-identities.mjs /tmp/beta-case-corpus > /tmp/beta-case-reconcile.json
            jq '{schemaVersion,reconciledThrough,recordCount,caseCount,cases}' /tmp/beta-case-reconcile.json
            jq -e '.schemaVersion == "storm-case-identity/v1" and (.caseCount >= 1)' /tmp/beta-case-reconcile.json >/dev/null
          fi

      - name: Install lightweight browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0

      - name: Start PR-local frontend
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/storm-track-http.log 2>&1 &
          echo $! > /tmp/storm-track-http.pid
          sleep 2
          curl --fail --retry 3 -sS http://127.0.0.1:4173/ >/dev/null

      - name: Allow Pages deployment to catch up
        if: github.event_name == 'push'
        run: sleep 90

      - name: Capture settled Beta state
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          STORM_BETA_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173/?beta=hk-signal' || env.PRODUCTION_BETA_URL }}
        run: |
          set -euo pipefail
          rm -f /tmp/beta-prospective.json
          for attempt in 1 2 3; do
            echo "capture attempt ${attempt}"
            if node scripts/capture-beta-prospective.mjs > /tmp/beta-prospective.json; then
              break
            fi
            rm -f /tmp/beta-prospective.json
            if [[ "$attempt" -lt 3 ]]; then sleep 30; fi
          done
          test -s /tmp/beta-prospective.json

      - name: Validate capture contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == "beta-prospective-recorder/v2" and
            (.captureFingerprint | test("^[0-9a-f]{64}$")) and
            (.sourceStates | length == 4) and
            (.visibleGroupKeys | type == "array") and
            (.discardedStaleObservationKeys | type == "array") and
            (.observations | type == "array") and
            (.observationCount == (.observations | length)) and
            (.observationCount == (.visibleGroupKeys | length)) and
            (([.observations[].group.key] | sort) == (.visibleGroupKeys | sort)) and
            ([.. | objects | has("rawInput")] | any | not)
          ' /tmp/beta-prospective.json >/dev/null
          jq '{capturedAt,captureFingerprint,sourceCommit,sourceStates,visibleGroupKeys,discardedStaleObservationKeys,observationCount,groups:[.observations[]|{key:.group.key,name:.group.displayName,sources:.sourceAgencies,engineVersions:.engineVersions,generatedAt:.analysis.generatedAt,T1:.analysis.basicForecast.signals.T1.likelihood,T1Window:.analysis.basicForecast.signals.T1.estimatedWindow,T3:.analysis.basicForecast.signals.T3.likelihood,T8:.analysis.basicForecast.signals.T8.likelihood,disagreement:.analysis.threatAssessment.analyzers.agencyDisagreement.confidence}]}' /tmp/beta-prospective.json

      - name: Build watched-case snapshot
        if: env.CASE_WATCH_ACTIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-beta-case-watch.mjs /tmp/beta-prospective.json > /tmp/beta-case-watch.json
          jq -e '
            .schemaVersion == "beta-prospective-case-watch/v1" and
            .watchId == env.CASE_WATCH_ID and
            .canonicalNameEn == env.CASE_WATCH_CANONICAL_NAME and
            (.sourceStates | length == 4) and
            (.visibleGroupKeys | type == "array") and
            (.observations | type == "array") and
            (.matchedObservationCount == (.observations | length)) and
            ([.. | objects | has("rawInput")] | any | not)
          ' /tmp/beta-case-watch.json >/dev/null
          jq '{watchId,capturedAt,captureFingerprint,sourceStates,visibleGroupKeys,matchedObservationCount,matchedGroupKeys,matchedSourceAgencies,groups:[.observations[]|{key:.group.key,name:.group.displayName,sources:.sourceAgencies,bulletins:(.sources|to_entries|map({agency:.key,sourceId:.value.sourceId,bulletinTime:.value.bulletinTime,forecastEnd:.value.forecastEnd.time})),generatedAt:.analysis.generatedAt,T1:.analysis.basicForecast.signals.T1.likelihood,T1Risk:.analysis.basicForecast.signals.T1.riskIndex,T1Window:.analysis.basicForecast.signals.T1.estimatedWindow,T3:.analysis.basicForecast.signals.T3.likelihood,T3Risk:.analysis.basicForecast.signals.T3.riskIndex,T8:.analysis.basicForecast.signals.T8.likelihood,T8Risk:.analysis.basicForecast.signals.T8.riskIndex}]}' /tmp/beta-case-watch.json

      - name: Check branch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check origin/main...HEAD

      - name: Persist prospective state and reconcile cases
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/beta-case-runtime
          mkdir -p /tmp/beta-case-runtime/analysis /tmp/beta-case-runtime/scripts
          cp analysis/storm-case-identity.js /tmp/beta-case-runtime/analysis/
          cp scripts/reconcile-beta-case-identities.mjs /tmp/beta-case-runtime/scripts/

          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$DATA_BRANCH"
            git switch -C "$DATA_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$DATA_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          fingerprint="$(jq -r '.captureFingerprint' /tmp/beta-prospective.json)"
          captured_at="$(jq -r '.capturedAt' /tmp/beta-prospective.json)"
          source_commit="$(jq -r '.sourceCommit // empty' /tmp/beta-prospective.json)"
          existing="$(jq -r '.captureFingerprint // empty' latest.json 2>/dev/null || true)"
          existing_captured_at="$(jq -r '.capturedAt // empty' latest.json 2>/dev/null || true)"
          existing_source_commit="$(jq -r '.sourceCommit // empty' latest.json 2>/dev/null || true)"
          health_row="$(jq -c '{schemaVersion:"beta-prospective-health/v1",capturedAt,captureFingerprint,sourceCommit,sourceStates,visibleGroupKeys}' /tmp/beta-prospective.json)"
          stored=false
          heartbeat=false
          watch_stored=false
          watch_stamp=""
          stamp="identity"
          short="${fingerprint:0:12}"

          if [[ "$CASE_WATCH_ACTIVE" == "true" ]]; then
            test -s /tmp/beta-case-watch.json
            watch_day_path="$(date -u -d "$captured_at" +'%Y/%m/%d')"
            watch_stamp="$(date -u -d "$captured_at" +'%Y%m%dT%H%M%S%3NZ')"
            watch_destination="case-watch/${CASE_WATCH_ID}/snapshots/${watch_day_path}/${watch_stamp}-${short}.json"
            mkdir -p "$(dirname "$watch_destination")" "case-watch/${CASE_WATCH_ID}"
            cp /tmp/beta-case-watch.json "$watch_destination"
            jq -c '{schemaVersion,watchId,canonicalNameEn,aliases,capturedAt,captureFingerprint,sourceCommit,sourceStates,visibleGroupKeys,discardedStaleObservationKeys,matchedObservationCount,matchedGroupKeys,matchedSourceAgencies,groups:[.observations[]|{key:.group.key,displayName:.group.displayName,sourceAgencies:.sourceAgencies,sources:(.sources|to_entries|map({agency:.key,sourceId:.value.sourceId,bulletinTime:.value.bulletinTime,currentTime:.value.current.time,forecastCount:.value.forecastCount,forecastStartTime:.value.forecastStart.time,forecastEndTime:.value.forecastEnd.time})),generatedAt:.analysis.generatedAt,T1:.analysis.basicForecast.signals.T1.likelihood,T1Risk:.analysis.basicForecast.signals.T1.riskIndex,T1Window:.analysis.basicForecast.signals.T1.estimatedWindow,T3:.analysis.basicForecast.signals.T3.likelihood,T3Risk:.analysis.basicForecast.signals.T3.riskIndex,T3Window:.analysis.basicForecast.signals.T3.estimatedWindow,T8:.analysis.basicForecast.signals.T8.likelihood,T8Risk:.analysis.basicForecast.signals.T8.riskIndex,T8Window:.analysis.basicForecast.signals.T8.estimatedWindow}]}' /tmp/beta-case-watch.json >> "case-watch/${CASE_WATCH_ID}/timeline.ndjson"
            watch_stored=true
          fi

          if [[ "$fingerprint" != "$existing" ]]; then
            day_path="$(date -u -d "$captured_at" +'%Y/%m/%d')"
            stamp="$(date -u -d "$captured_at" +'%Y%m%dT%H%M%SZ')"
            destination="observations/${day_path}/${stamp}-${short}.json"
            mkdir -p "$(dirname "$destination")"
            cp /tmp/beta-prospective.json "$destination"
            cp /tmp/beta-prospective.json latest.json
            jq -c '{schemaVersion,capturedAt,captureFingerprint,sourceCommit,sourceStates,visibleGroupKeys,discardedStaleObservationKeys,observationCount,groups:[.observations[]|{key:.group.key,displayName:.group.displayName,sourceAgencies:.sourceAgencies,engineVersions:.engineVersions,generatedAt:.analysis.generatedAt,T1:.analysis.basicForecast.signals.T1.likelihood,T1Window:.analysis.basicForecast.signals.T1.estimatedWindow,T3:.analysis.basicForecast.signals.T3.likelihood,T8:.analysis.basicForecast.signals.T8.likelihood,disagreement:.analysis.threatAssessment.analyzers.agencyDisagreement.confidence}]}' /tmp/beta-prospective.json >> index.ndjson
            printf '%s\n' "$health_row" >> health.ndjson
            stored=true
          else
            refresh_due=true
            if [[ -n "$existing_captured_at" ]]; then
              current_epoch="$(date -u -d "$captured_at" +%s)"
              existing_epoch="$(date -u -d "$existing_captured_at" +%s)"
              age_seconds=$((current_epoch - existing_epoch))
              if (( age_seconds >= 0 && age_seconds < PROSPECTIVE_HEARTBEAT_MAX_AGE_SECONDS )); then
                refresh_due=false
              fi
            fi
            if [[ -n "$source_commit" && "$source_commit" != "$existing_source_commit" ]]; then
              refresh_due=true
            fi
            if [[ "$refresh_due" == true ]]; then
              cp /tmp/beta-prospective.json latest.json
              printf '%s\n' "$health_row" >> health.ndjson
              stamp="$(date -u -d "$captured_at" +'%Y%m%dT%H%M%SZ')"
              heartbeat=true
            fi
          fi

          node /tmp/beta-case-runtime/scripts/reconcile-beta-case-identities.mjs . > /tmp/beta-case-reconcile.json
          jq '{schemaVersion,reconciledThrough,recordCount,caseCount,cases}' /tmp/beta-case-reconcile.json

          git add -A observations latest.json index.ndjson health.ndjson case-registry.json case-index.ndjson case-watch 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "BETA_PROSPECTIVE_NOOP=true"
            echo "BETA_PROSPECTIVE_FINGERPRINT=$fingerprint"
            exit 0
          fi

          if [[ "$stored" == "true" ]]; then
            git commit -m "Observe HK signal Beta ${stamp} ${short}"
          elif [[ "$heartbeat" == "true" ]]; then
            git commit -m "Refresh HK signal Beta heartbeat ${stamp} ${short}"
          elif [[ "$watch_stored" == "true" ]]; then
            git commit -m "Watch ${CASE_WATCH_ID} Beta ${watch_stamp} ${short}"
          else
            git commit -m "Reconcile HK signal Beta storm case identities"
          fi
          git push origin "HEAD:${DATA_BRANCH}"
          echo "BETA_PROSPECTIVE_STORED=$stored"
          echo "BETA_PROSPECTIVE_HEARTBEAT=$heartbeat"
          echo "BETA_PROSPECTIVE_CASE_WATCH_STORED=$watch_stored"
          echo "BETA_PROSPECTIVE_FINGERPRINT=$fingerprint"