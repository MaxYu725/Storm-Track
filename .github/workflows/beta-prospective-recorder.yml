name: Record HK signal Beta prospective snapshots

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - analysis/**
      - index.html
      - scripts/capture-beta-prospective.mjs
      - .github/workflows/beta-prospective-recorder.yml
      - tests/frontend-beta-prospective-observation.test.cjs
  pull_request:
    branches:
      - main
    paths:
      - analysis/**
      - index.html
      - scripts/capture-beta-prospective.mjs
      - .github/workflows/beta-prospective-recorder.yml
      - tests/frontend-beta-prospective-observation.test.cjs

permissions:
  contents: write

concurrency:
  group: beta-prospective-recorder
  cancel-in-progress: false

env:
  DATA_BRANCH: data/beta-prospective-observations
  PRODUCTION_BETA_URL: https://maxyu725.github.io/Storm-Track/?beta=hk-signal

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run recorder unit regression
        run: |
          node --check analysis/frontend-hk-threat-ui.js
          node --check scripts/capture-beta-prospective.mjs
          node tests/frontend-beta-prospective-observation.test.cjs
          node tests/frontend-hk-threat-ui.test.cjs

      - name: Install lightweight browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0

      - name: Start PR-local frontend
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/storm-track-http.log 2>&1 &
          echo $! > /tmp/storm-track-http.pid
          sleep 2
          curl --fail --retry 3 -sS http://127.0.0.1:4173/ >/dev/null

      - name: Allow Pages deployment to catch up
        if: github.event_name == 'push'
        run: sleep 90

      - name: Capture settled Beta state
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          STORM_BETA_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173/?beta=hk-signal' || env.PRODUCTION_BETA_URL }}
        run: |
          set -euo pipefail
          rm -f /tmp/beta-prospective.json
          for attempt in 1 2 3; do
            echo "capture attempt ${attempt}"
            if node scripts/capture-beta-prospective.mjs > /tmp/beta-prospective.json; then
              break
            fi
            rm -f /tmp/beta-prospective.json
            if [[ "$attempt" -lt 3 ]]; then sleep 30; fi
          done
          test -s /tmp/beta-prospective.json

      - name: Validate capture contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == "beta-prospective-recorder/v2" and
            (.captureFingerprint | test("^[0-9a-f]{64}$")) and
            (.sourceStates | length == 4) and
            (.visibleGroupKeys | type == "array") and
            (.discardedStaleObservationKeys | type == "array") and
            (.observations | type == "array") and
            (.observationCount == (.observations | length)) and
            (.observationCount == (.visibleGroupKeys | length)) and
            ([.observations[].group.key] | sort == (.visibleGroupKeys | sort)) and
            ([.. | objects | has("rawInput")] | any | not)
          ' /tmp/beta-prospective.json >/dev/null
          jq '{capturedAt,captureFingerprint,sourceCommit,sourceStates,visibleGroupKeys,discardedStaleObservationKeys,observationCount,groups:[.observations[]|{key:.group.key,name:.group.displayName,sources:.sourceAgencies,engineVersions:.engineVersions,generatedAt:.analysis.generatedAt,T1:.analysis.basicForecast.signals.T1.likelihood,T1Window:.analysis.basicForecast.signals.T1.estimatedWindow,T3:.analysis.basicForecast.signals.T3.likelihood,T8:.analysis.basicForecast.signals.T8.likelihood,disagreement:.analysis.threatAssessment.analyzers.agencyDisagreement.confidence}]}' /tmp/beta-prospective.json

      - name: Check branch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check origin/main...HEAD

      - name: Persist new prospective fingerprint
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$DATA_BRANCH"
            git switch -C "$DATA_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$DATA_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          fingerprint="$(jq -r '.captureFingerprint' /tmp/beta-prospective.json)"
          existing="$(jq -r '.captureFingerprint // empty' latest.json 2>/dev/null || true)"
          if [[ "$fingerprint" == "$existing" ]]; then
            echo "BETA_PROSPECTIVE_NOOP=true"
            echo "BETA_PROSPECTIVE_FINGERPRINT=$fingerprint"
            exit 0
          fi

          captured_at="$(jq -r '.capturedAt' /tmp/beta-prospective.json)"
          day_path="$(date -u -d "$captured_at" +'%Y/%m/%d')"
          stamp="$(date -u -d "$captured_at" +'%Y%m%dT%H%M%SZ')"
          short="${fingerprint:0:12}"
          destination="observations/${day_path}/${stamp}-${short}.json"
          mkdir -p "$(dirname "$destination")"
          cp /tmp/beta-prospective.json "$destination"
          cp /tmp/beta-prospective.json latest.json

          jq -c '{schemaVersion,capturedAt,captureFingerprint,sourceCommit,sourceStates,visibleGroupKeys,discardedStaleObservationKeys,observationCount,groups:[.observations[]|{key:.group.key,displayName:.group.displayName,sourceAgencies:.sourceAgencies,engineVersions:.engineVersions,generatedAt:.analysis.generatedAt,T1:.analysis.basicForecast.signals.T1.likelihood,T1Window:.analysis.basicForecast.signals.T1.estimatedWindow,T3:.analysis.basicForecast.signals.T3.likelihood,T8:.analysis.basicForecast.signals.T8.likelihood,disagreement:.analysis.threatAssessment.analyzers.agencyDisagreement.confidence}]}' /tmp/beta-prospective.json >> index.ndjson

          git add "$destination" latest.json index.ndjson
          git commit -m "Observe HK signal Beta ${stamp} ${short}"
          git push origin "HEAD:${DATA_BRANCH}"
          echo "BETA_PROSPECTIVE_STORED=$destination"
          echo "BETA_PROSPECTIVE_FINGERPRINT=$fingerprint"
