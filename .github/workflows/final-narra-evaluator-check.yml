name: Final NARRA evaluator check

on:
  push:
    branches:
      - fix/narra-evaluator-diagnostics

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          node --check analysis/hk-signal-closeout.js
          node tests/hk-signal-closeout.test.cjs
