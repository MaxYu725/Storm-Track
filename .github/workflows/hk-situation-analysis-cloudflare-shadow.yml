name: Run AI situation analysis Cloudflare Workers AI shadow

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Exact case ID from the immutable situation packet corpus
        required: true
        type: string
      model:
        description: Cloudflare Workers AI model ID
        required: true
        default: '@cf/openai/gpt-oss-120b'
        type: string
      force:
        description: Allow another inference for the same packet/prompt/model/provider settings
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: hk-situation-cloudflare-shadow-${{ inputs.case_id }}
  cancel-in-progress: false

env:
  INPUT_DATA_BRANCH: data/hk-situation-analysis-shadow-packets
  OUTPUT_DATA_BRANCH: data/hk-situation-analysis-shadow-inferences

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run Cloudflare inference adapter regressions
        run: |
          set -euo pipefail
          node --check analysis/hk-situation-analysis-prompt.js
          node --check scripts/run-hk-situation-analysis-shadow-cloudflare.mjs
          node tests/hk-situation-analysis-shadow.test.cjs
          node tests/hk-situation-analysis-cloudflare-inference.test.cjs

      - name: Load exact immutable packet
        shell: bash
        env:
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${INPUT_DATA_BRANCH}:refs/remotes/origin/${INPUT_DATA_BRANCH}"
          git show "refs/remotes/origin/${INPUT_DATA_BRANCH}:latest.json" > /tmp/hk-situation-packet-batch.json
          jq --arg case_id "$CASE_ID" -e '
            [.packets[] | select(.caseId == $case_id)]
            | if length == 1 then .[0]
              elif length == 0 then error("case ID is not present in latest packet batch")
              else error("case ID is ambiguous in latest packet batch") end
          ' /tmp/hk-situation-packet-batch.json > /tmp/hk-situation-packet.json
          jq '{schemaVersion,packetFingerprint,caseId,groupKey,sourceObservationObservedAt,provenance}' /tmp/hk-situation-packet.json

      - name: Resolve Cloudflare Workers AI credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          account_id="${CLOUDFLARE_ACCOUNT_ID:-${CF_ACCOUNT_ID:-}}"
          api_token="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
          if [[ -z "$account_id" ]]; then
            echo "Cloudflare account ID is not configured. Add CLOUDFLARE_ACCOUNT_ID or CF_ACCOUNT_ID." >&2
            exit 2
          fi
          if [[ -z "$api_token" ]]; then
            echo "Cloudflare API token is not configured. Add CLOUDFLARE_API_TOKEN or CF_API_TOKEN with Workers AI permission." >&2
            exit 2
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$api_token" >> "$GITHUB_ENV"

      - name: Run one closed-book structured Workers AI inference
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          node scripts/run-hk-situation-analysis-shadow-cloudflare.mjs \
            /tmp/hk-situation-packet.json \
            "$MODEL" \
            > /tmp/hk-situation-inference.json
          test -s /tmp/hk-situation-inference.json

      - name: Validate inference isolation contract
        shell: bash
        run: |
          set -euo pipefail
          packet_fingerprint="$(jq -r '.packetFingerprint' /tmp/hk-situation-packet.json)"
          jq --arg packet "$packet_fingerprint" -e '
            .schemaVersion == "hk-situation-analysis-shadow-inference/v0.1" and
            .input.packetFingerprint == $packet and
            .prompt.version == "hk-situation-analysis-prompt/v0.2" and
            .prompt.outputSchemaVersion == "hk-situation-analysis-shadow-output/v0.1" and
            (.prompt.requestFingerprint | test("^[0-9a-f]{64}$")) and
            .provider.name == "cloudflare-workers-ai-chat-completions" and
            .provider.endpoint == "https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1/chat/completions" and
            .provider.store == false and
            .provider.toolsEnabled == false and
            .provider.reasoningControl == "provider-default" and
            .output.schemaVersion == "hk-situation-analysis-shadow-output/v0.1" and
            .semantics.shadowOnly == true and
            .semantics.affectsForecast == false and
            .semantics.affectsEvaluator == false and
            .semantics.noTruthFeedback == true and
            .semantics.noExternalTools == true and
            .semantics.noWebSearch == true and
            .semantics.inputPacketIsSoleMeteorologicalEvidence == true and
            .semantics.caseSpecificRulesForbidden == true and
            .semantics.structuredOutputRequired == true and
            .semantics.localValidationRequired == true and
            .semantics.exactEvidenceReferencesRequired == true
          ' /tmp/hk-situation-inference.json >/dev/null
          jq '{createdAt,input,prompt,provider:{name:.provider.name,requestedModel:.provider.requestedModel,returnedModel:.provider.returnedModel,responseId:.provider.responseId,requestId:.provider.requestId,status:.provider.status,reasoningControl:.provider.reasoningControl,temperature:.provider.temperature,seed:.provider.seed,maxTokens:.provider.maxTokens,usage:.provider.usage},output,semantics}' /tmp/hk-situation-inference.json

      - name: Persist immutable Cloudflare inference output
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$OUTPUT_DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$OUTPUT_DATA_BRANCH"
            git switch -C "$OUTPUT_DATA_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$OUTPUT_DATA_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          provider_slug="cloudflare-workers-ai"
          case_id="$(jq -r '.input.caseId // "unresolved"' /tmp/hk-situation-inference.json)"
          case_slug="$(printf '%s' "$case_id" | sed -E 's/[^A-Za-z0-9._-]+/_/g')"
          packet_fingerprint="$(jq -r '.input.packetFingerprint' /tmp/hk-situation-inference.json)"
          prompt_version="$(jq -r '.prompt.version' /tmp/hk-situation-inference.json)"
          requested_model="$(jq -r '.provider.requestedModel' /tmp/hk-situation-inference.json)"
          temperature="$(jq -r '.provider.temperature' /tmp/hk-situation-inference.json)"
          seed="$(jq -r '.provider.seed' /tmp/hk-situation-inference.json)"
          provider_latest="cases/${case_slug}/providers/${provider_slug}/latest.json"

          if [[ "$FORCE" != "true" && -f "$provider_latest" ]]; then
            existing_packet="$(jq -r '.input.packetFingerprint // empty' "$provider_latest")"
            existing_prompt="$(jq -r '.prompt.version // empty' "$provider_latest")"
            existing_model="$(jq -r '.provider.requestedModel // empty' "$provider_latest")"
            existing_temperature="$(jq -r '.provider.temperature // empty' "$provider_latest")"
            existing_seed="$(jq -r '.provider.seed // empty' "$provider_latest")"
            if [[ "$packet_fingerprint" == "$existing_packet" \
               && "$prompt_version" == "$existing_prompt" \
               && "$requested_model" == "$existing_model" \
               && "$temperature" == "$existing_temperature" \
               && "$seed" == "$existing_seed" ]]; then
              echo "HK_SITUATION_CLOUDFLARE_SHADOW_NOOP=true"
              echo "Existing Cloudflare inference already covers the same packet/prompt/model/settings. Use force=true only for an intentional repeat."
              exit 0
            fi
          fi

          created_at="$(jq -r '.createdAt' /tmp/hk-situation-inference.json)"
          day_path="$(date -u -d "$created_at" +'%Y/%m/%d')"
          stamp="$(date -u -d "$created_at" +'%Y%m%dT%H%M%SZ')"
          packet_short="${packet_fingerprint:0:12}"
          request_fingerprint="$(jq -r '.prompt.requestFingerprint' /tmp/hk-situation-inference.json)"
          request_short="${request_fingerprint:0:12}"
          destination="inferences/${case_slug}/${provider_slug}/${day_path}/${stamp}-${packet_short}-${request_short}.json"
          mkdir -p "$(dirname "$destination")" "$(dirname "$provider_latest")" "providers/${provider_slug}"

          cp /tmp/hk-situation-inference.json "$destination"
          cp /tmp/hk-situation-inference.json "$provider_latest"
          cp /tmp/hk-situation-inference.json "providers/${provider_slug}/latest.json"
          jq -c '{schemaVersion,createdAt,input,prompt,provider:{name:.provider.name,requestedModel:.provider.requestedModel,returnedModel:.provider.returnedModel,responseId:.provider.responseId,status:.provider.status,reasoningControl:.provider.reasoningControl,temperature:.provider.temperature,seed:.provider.seed,usage:.provider.usage},summary:{currentPhase:.output.currentPhase,currentPhaseConfidence:.output.currentPhaseConfidence,nextDecisionQuestion:.output.nextDecisionWindow.question},semantics}' /tmp/hk-situation-inference.json >> index.ndjson

          git add "$destination" "$provider_latest" "providers/${provider_slug}/latest.json" index.ndjson
          git commit -m "Record Cloudflare AI situation shadow ${case_slug} ${stamp} ${packet_short}"
          git push origin "HEAD:${OUTPUT_DATA_BRANCH}"
          echo "HK_SITUATION_CLOUDFLARE_SHADOW_STORED=$destination"
