name: AI-22E Capture WP-2026-16 bounded lifecycle corpus

on:
  push:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/ai22-capture-wp16.yml
      - .github/ai22-wp16-capture-trigger.txt
      - tests/storm-analysis-ai22-capture.test.mjs
      - workers/storm-analysis/package.json
      - workers/storm-analysis/scripts/ai22-build-lifecycle-capture.mjs
      - workers/storm-analysis/scripts/ai22-select-lifecycle-cutoffs.mjs
      - workers/storm-analysis/src/corpus-lifecycle-repository.js
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/ai22-capture-wp16.yml
      - tests/storm-analysis-ai22-capture.test.mjs
      - workers/storm-analysis/package.json
      - workers/storm-analysis/scripts/ai22-build-lifecycle-capture.mjs
      - workers/storm-analysis/scripts/ai22-select-lifecycle-cutoffs.mjs
      - workers/storm-analysis/src/corpus-lifecycle-repository.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai22-wp16-bounded-capture
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  BACKFILL_TOKEN: ${{ secrets.BACKFILL_TOKEN }}
  WORKER_URL: https://storm-analysis.max-yu.workers.dev
  SOURCE_DB_ID: eb0bf995-3ea7-4bf6-bbca-b425892c4d7e
  ANALYSIS_DB_ID: 99c692b2-c932-4774-bf8d-2d7f10f6c6f8
  STORM_KEY: WP-2026-16
  WINDOW_ID: wp-2026-16-operational-202608
  EXPECTED_RUN_ID: ai22_capture_8ccc1ac5038e5119
  EXPECTED_EVIDENCE_SHA256: 8ccc1ac5038e51199b76b1f013f5ee2fcc7c73a7f5c4ee2a8fb722cb871af191
  EXPECTED_PLAN_SHA256: 0d0d2f759329ac2ecfa2ca8d9e7619313ecdfe7bc87acc79a655393700a11a6d
  EXPECTED_CAPTURE_FINGERPRINT: 01185f49897da6723fe14c0953aa1a9da78194f71cd14325cad3459185687e78

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical AI branch
        uses: actions/checkout@v6
        with:
          ref: feature/ai-analysis-engine
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Worker toolchain
        working-directory: workers/storm-analysis
        run: npm install --no-audit --no-fund

      - name: Run complete pre-capture regression gates
        shell: bash
        run: |
          set -euo pipefail
          (cd workers/storm-analysis && npm test)
          (cd workers/storm-analysis && npm run test:integration)
          (cd workers/storm-analysis && npm run check:config)

      - name: Verify phase locks and runtime activation
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < ../../.github/ai19-backfill-trigger.txt)" == "COMPLETED_AI19" ]]
          [[ "$(tr -d '\r\n' < ../../.github/ai20-truth-trigger.txt)" == "PENDING_AI20" ]]
          [[ "$(tr -d '\r\n' < ../../.github/ai21-corpus-trigger.txt)" == "COMPLETED_AI21" ]]
          [[ "$(tr -d '\r\n' < ../../.github/ai22-lifecycle-trigger.txt)" == "PENDING_AI22" ]]
          [[ "$(tr -d '\r\n' < ../../.github/ai22-runtime-trigger.txt)" == "COMPLETED_AI22_RUNTIME" ]]
          databases="$(npx wrangler d1 list --json --experimental-provision=false)"
          source_id="$(printf '%s' "$databases" | jq -r '.[] | select(.name == "storm-track-db") | (.uuid // .id // empty)')"
          analysis_id="$(printf '%s' "$databases" | jq -r '.[] | select(.name == "storm-analysis") | (.uuid // .id // empty)')"
          [[ "$source_id" == "$SOURCE_DB_ID" ]]
          [[ "$analysis_id" == "$ANALYSIS_DB_ID" ]]
          health="$(curl --fail --retry 5 --retry-delay 2 --retry-all-errors -sS "${WORKER_URL}/health")"
          printf '%s' "$health" | jq -e '.ok==true and .service=="storm-analysis" and .analysisDbBound==true and .importEnabled==true and .analysisAdminEnabled==true and .corpusLifecycleVersion=="corpus-lifecycle-capture/v1" and .workersAiEnabled==false and .automaticPromotionEnabled==false and .productionStormWorkerModified==false' >/dev/null
          echo 'AI22E_RUNTIME_AND_RESOURCES_VERIFIED=true'

      - name: Rebuild exact WP-2026-16 capture request from production SELECTs
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command "SELECT id,name_zh,name_en,status,international_number,merged_into_id,created_at,updated_at FROM storms WHERE id='${STORM_KEY}' LIMIT 1;" > /tmp/ai22e-storm-raw.json
          jq '[.. | objects | select(.id == "WP-2026-16" and has("status"))] | first' /tmp/ai22e-storm-raw.json > /tmp/ai22e-storm.json
          jq -e '.id == "WP-2026-16" and (.merged_into_id == null) and (.status != "merged")' /tmp/ai22e-storm.json >/dev/null
          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command "SELECT a.id,a.storm_id,a.agency,a.issued_at,a.fetched_at,a.source_code,a.source_url,a.source_hash,a.raw_object_key,a.parser_version FROM advisories a WHERE a.storm_id='${STORM_KEY}' AND EXISTS (SELECT 1 FROM track_points tp WHERE tp.advisory_id=a.id AND tp.point_type='forecast' AND tp.valid_at>a.issued_at) ORDER BY a.issued_at,a.agency,a.id;" > /tmp/ai22e-advisories-raw.json
          jq '[.. | objects | select(.storm_id == "WP-2026-16" and has("agency") and has("source_hash"))]' /tmp/ai22e-advisories-raw.json > /tmp/ai22e-advisories.json
          npx wrangler d1 execute storm-track-db --remote --json --experimental-provision=false --command "SELECT a.storm_id,a.agency,tp.advisory_id,tp.valid_at,tp.forecast_hour,tp.latitude,tp.longitude,tp.pressure_hpa,tp.wind_ms,tp.gust_ms,tp.wind_averaging_minutes,tp.intensity_code,tp.intensity_label,tp.probability_radius_km,tp.source_order FROM advisories a JOIN track_points tp ON tp.advisory_id=a.id WHERE a.storm_id='${STORM_KEY}' AND tp.point_type='forecast' ORDER BY a.issued_at,a.agency,tp.valid_at,tp.source_order;" > /tmp/ai22e-points-raw.json
          jq '[.. | objects | select(.storm_id == "WP-2026-16" and has("advisory_id") and has("valid_at"))]' /tmp/ai22e-points-raw.json > /tmp/ai22e-points.json
          node scripts/ai22-select-lifecycle-cutoffs.mjs --storm /tmp/ai22e-storm.json --advisories /tmp/ai22e-advisories.json --points /tmp/ai22e-points.json --window-id "$WINDOW_ID" --snapshots 4 --output /tmp/ai22e-evidence.json --summary /tmp/ai22e-selection.json > /tmp/ai22e-selection-stdout.json
          rm -rf /tmp/ai22e-build
          node scripts/ai22-build-lifecycle-capture.mjs --evidence /tmp/ai22e-evidence.json --output /tmp/ai22e-build > /tmp/ai22e-summary.json
          jq -e '.stormKey=="WP-2026-16" and .selectedSnapshotCount==4 and .maxAgencyCount==4 and .lifecycle.windowId=="wp-2026-16-operational-202608"' /tmp/ai22e-selection.json >/dev/null
          [[ "$(jq -r '.runId' /tmp/ai22e-summary.json)" == "$EXPECTED_RUN_ID" ]]
          [[ "$(jq -r '.evidenceSha256' /tmp/ai22e-summary.json)" == "$EXPECTED_EVIDENCE_SHA256" ]]
          [[ "$(jq -r '.planSha256' /tmp/ai22e-summary.json)" == "$EXPECTED_PLAN_SHA256" ]]
          [[ "$(jq -r '.captureFingerprint' /tmp/ai22e-summary.json)" == "$EXPECTED_CAPTURE_FINGERPRINT" ]]
          jq -e '.snapshotCount==4 and .identityProposalCount==1 and .tableCounts.backfill_runs==1 and .tableCounts.historical_storms==1 and .tableCounts.forecast_snapshots==4 and .remoteWritesPerformed==false' /tmp/ai22e-summary.json >/dev/null
          jq -e '(.identityProposals|length)==1 and .identityProposals[0].stormKey=="WP-2026-16" and .identityProposals[0].identityValue=="18" and .identityProposals[0].reviewStatus=="unreviewed"' /tmp/ai22e-build/lifecycle-capture-request.json >/dev/null
          [[ "$(wc -c < /tmp/ai22e-build/lifecycle-capture-request.json)" -lt 1000000 ]]
          echo 'AI22E_CANONICAL_CAPTURE_REQUEST_VERIFIED=true'

      - name: Live pre-capture preview must be four appends and zero writes
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BACKFILL_TOKEN:-}" ]]
          status="$(curl -sS -o /tmp/ai22e-preview.json -w '%{http_code}' -X POST "${WORKER_URL}/api/corpus/capture/preview" -H "authorization: Bearer ${BACKFILL_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/ai22e-build/lifecycle-capture-request.json)"
          [[ "$status" == "200" ]]
          jq -e '.ok==true and .dryRun==true and .runId=="ai22_capture_8ccc1ac5038e5119" and .stormCount==1 and .snapshotCount==4 and .appendedSnapshotCount==4 and .existingSnapshotCount==0 and .writesPerformed==false and .storms["WP-2026-16"].existingState==null and .storms["WP-2026-16"].initialState=="active"' /tmp/ai22e-preview.json >/dev/null
          echo 'AI22E_LIVE_PREVIEW_READY=true'

      - name: Verify exact remote pre-capture state using SELECT only
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute storm-analysis --remote --json --experimental-provision=false --command "SELECT name FROM d1_migrations ORDER BY id; SELECT (SELECT COUNT(*) FROM backfill_runs) backfill_runs,(SELECT COUNT(*) FROM historical_storms) historical_storms,(SELECT COUNT(*) FROM forecast_snapshots) forecast_snapshots,(SELECT COUNT(*) FROM forecast_snapshots WHERE storm_key='WP-2026-16') wp16_snapshots,(SELECT COUNT(*) FROM corpus_capture_windows) capture_windows,(SELECT COUNT(*) FROM corpus_capture_runs) capture_runs,(SELECT COUNT(*) FROM corpus_snapshot_memberships) snapshot_memberships,(SELECT COUNT(*) FROM corpus_lifecycle_events) lifecycle_events,(SELECT COUNT(*) FROM storm_identity_bindings) identity_bindings,(SELECT COUNT(*) FROM storm_identity_bindings WHERE review_status='reviewed') reviewed_identity_bindings,(SELECT COUNT(*) FROM storm_identity_merges) identity_merges,(SELECT COUNT(*) FROM truth_datasets) truth_datasets,(SELECT COUNT(*) FROM truth_points) truth_points,(SELECT COUNT(*) FROM verification_results) verification_results,(SELECT COUNT(*) FROM agency_skill_profiles) agency_skill_profiles,(SELECT COUNT(*) FROM adaptive_weight_candidates) adaptive_weight_candidates,(SELECT COUNT(*) FROM signal_calibration_training_runs) training_runs,(SELECT COUNT(*) FROM signal_outcome_curations) curations,(SELECT COUNT(*) FROM signal_profile_promotion_events) promotion_events,(SELECT generation FROM signal_calibration_state WHERE state_id=1) generation,(SELECT champion_profile_id FROM signal_calibration_state WHERE state_id=1) champion_profile_id;" > /tmp/ai22e-prestate.json
          PRESTATE=/tmp/ai22e-prestate.json node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input=JSON.parse(fs.readFileSync(process.env.PRESTATE,'utf8'));
          const rows=value=>Array.isArray(value)?value.flatMap(rows):(value&&typeof value==='object'?(Array.isArray(value.results)?value.results:Object.values(value).flatMap(rows)):[]);
          const all=rows(input);
          const names=all.filter(row=>typeof row?.name==='string').map(row=>row.name);
          const expectedMigrations=['0001_learning.sql','0002_analysis_cache.sql','0003_signal_risk_calibration.sql','0004_signal_training_runs.sql','0005_signal_outcome_curations.sql','0006_signal_profile_promotions.sql','0007_corpus_lifecycle.sql'];
          if (JSON.stringify(names)!==JSON.stringify(expectedMigrations)) throw new Error(`unexpected migrations ${JSON.stringify(names)}`);
          const row=all.find(item=>Object.hasOwn(item||{},'backfill_runs'));
          const expected={backfill_runs:2,historical_storms:2,forecast_snapshots:8,wp16_snapshots:0,capture_windows:0,capture_runs:0,snapshot_memberships:0,lifecycle_events:0,identity_bindings:0,reviewed_identity_bindings:0,identity_merges:0,truth_datasets:0,truth_points:0,verification_results:0,agency_skill_profiles:0,adaptive_weight_candidates:0,training_runs:0,curations:0,promotion_events:0,generation:0};
          for (const [key,value] of Object.entries(expected)) if (Number(row?.[key])!==value) throw new Error(`AI-22E refuses ${key}=${row?.[key]}; expected ${value}`);
          if (row.champion_profile_id!=null) throw new Error('AI-22E refuses pre-existing Champion');
          NODE
          echo 'AI22E_PRESTATE_VERIFIED=true'

      - name: Resolve explicit bounded-capture mutation request
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          trigger="$(tr -d '\r\n' < .github/ai22-wp16-capture-trigger.txt)"
          [[ "$trigger" == "PENDING_AI22_WP16_CAPTURE" || "$trigger" == "ACTIVATE_AI22_WP16_CAPTURE" || "$trigger" == "COMPLETED_AI22_WP16_CAPTURE" ]]
          requested=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/feature/ai-analysis-engine" && "$trigger" == "ACTIVATE_AI22_WP16_CAPTURE" ]]; then
            requested=true
          fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "AI22E_CAPTURE_LIFECYCLE=$trigger"
          echo "AI22E_REMOTE_CAPTURE_REQUESTED=$requested"

      - name: Perform first bounded WP-2026-16 lifecycle capture
        if: steps.gate.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/ai22e-capture.json -w '%{http_code}' -X POST "${WORKER_URL}/api/corpus/capture" -H "authorization: Bearer ${BACKFILL_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/ai22e-build/lifecycle-capture-request.json)"
          [[ "$status" == "200" ]]
          jq -e '.ok==true and .status=="completed" and .runId=="ai22_capture_8ccc1ac5038e5119" and .stormCount==1 and .snapshotCount==4 and .appendedSnapshotCount==4 and .existingSnapshotCount==0 and .writesPerformed==true and .storms["WP-2026-16"].windowId=="wp-2026-16-operational-202608" and .storms["WP-2026-16"].initialState=="active" and (.identityResults|length)==1 and .identityResults[0].reviewStatus=="unreviewed" and .identityResults[0].canonical==false and .semantics.historicalSnapshotRewrite==false and .semantics.truthWritten==false and .semantics.trainingWritten==false and .semantics.promotionWritten==false' /tmp/ai22e-capture.json >/dev/null
          echo 'AI22E_FIRST_CAPTURE_COMPLETED=true'

      - name: Replay exact capture and require zero semantic writes
        if: steps.gate.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/ai22e-replay.json -w '%{http_code}' -X POST "${WORKER_URL}/api/corpus/capture" -H "authorization: Bearer ${BACKFILL_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/ai22e-build/lifecycle-capture-request.json)"
          [[ "$status" == "200" ]]
          jq -e '.ok==true and .status=="already-imported" and .runId=="ai22_capture_8ccc1ac5038e5119" and .snapshotCount==4 and .appendedSnapshotCount==0 and .existingSnapshotCount==4 and .writesPerformed==false and (.identityResults|length)==1 and .identityResults[0].writesPerformed==false' /tmp/ai22e-replay.json >/dev/null
          echo 'AI22E_EXACT_REPLAY_ZERO_WRITE=true'

      - name: Verify exact post-capture state and safety invariants
        if: steps.gate.outputs.requested == 'true'
        working-directory: workers/storm-analysis
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute storm-analysis --remote --json --experimental-provision=false --command "SELECT (SELECT COUNT(*) FROM backfill_runs) backfill_runs,(SELECT COUNT(*) FROM backfill_runs WHERE run_id='${EXPECTED_RUN_ID}' AND status='completed') ai22_run_completed,(SELECT COUNT(*) FROM historical_storms) historical_storms,(SELECT COUNT(*) FROM historical_storms WHERE storm_key='WP-2026-16' AND backfill_mode='forecast-only' AND agency_skill_eligible=0) wp16_storm_ok,(SELECT COUNT(*) FROM forecast_snapshots) forecast_snapshots,(SELECT COUNT(*) FROM forecast_snapshots WHERE storm_key='WP-2026-16') wp16_snapshots,(SELECT COUNT(*) FROM corpus_capture_windows) capture_windows,(SELECT COUNT(*) FROM corpus_capture_windows WHERE window_id='${WINDOW_ID}' AND storm_key='WP-2026-16' AND lifecycle_state='active' AND last_capture_run_id='${EXPECTED_RUN_ID}') wp16_window_ok,(SELECT COUNT(*) FROM corpus_capture_runs) capture_runs,(SELECT COUNT(*) FROM corpus_capture_runs WHERE capture_run_id='${EXPECTED_RUN_ID}' AND fingerprint='${EXPECTED_CAPTURE_FINGERPRINT}' AND status='completed') wp16_capture_run_ok,(SELECT COUNT(*) FROM corpus_snapshot_memberships) snapshot_memberships,(SELECT COUNT(*) FROM corpus_snapshot_memberships WHERE capture_run_id='${EXPECTED_RUN_ID}' AND window_id='${WINDOW_ID}' AND disposition='appended') wp16_memberships_ok,(SELECT COUNT(*) FROM corpus_lifecycle_events) lifecycle_events,(SELECT COUNT(*) FROM storm_identity_bindings) identity_bindings,(SELECT COUNT(*) FROM storm_identity_bindings WHERE storm_key='WP-2026-16' AND identity_type='production-international-number' AND identity_value='18' AND review_status='unreviewed') wp16_identity_unreviewed,(SELECT COUNT(*) FROM storm_identity_bindings WHERE review_status='reviewed') reviewed_identity_bindings,(SELECT COUNT(*) FROM storm_identity_merges) identity_merges,(SELECT COUNT(*) FROM truth_datasets) truth_datasets,(SELECT COUNT(*) FROM truth_points) truth_points,(SELECT COUNT(*) FROM verification_results) verification_results,(SELECT COUNT(*) FROM agency_skill_profiles) agency_skill_profiles,(SELECT COUNT(*) FROM adaptive_weight_candidates) adaptive_weight_candidates,(SELECT COUNT(*) FROM signal_calibration_training_runs) training_runs,(SELECT COUNT(*) FROM signal_outcome_curations) curations,(SELECT COUNT(*) FROM signal_profile_promotion_events) promotion_events,(SELECT generation FROM signal_calibration_state WHERE state_id=1) generation,(SELECT champion_profile_id FROM signal_calibration_state WHERE state_id=1) champion_profile_id;" > /tmp/ai22e-poststate.json
          row="$(jq -c '.. | objects | select(has("backfill_runs"))' /tmp/ai22e-poststate.json | head -n1)"
          ROW="$row" node --input-type=module <<'NODE'
          const row=JSON.parse(process.env.ROW);
          const expected={backfill_runs:3,ai22_run_completed:1,historical_storms:3,wp16_storm_ok:1,forecast_snapshots:12,wp16_snapshots:4,capture_windows:1,wp16_window_ok:1,capture_runs:1,wp16_capture_run_ok:1,snapshot_memberships:4,wp16_memberships_ok:4,lifecycle_events:1,identity_bindings:1,wp16_identity_unreviewed:1,reviewed_identity_bindings:0,identity_merges:0,truth_datasets:0,truth_points:0,verification_results:0,agency_skill_profiles:0,adaptive_weight_candidates:0,training_runs:0,curations:0,promotion_events:0,generation:0};
          for (const [key,value] of Object.entries(expected)) if (Number(row[key])!==value) throw new Error(`AI-22E post-state ${key}=${row[key]}; expected ${value}`);
          if (row.champion_profile_id!=null) throw new Error('AI-22E changed Champion');
          NODE
          echo 'AI22E_POSTSTATE_VERIFIED=true'

      - name: Record successful first bounded capture
        if: steps.gate.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/AI22_WP16_FIRST_CAPTURE_RESULT.md <<EOF
          # AI-22E — WP-2026-16 First Bounded Lifecycle Capture Result

          Status: **first bounded capture completed; incremental append proof still pending**

          - Source commit: \`${GITHUB_SHA}\`
          - Actions run: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`
          - Storm key: \`WP-2026-16\`
          - Capture window: \`${WINDOW_ID}\`
          - Run ID: \`${EXPECTED_RUN_ID}\`
          - Evidence SHA-256: \`${EXPECTED_EVIDENCE_SHA256}\`
          - Plan SHA-256: \`${EXPECTED_PLAN_SHA256}\`
          - Capture fingerprint: \`${EXPECTED_CAPTURE_FINGERPRINT}\`
          - Snapshots appended: \`4\`
          - Exact replay: \`4 existing / 0 appended / writesPerformed=false\`
          - Lifecycle state: \`active\`
          - Production international number \`18\`: stored only as \`unreviewed\` identity evidence
          - Reviewed identity bindings / merges: \`0 / 0\`
          - Remote forecast snapshots total / WP-2026-16: \`12 / 4\`
          - Truth / verification / training / promotion rows: \`0\`
          - Signal Champion: \`NONE / generation 0\`
          - Production \`storm-track-db\`: read-only
          - Production Storm Worker modified: \`false\`

          AI-22 remains open. The next checkpoint must append at least one genuinely new cutoff to the same capture window and prove that the four existing immutable snapshots are reused without rewrite.
          EOF
          printf '%s\n' 'COMPLETED_AI22_WP16_CAPTURE' > .github/ai22-wp16-capture-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AI22_WP16_FIRST_CAPTURE_RESULT.md .github/ai22-wp16-capture-trigger.txt
          git commit -m 'AI-22E: record first WP-2026-16 lifecycle capture [skip ci]'
          git push origin HEAD:feature/ai-analysis-engine

      - name: Confirm mutation gate is closed
        if: steps.gate.outputs.requested != 'true'
        run: |
          echo 'AI22E_REMOTE_CAPTURE_REQUESTED=false'
          echo 'AI22E_CORPUS_WRITES_PERFORMED=false'
          echo 'AI22E_TRUTH_VERIFICATION_TRAINING_PROMOTION_WRITES=false'
