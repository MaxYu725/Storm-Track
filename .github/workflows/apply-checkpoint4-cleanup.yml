name: Apply Checkpoint 4 final cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/checkpoint4-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Apply final targeted cleanup
        run: python tools/apply_checkpoint4_cleanup.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/storm-inline.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/storm-inline.js
          node --check sw.js

      - name: Commit final cleanup and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-checkpoint4-cleanup.yml tools/apply_checkpoint4_cleanup.py
          git commit -m "Remove redundant PWA reload state"
          git push origin HEAD:${{ github.head_ref }}
