name: Keep HK signal validation coverage healthy

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/hk-signal-coverage-keeper.sh
      - .github/workflows/hk-signal-coverage-keeper.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/hk-signal-coverage-keeper.sh
      - .github/workflows/hk-signal-coverage-keeper.yml

permissions:
  contents: read
  actions: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate coverage keeper dispatcher
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/hk-signal-coverage-keeper.sh
          output="$(
            COVERAGE_KEEPER_DRY_RUN=true \
            COVERAGE_KEEPER_ONCE=true \
            COVERAGE_KEEPER_INTERVAL_SECONDS=300 \
            COVERAGE_KEEPER_SESSION_SECONDS=300 \
            COVERAGE_KEEPER_EVALUATOR_DELAY_SECONDS=90 \
            COVERAGE_KEEPER_REF=main \
            bash scripts/hk-signal-coverage-keeper.sh
          )"
          printf '%s\n' "$output"
          grep -F 'hko-warning-truth-recorder.yml' <<<"$output" >/dev/null
          grep -F 'beta-prospective-recorder.yml' <<<"$output" >/dev/null
          grep -F 'hk-signal-evaluator.yml' <<<"$output" >/dev/null
          grep -F 'coverage keeper one-shot complete' <<<"$output" >/dev/null
          grep -F "gh workflow run hk-signal-coverage-keeper.yml" .github/workflows/hk-signal-coverage-keeper.yml >/dev/null
          git diff --check origin/main...HEAD

  keep-coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: hk-signal-coverage-keeper-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      COVERAGE_KEEPER_REF: main
      COVERAGE_KEEPER_INTERVAL_SECONDS: 300
      COVERAGE_KEEPER_SESSION_SECONDS: 18000
      COVERAGE_KEEPER_EVALUATOR_DELAY_SECONDS: 90
    steps:
      - uses: actions/checkout@v6

      - name: Queue successor coverage keeper
        shell: bash
        run: |
          set -u
          queued=false
          for attempt in 1 2 3; do
            if gh workflow run hk-signal-coverage-keeper.yml --ref "$COVERAGE_KEEPER_REF"; then
              echo "coverage keeper successor queued on attempt $attempt"
              queued=true
              break
            fi
            echo "WARNING: successor dispatch attempt $attempt failed" >&2
            if [[ "$attempt" -lt 3 ]]; then sleep 5; fi
          done
          if [[ "$queued" != true ]]; then
            echo "WARNING: no successor queued; hourly schedule remains as fallback" >&2
          fi

      - name: Maintain truth, prospective, and evaluator coverage
        shell: bash
        run: bash scripts/hk-signal-coverage-keeper.sh
