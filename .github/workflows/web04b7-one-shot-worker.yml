name: WEB-04B-7 backend cursor smoke (one-shot)
on:
  push:
    branches:
      - feature/web-04b7-worker-cursor-review
    paths:
      - .github/workflows/web04b7-one-shot-worker.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify standalone Worker module syntax
        run: node --check backend/worker.js
      - name: Validate actual Worker routes with synthetic D1 mocks
        run: node --test tests/web04b7-worker-cursor.test.cjs
