name: WEB-04B-6 metadata binding probe smoke (one shot)
on:
  push:
    branches:
      - feature/web-04b-advisory-cursor-readiness
    paths:
      - .github/workflows/web04b6-one-shot-binding.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Syntax check
        run: node --check scripts/audit-web04b6-worker-db-binding.mjs
      - name: Run isolated Cloudflare binding metadata mocks only
        run: node --test tests/web04b6-worker-db-binding.test.mjs
