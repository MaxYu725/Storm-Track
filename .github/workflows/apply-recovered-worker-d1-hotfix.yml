name: Apply recovered Worker D1 hotfix

on:
  push:
    branches:
      - fix/d1-write-amplification-20260901
    paths:
      - backend/worker.v3.3.0-alpha.2.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d1-write-amplification-20260901

      - name: Apply tested production hotfix
        run: >-
          node scripts/patch-production-worker-d1-write-amplification.mjs
          backend/worker.v3.3.0-alpha.2.js
          backend/worker.js

      - name: Validate generated Worker syntax
        run: node --check backend/worker.js

      - name: Verify generated version
        run: grep -F "const VERSION = '3.3.0-alpha.3';" backend/worker.js

      - name: Commit generated Worker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/worker.js
          if git diff --cached --quiet; then
            echo "Generated Worker is already current."
            exit 0
          fi
          git commit -m "Generate fixed production Worker v3.3.0-alpha.3"
          git push origin HEAD:fix/d1-write-amplification-20260901
