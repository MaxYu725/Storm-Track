name: WEB-04B-7E isolated staging workerd D1 smoke (one shot)
on:
  push:
    branches:
      - feature/web-04b7-worker-cursor-review
    paths:
      - .github/workflows/web04b7e-one-shot.yml
      - tests/web04b7e-staging-miniflare-d1.mjs
      - backend/web04b7-staging-readonly.js
permissions:
  contents: read
jobs:
  staging-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check staging module and integration test syntax
        run: |
          node --check backend/web04b7-staging-readonly.js
          node --check tests/web04b7e-staging-miniflare-d1.mjs
      - name: Install only local Miniflare emulator
        run: npm install --no-save miniflare@4
      - name: Validate staging entrypoint in isolated workerd and D1
        run: node tests/web04b7e-staging-miniflare-d1.mjs
      - name: Regression-test binding and route restrictions
        run: node --test tests/web04b7d-staging-readonly.test.cjs
