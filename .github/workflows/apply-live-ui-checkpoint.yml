name: Apply live-test corrections and frontend UI

on:
  pull_request:
    branches:
      - feature/ai-analysis-engine
    paths:
      - .github/workflows/apply-live-ui-checkpoint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply bounded corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          threat = Path('analysis/hk-threat-assessment.js')
          must_replace(
              threat,
              '    const timeline = buildTimeline(agencyTracks, normalizedReferencePoint, referenceTimeMs);\n',
              '    const fullTimeline = buildTimeline(agencyTracks, normalizedReferencePoint, referenceTimeMs);\n'
              '    const timeline = fullTimeline.filter(item => Number.isFinite(item.leadHours) && item.leadHours >= 0);\n',
              'future-only forecast timeline'
          )
          must_replace(
              threat,
              '        crossAgencyInterpolationIsTransparent: true,\n        fixedDayBucketsUsed: false,',
              '        crossAgencyInterpolationIsTransparent: true,\n'
              '        pastCheckpointsExcludedFromForecastTimeline: true,\n'
              '        fixedDayBucketsUsed: false,',
              'timeline semantics'
          )

          basic = Path('analysis/basic-hk-signal-forecast.js')
          must_replace(
              basic,
              "    const raw = signal === 'T8'\n"
              "      ? proximity * 0.38 + windEvidence * 0.34 + rapid * 0.18 + agreement * 0.10\n"
              "      : (signal === 'T3'\n"
              "        ? proximity * 0.40 + windEvidence * 0.28 + rapid * 0.20 + agreement * 0.12\n"
              "        : proximity * 0.48 + windEvidence * 0.14 + rapid * 0.24 + agreement * 0.14);",
              "    const exposureWind = windEvidence * proximity;\n"
              "    const exposureRapid = rapid * Math.max(proximity, 0.25);\n"
              "    const raw = signal === 'T8'\n"
              "      ? proximity * 0.42 + exposureWind * 0.30 + exposureRapid * 0.18 + agreement * 0.10\n"
              "      : (signal === 'T3'\n"
              "        ? proximity * 0.42 + exposureWind * 0.28 + exposureRapid * 0.18 + agreement * 0.12\n"
              "        : proximity * 0.48 + windEvidence * 0.14 + rapid * 0.24 + agreement * 0.14);",
              'HK exposure coupling'
          )
          must_replace(
              basic,
              "    const strongest = entries.reduce((best, item) => item.evidence > best.evidence ? item : best, entries[0]);\n"
              "    return {\n"
              "      maxEvidence: strongest.evidence,\n"
              "      strongest,\n"
              "      firstPossible: entries.find(item => item.evidence >= (signal === 'T8' ? 0.40 : signal === 'T3' ? 0.38 : 0.35)) ?? null,\n"
              "      firstLikely: entries.find(item => item.evidence >= (signal === 'T8' ? 0.70 : signal === 'T3' ? 0.65 : 0.58)) ?? null\n"
              "    };",
              "    const strongest = entries.reduce((best, item) => item.evidence > best.evidence ? item : best, entries[0]);\n"
              "    const crossing = threshold => entries.find((item, index) => {\n"
              "      if (item.evidence < threshold) return false;\n"
              "      if (index === 0) return finite(item.checkpoint?.leadHours) > 0;\n"
              "      return entries[index - 1].evidence < threshold;\n"
              "    }) ?? null;\n"
              "    return {\n"
              "      maxEvidence: strongest.evidence,\n"
              "      strongest,\n"
              "      firstPossible: crossing(signal === 'T8' ? 0.40 : signal === 'T3' ? 0.38 : 0.35),\n"
              "      firstLikely: crossing(signal === 'T8' ? 0.70 : signal === 'T3' ? 0.65 : 0.58)\n"
              "    };",
              'future threshold crossing'
          )
          must_replace(
              basic,
              '  function timelineWindow(anchor, timeline, defaultBefore = 4, defaultAfter = 6) {\n'
              '    if (!anchor) return null;\n'
              '    const anchorMs = timeMs(anchor);\n'
              '    if (!Number.isFinite(anchorMs)) return null;\n'
              '    const index = (Array.isArray(timeline) ? timeline : []).findIndex(item => timeMs(item?.validTime ?? item?.time) === anchorMs);\n'
              '    const previousGap = index > 0 ? finite(timeline[index]?.intervalFromPreviousHours) : null;\n'
              '    const nextGap = index >= 0 && index + 1 < timeline.length\n'
              '      ? finite(timeline[index + 1]?.intervalFromPreviousHours) : null;\n'
              '    const before = Number.isFinite(previousGap) ? clamp(previousGap / 2, 2, 6) : defaultBefore;\n'
              '    const after = Number.isFinite(nextGap) ? clamp(nextGap / 2, 2, 8) : defaultAfter;\n'
              '    return windowAround(anchor, before, after);\n'
              '  }',
              '  function timelineWindow(anchor, timeline, referenceTime, defaultBefore = 4, defaultAfter = 6) {\n'
              '    if (!anchor) return null;\n'
              '    const anchorMs = timeMs(anchor);\n'
              '    if (!Number.isFinite(anchorMs)) return null;\n'
              '    const index = (Array.isArray(timeline) ? timeline : []).findIndex(item => timeMs(item?.validTime ?? item?.time) === anchorMs);\n'
              '    const previousGap = index > 0 ? finite(timeline[index]?.intervalFromPreviousHours) : null;\n'
              '    const nextGap = index >= 0 && index + 1 < timeline.length\n'
              '      ? finite(timeline[index + 1]?.intervalFromPreviousHours) : null;\n'
              '    const before = Number.isFinite(previousGap) ? clamp(previousGap / 2, 2, 6) : defaultBefore;\n'
              '    const after = Number.isFinite(nextGap) ? clamp(nextGap / 2, 2, 8) : defaultAfter;\n'
              '    const referenceMs = timeMs(referenceTime);\n'
              '    const startMs = Math.max(anchorMs - before * HOUR_MS, Number.isFinite(referenceMs) ? referenceMs : -Infinity);\n'
              '    return { start: iso(startMs), end: iso(anchorMs + after * HOUR_MS) };\n'
              '  }',
              'forecast window clamp'
          )
          must_replace(
              basic,
              "    const signalWindow = (likelihood, timelineAnchorValue, fallbackAnchor, before, after) => {\n"
              "      if (likelihood === 'unlikely') return null;\n"
              "      if (timelineAnchorValue) return timelineWindow(timelineAnchorValue, timeline, before, after);\n"
              "      return fallbackAnchor ? windowAround(fallbackAnchor, before, after) : null;\n"
              "    };",
              "    const signalWindow = (likelihood, timelineAnchorValue, fallbackAnchor, before, after) => {\n"
              "      if (likelihood === 'unlikely') return null;\n"
              "      if (timelineAnchorValue) return timelineWindow(timelineAnchorValue, timeline, referenceTime, before, after);\n"
              "      if (forecastEdge > 0.5 || !fallbackAnchor) return null;\n"
              "      const fallbackWindow = windowAround(fallbackAnchor, before, after);\n"
              "      const referenceMs = timeMs(referenceTime);\n"
              "      const fallbackStartMs = timeMs(fallbackWindow?.start);\n"
              "      if (fallbackWindow && Number.isFinite(referenceMs) && Number.isFinite(fallbackStartMs) && fallbackStartMs < referenceMs) fallbackWindow.start = iso(referenceMs);\n"
              "      return fallbackWindow;\n"
              "    };",
              'signal timing suppression'
          )
          must_replace(
              basic,
              '        timelineCanDriveSignalRisk: timeline.length > 0,\n        timeWeightingIsContinuous: true,',
              '        timelineCanDriveSignalRisk: timeline.length > 0,\n'
              '        signalTimingUsesFutureThresholdCrossings: true,\n'
              '        stormIntensityIsCoupledToHongKongExposureForT3T8: true,\n'
              '        horizonLimitedFallbackTimingSuppressed: true,\n'
              '        timeWeightingIsContinuous: true,',
              'signal semantics'
          )

          test = Path('tests/frontend-hk-threat-ui.test.cjs')
          text = test.read_text(encoding='utf-8')
          anchor = "assert.ok(result.threatAssessment.timeline.some(item => item.rapidEvolutionIndex > 0.3));\n"
          if text.count(anchor) != 1:
              raise SystemExit('frontend test anchor mismatch')
          test.write_text(text.replace(anchor, anchor + "assert.ok(result.threatAssessment.timeline.every(item => item.leadHours >= 0));\n", 1), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          if './analysis/frontend-hk-threat-ui.js' not in text:
              anchor = '<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>\n<script>'
              insert = '<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>\n' \
                  '<script src="./analysis/storm-analysis-core.js"></script>\n' \
                  '<script src="./analysis/hk-impact-engine.js"></script>\n' \
                  '<script src="./analysis/hko-signal-risk-inputs.js"></script>\n' \
                  '<script src="./analysis/hk-threat-assessment.js"></script>\n' \
                  '<script src="./analysis/basic-hk-signal-forecast.js"></script>\n' \
                  '<script src="./analysis/frontend-hk-threat-ui.js"></script>\n<script>'
              if text.count(anchor) != 1:
                  raise SystemExit(f'index script anchor mismatch: {text.count(anchor)}')
              text = text.replace(anchor, insert, 1)
          if 'const hkThreatHtml = globalThis.StormHkThreatUi?.renderGroupSummary(group)' not in text:
              anchor = '            const nearest = calculateGroupNearestApproach(group);\n            return `<div class="panel-storm-card"'
              insert = '            const nearest = calculateGroupNearestApproach(group);\n            const hkThreatHtml = globalThis.StormHkThreatUi?.renderGroupSummary(group) || \'\';\n            return `<div class="panel-storm-card"'
              if text.count(anchor) != 1:
                  raise SystemExit(f'index card anchor mismatch: {text.count(anchor)}')
              text = text.replace(anchor, insert, 1)
              anchor = "                    預測最近距港：${nearest ? `${Math.round(nearest.distance)} km（${escapeHtml(nearest.agency)}）` : '未提供'}\n                </div>\n            </div>`;"
              insert = "                    預測最近距港：${nearest ? `${Math.round(nearest.distance)} km（${escapeHtml(nearest.agency)}）` : '未提供'}\n                </div>\n                ${hkThreatHtml}\n            </div>`;"
              if text.count(anchor) != 1:
                  raise SystemExit(f'index card tail mismatch: {text.count(anchor)}')
              text = text.replace(anchor, insert, 1)
          index.write_text(text, encoding='utf-8')
          PY
          git diff --check
          node tests/hk-threat-assessment.test.cjs
          node tests/basic-hk-signal-forecast.test.cjs
          node tests/frontend-hk-threat-ui.test.cjs
      - name: Run full regression
        working-directory: workers/storm-analysis
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Commit verified checkpoint
        shell: bash
        run: |
          git config user.name 'storm-track-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -- analysis/hk-threat-assessment.js analysis/basic-hk-signal-forecast.js tests/frontend-hk-threat-ui.test.cjs index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refine live HK threat timing and show it in UI'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
