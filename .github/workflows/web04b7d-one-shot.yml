name: WEB-04B-7D read-only route and offline staging checks (one-shot)
on:
  push:
    branches:
      - feature/web-04b7-worker-cursor-review
    paths:
      - .github/workflows/web04b7d-one-shot.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Syntax-check read-only tools
        run: |
          node --check scripts/audit-web04b7d-flags-routes.mjs
          node --check scripts/audit-web04b7d-staging-plan.mjs
      - name: Run isolated Cloudflare metadata and zone route mocks
        run: node --test tests/web04b7d-flags-routes.test.mjs
      - name: Run offline staging plan safety and redaction tests
        run: node --test tests/web04b7d-staging-plan.test.mjs
      - name: Recheck actual Worker route mocks
        run: node --test tests/web04b7-worker-cursor.test.cjs
