name: Evaluate HK signal Beta against HKO truth

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Record HK signal Beta prospective snapshots
      - Record HKO tropical cyclone warning truth
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - analysis/hk-signal-evaluator.js
      - analysis/hk-signal-closeout.js
      - scripts/evaluate-hk-signal.mjs
      - scripts/apply-hk-signal-closeouts.mjs
      - tests/hk-signal-evaluator.test.cjs
      - tests/hk-signal-closeout.test.cjs
      - tests/hk-signal-ambiguous-case-capture.test.cjs
      - .github/workflows/hk-signal-evaluator.yml
  pull_request:
    branches:
      - main
    paths:
      - analysis/hk-signal-evaluator.js
      - analysis/hk-signal-closeout.js
      - scripts/evaluate-hk-signal.mjs
      - scripts/apply-hk-signal-closeouts.mjs
      - tests/hk-signal-evaluator.test.cjs
      - tests/hk-signal-closeout.test.cjs
      - tests/hk-signal-ambiguous-case-capture.test.cjs
      - .github/workflows/hk-signal-evaluator.yml

permissions:
  contents: write

concurrency:
  group: hk-signal-evaluator
  cancel-in-progress: false

env:
  PROSPECTIVE_BRANCH: data/beta-prospective-observations
  TRUTH_BRANCH: data/hko-warning-truth
  EVALUATION_BRANCH: data/hk-signal-evaluations

jobs:
  evaluate:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run evaluator regression
        run: |
          set -euo pipefail
          node --check analysis/hk-signal-evaluator.js
          node --check analysis/hk-signal-closeout.js
          node --check scripts/evaluate-hk-signal.mjs
          node --check scripts/apply-hk-signal-closeouts.mjs
          node tests/hk-signal-evaluator.test.cjs
          node tests/hk-signal-closeout.test.cjs
          node tests/hk-signal-ambiguous-case-capture.test.cjs

      - name: Load immutable prospective and HKO truth corpora
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hk-signal-prospective /tmp/hko-warning-truth
          mkdir -p /tmp/hk-signal-prospective /tmp/hko-warning-truth
          git fetch --no-tags origin "$PROSPECTIVE_BRANCH" "$TRUTH_BRANCH"
          git archive "origin/$PROSPECTIVE_BRANCH" | tar -x -C /tmp/hk-signal-prospective
          git archive "origin/$TRUTH_BRANCH" | tar -x -C /tmp/hko-warning-truth
          test -s /tmp/hk-signal-prospective/case-index.ndjson
          test -s /tmp/hko-warning-truth/truth-events.ndjson

      - name: Build deterministic evaluation state
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/evaluate-hk-signal.mjs /tmp/hk-signal-prospective /tmp/hko-warning-truth > /tmp/hk-signal-evaluation-raw.json
          test -s /tmp/hk-signal-evaluation-raw.json
          node scripts/apply-hk-signal-closeouts.mjs /tmp/hk-signal-evaluation-raw.json /tmp/hk-signal-prospective /tmp/hko-warning-truth > /tmp/hk-signal-evaluation.json
          test -s /tmp/hk-signal-evaluation.json

      - name: Validate evaluation contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == "hk-signal-evaluator/v2" and
            .rubricVersion == "hk-signal-validation-rubric/v1" and
            .eventPolicyVersion == "hk-signal-event-policy/v1" and
            .closeoutPolicyVersion == "hk-signal-closeout-policy/v1" and
            (.evaluationFingerprint | test("^[0-9a-f]{64}$")) and
            (.rubric.checkpointHours == [48,24,12,6,3]) and
            (.eventPolicy.version == "hk-signal-event-policy/v1") and
            (.closeoutPolicy.version == "hk-signal-closeout-policy/v1") and
            (.closeoutPolicy.inactiveGraceHours == 24) and
            (.status == "awaiting-tc1" or .status == "evaluated" or .status == "truth-unresolved") and
            (.prospective.trustedRecorderSchema == "beta-prospective-recorder/v2") and
            (.prospective.excludedAmbiguousCaseCaptureCount | type == "number") and
            (.prospective.excludedAmbiguousCaseCaptures | type == "array") and
            (all(.prospective.excludedAmbiguousCaseCaptures[]; (.caseId | type == "string") and (.captureFingerprint | type == "string") and (.rawGroupKeys | type == "array"))) and
            (.hkoTruth.signalEventCounts | has("T1") and has("T3") and has("T8")) and
            (.evaluations | type == "array") and
            (.closeouts | type == "array") and
            (.closeoutBlocked | type == "array") and
            (all(.evaluations[]; (.signal == "T1" or .signal == "T3" or .signal == "T8"))) and
            (all(.closeouts[]; .status == "not-issued" and .officialOutcome == "not-issued" and .rubricGradeApplied == false and (.timingGrade == null)))
          ' /tmp/hk-signal-evaluation.json >/dev/null
          jq '{generatedAt,evaluationFingerprint,status,rubricVersion,eventPolicyVersion,closeoutPolicyVersion,prospective,hkoTruth,awaiting,closeoutSummary,closeouts:[.closeouts[]|{caseId,signal,closedAt,closeoutReason,forecastOutcome}],closeoutBlocked,evaluations:[.evaluations[]|{status,signal,caseId,attribution,truth,lifecycle,grades}]}' /tmp/hk-signal-evaluation.json

      - name: Check branch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check origin/main...HEAD

      - name: Persist derived evaluation state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$EVALUATION_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$EVALUATION_BRANCH"
            git switch -C "$EVALUATION_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$EVALUATION_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          fingerprint="$(jq -r '.evaluationFingerprint' /tmp/hk-signal-evaluation.json)"
          existing="$(jq -r '.evaluationFingerprint // empty' latest.json 2>/dev/null || true)"
          if [[ "$fingerprint" == "$existing" ]]; then
            echo "HK_SIGNAL_EVALUATION_NOOP=true"
            echo "HK_SIGNAL_EVALUATION_FINGERPRINT=$fingerprint"
            exit 0
          fi

          cp /tmp/hk-signal-evaluation.json latest.json
          jq -c '{schemaVersion,generatedAt,evaluationFingerprint,sourceCommit,status,rubricVersion,eventPolicyVersion,closeoutPolicyVersion,prospective,hkoTruth,awaiting:{status:.awaiting.status,activeHkoCaseIds:.awaiting.activeHkoCaseIds,pendingSignalsByCase:.awaiting.pendingSignalsByCase},closeoutSummary,closeouts:[.closeouts[]|{caseId,signal,closedAt,closeoutReason,forecastOutcome}],evaluations:[.evaluations[]|{status,signal,caseId,truth,grades,lifecycle}]}' /tmp/hk-signal-evaluation.json >> index.ndjson

          while IFS= read -r evaluation; do
            case_id="$(jq -r '.caseId' <<<"$evaluation")"
            signal="$(jq -r '.signal | ascii_downcase' <<<"$evaluation")"
            status="$(jq -r '.status' <<<"$evaluation")"
            event_time="$(jq -r '.truth.eventTime' <<<"$evaluation")"
            stamp="$(date -u -d "$event_time" +'%Y%m%dT%H%M%SZ')"
            mkdir -p "cases/$case_id"
            if [[ "$status" == 'evaluated' ]]; then
              destination="cases/$case_id/${signal}-$stamp.json"
            else
              destination="cases/$case_id/${signal}-skipped-$stamp.json"
            fi
            jq --arg caseId "$case_id" --arg signal "${signal^^}" --arg status "$status" --arg eventTime "$event_time" \
              '.evaluations[] | select(.caseId == $caseId and .signal == $signal and .status == $status and .truth.eventTime == $eventTime)' \
              /tmp/hk-signal-evaluation.json > "$destination"
          done < <(jq -c '.evaluations[] | select(.caseId != null and (.status == "evaluated" or .status == "not-issued"))' /tmp/hk-signal-evaluation.json)

          while IFS= read -r closeout; do
            case_id="$(jq -r '.caseId' <<<"$closeout")"
            signal="$(jq -r '.signal | ascii_downcase' <<<"$closeout")"
            closed_at="$(jq -r '.closedAt' <<<"$closeout")"
            stamp="$(date -u -d "$closed_at" +'%Y%m%dT%H%M%SZ')"
            mkdir -p "cases/$case_id"
            jq --arg caseId "$case_id" --arg signal "${signal^^}" --arg closedAt "$closed_at" \
              '.closeouts[] | select(.caseId == $caseId and .signal == $signal and .closedAt == $closedAt)' \
              /tmp/hk-signal-evaluation.json > "cases/$case_id/${signal}-closeout-$stamp.json"
          done < <(jq -c '.closeouts[]' /tmp/hk-signal-evaluation.json)

          git add latest.json index.ndjson cases 2>/dev/null || git add latest.json index.ndjson
          git commit -m "Evaluate HK signal Beta ${fingerprint:0:12}"
          git push origin "HEAD:${EVALUATION_BRANCH}"
          echo "HK_SIGNAL_EVALUATION_STORED=true"
          echo "HK_SIGNAL_EVALUATION_FINGERPRINT=$fingerprint"
