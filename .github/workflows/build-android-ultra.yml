name: Build Storm-Track Ultra 2.2 Android APK (Live Active Storms & Keyless Map)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - 'analysis/**'
      - 'historical/**'
      - 'icons/**'
      - '.github/workflows/build-android-ultra.yml'
      - '.github/workflows/deploy-and-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-ultra:
    runs-on: ubuntu-latest
    env:
      WORKER_API_URL: ${{ secrets.STORM_WORKER_URL || 'https://storm.max-yu.workers.dev' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Storm-Track Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack & Upgrade Storm-Track Ultra 2.2 in ./android-app
        run: |
          mkdir -p android-app
          if [ ! -f "android-app/src/.ultra_v2_2" ]; then
            echo "Upgrading ./android-app/ to Storm-Track Ultra 2.2 (Active Storms CHAMPI + Universal Worker Bridge)..."
            python3 -c '
          import base64, lzma, io, tarfile
          b64 = ""
          raw_tar = lzma.decompress(base64.b64decode(b64))
          with tarfile.open(fileobj=io.BytesIO(raw_tar), mode="r") as tf:
              tf.extractall("android-app")
          print("Successfully unpacked Storm-Track Ultra 2.2 into ./android-app/!")
          '
          fi

      - name: Auto-Discover Web Worker Endpoints & Sync Shared Resources from Root Repo
        run: |
          python3 -c '
          import os, re, json, urllib.request
          urls = ["https://storm.max-yu.workers.dev", "https://storm.max-yu.workers.dev/api/storms"]
          for fname in ["index.html", "backend/worker.js"]:
              if os.path.exists(fname):
                  txt = open(fname, "r", encoding="utf-8", errors="ignore").read()
                  found = re.findall(r"https://[a-zA-Z0-9._-]+\.workers\.dev[^"'''\s<>)*]*", txt)
                  for u in found:
                      if u not in urls:
                          urls.insert(0, u)
          live_payload = None
          for u in urls:
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "StormTrackUltra/2.2"})
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      if resp.status == 200:
                          data = json.loads(resp.read().decode("utf-8"))
                          if data:
                              live_payload = data
                              print("Fetched live payload from:", u)
                              break
              except Exception as e:
                  pass
          bridge_js = f"window.DISCOVERED_WORKER_URLS = {json.dumps(urls)};\nwindow.STORM_TRACK_INITIAL_LIVE_PAYLOAD = {json.dumps(live_payload, ensure_ascii=False)};\n"
          os.makedirs("android-app/src/js", exist_ok=True)
          with open("android-app/src/js/live_bridge.js", "w", encoding="utf-8") as out:
              out.write(bridge_js)
          print("Wrote live_bridge.js with discovered URLs:", urls)
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-app/
          git diff --staged --quiet || (git commit -m "feat(android): upgrade to Storm-Track Ultra 2.2 with live active storms sync" && git push)

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Capacitor & Sync Android Project
        working-directory: ./android-app
        run: |
          npm install
          npx cap add android || npx cap sync android
          npx cap copy android

      - name: Configure Android Permissions & Cleartext Support
        working-directory: ./android-app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' "$MANIFEST"
          fi

      - name: Generate High-Res Launcher Icons
        working-directory: ./android-app
        run: |
          python3 -c '
          import os
          try:
              from PIL import Image, ImageDraw
              sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
              for folder, px in sizes.items():
                  out_d = os.path.join("android/app/src/main/res", folder)
                  os.makedirs(out_d, exist_ok=True)
                  for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      img = Image.new("RGBA", (px, px), (6, 10, 20, 255))
                      draw = ImageDraw.Draw(img)
                      cx, cy = px // 2, px // 2
                      ro, rm, re = int(px * 0.34), int(px * 0.22), int(px * 0.09)
                      draw.ellipse([cx - ro, cy - ro, cx + ro, cy + ro], outline=(56, 189, 248, 255), width=max(2, px // 14))
                      draw.ellipse([cx - rm, cy - rm, cx + rm, cy + rm], fill=(255, 46, 99, 255))
                      draw.ellipse([cx - re, cy - re, cx + re, cy + re], fill=(6, 10, 20, 255))
                      img.save(os.path.join(out_d, name))
          except Exception as e:
              print("Icon gen note:", e)
          '

      - name: Resolve Kotlin Stdlib Duplicate Classes
        working-directory: ./android-app
        run: |
          if ! grep -q "kotlin-stdlib-jdk7" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "configurations.all {" >> android/app/build.gradle
            echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
            echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
            echo "}" >> android/app/build.gradle
          fi

      - name: Build Debug APK via Gradle
        working-directory: ./android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Storm_Track_Ultra_v2_2_APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
