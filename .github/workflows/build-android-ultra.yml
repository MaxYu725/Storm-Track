name: Build Storm-Track Ultra Android APK (Monorepo Shared Mode)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - 'analysis/**'
      - 'historical/**'
      - 'icons/**'
      - '.github/workflows/build-android-ultra.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-ultra:
    runs-on: ubuntu-latest
    env:
      # 直接共用同一個 Repository 的 Actions Secrets (與網頁版/Cloudflare Worker 共用)
      WORKER_API_URL: ${{ secrets.STORM_WORKER_URL || 'https://storm.max-yu.workers.dev' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Storm-Track Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Android Sub-Project in ./android-app (Preserving Root Web App)
        run: |
          mkdir -p android-app
          if [ ! -f "android-app/src/js/engine.js" ]; then
            echo "Unpacking Storm-Track Ultra 2.0 into ./android-app/ (Root Web files remain 100% untouched)..."
            python3 - << 'PYUNPACK'
          import base64, lzma, io, tarfile
          b64 = ""
          raw_tar = lzma.decompress(base64.b64decode(b64))
          with tarfile.open(fileobj=io.BytesIO(raw_tar), mode='r') as tf:
              tf.extractall('android-app')
          print("Successfully unpacked Storm-Track Ultra 2.0 into ./android-app/!")
          PYUNPACK

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android-app/
            git diff --staged --quiet || (git commit -m "chore(android): initialize Storm-Track Ultra 2.0 in ./android-app subdirectory" && git push)
          fi

      - name: Sync Shared Resources from Root Repo (analysis/, historical/cases/, icons/)
        run: |
          mkdir -p android-app/src/shared/historical/cases
          mkdir -p android-app/src/shared/analysis
          mkdir -p android-app/src/icons

          if [ -d "historical/cases" ]; then
            cp -rf historical/cases/* android-app/src/shared/historical/cases/ || true
          fi
          if [ -d "analysis" ]; then
            cp -rf analysis/* android-app/src/shared/analysis/ || true
          fi
          if [ -d "icons" ]; then
            cp -rf icons/* android-app/src/icons/ || true
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Capacitor & Sync Android Project (Inside ./android-app)
        working-directory: ./android-app
        run: |
          npm install
          npx cap add android || npx cap sync android
          npx cap copy android

      - name: Configure Android Permissions (Internet, Network, Vibrate, Geolocation, Notifications)
        working-directory: ./android-app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' "$MANIFEST"
          fi

      - name: Generate & Apply High-Res Launcher Icons
        working-directory: ./android-app
        run: |
          python3 - << 'ICONEOF'
          import os
          try:
              from PIL import Image, ImageDraw
              sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
              for folder, px in sizes.items():
                  out_d = os.path.join("android/app/src/main/res", folder)
                  os.makedirs(out_d, exist_ok=True)
                  for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      img = Image.new("RGBA", (px, px), (6, 9, 19, 255))
                      draw = ImageDraw.Draw(img)
                      cx, cy = px // 2, px // 2
                      ro, rm, re = int(px * 0.34), int(px * 0.22), int(px * 0.09)
                      draw.ellipse([cx - ro, cy - ro, cx + ro, cy + ro], outline=(0, 229, 255, 255), width=max(2, px // 14))
                      draw.ellipse([cx - rm, cy - rm, cx + rm, cy + rm], fill=(255, 46, 99, 255))
                      draw.ellipse([cx - re, cy - re, cx + re, cy + re], fill=(6, 9, 19, 255))
                      img.save(os.path.join(out_d, name))
          except Exception as e:
              print("Icon gen note:", e)
          ICONEOF

      - name: Resolve Kotlin Stdlib Duplicate Classes
        working-directory: ./android-app
        run: |
          echo "" >> android/app/build.gradle
          echo "configurations.all {" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Build APK via Gradle (Supports Optional Release Keystore Secret Signing)
        working-directory: ./android-app/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Storm_Track_Ultra_v2_APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
