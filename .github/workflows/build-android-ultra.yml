name: Build Storm-Track Ultra 2.2 Android APK (Fast Checkout & Live Storms)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - 'analysis/**'
      - 'historical/**'
      - 'icons/**'
      - '.github/workflows/build-android-ultra.yml'
      - '.github/workflows/deploy-and-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-ultra:
    runs-on: ubuntu-latest
    env:
      WORKER_API_URL: ${{ secrets.STORM_WORKER_URL || 'https://storm.max-yu.workers.dev' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Storm-Track Monorepo (Shallow Fast Clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unpack & Upgrade Storm-Track Ultra 2.2 in ./android-app
        env:
          B64_ARCHIVE: ""
        run: |
          mkdir -p android-app
          if [ ! -f "android-app/src/.ultra_v2_2_1" ]; then
            echo "Upgrading ./android-app/ to Storm-Track Ultra 2.2.1..."
            python3 -c "import os,base64,lzma,io,tarfile; raw=lzma.decompress(base64.b64decode(os.environ['B64_ARCHIVE'])); tarfile.open(fileobj=io.BytesIO(raw),mode='r').extractall('android-app')"
            echo "Successfully unpacked Storm-Track Ultra 2.2.1 into ./android-app/!"
          fi

      - name: Auto-Discover Web Worker Endpoints & Sync Shared Resources
        run: |
          python3 android-app/scripts/discover_worker.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-app/
          git diff --staged --quiet || (git commit -m "feat(android): upgrade to Storm-Track Ultra 2.2.1 with live storms sync" && git push)

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Capacitor & Sync Android Project
        working-directory: ./android-app
        run: |
          npm install
          npx cap add android || npx cap sync android
          npx cap copy android

      - name: Configure Android Permissions & Cleartext Support
        working-directory: ./android-app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' "$MANIFEST"
          fi

      - name: Generate High-Res Launcher Icons
        working-directory: ./android-app
        run: |
          python3 scripts/generate_icons.py || true

      - name: Resolve Kotlin Stdlib Duplicate Classes
        working-directory: ./android-app
        run: |
          if ! grep -q "kotlin-stdlib-jdk7" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "configurations.all {" >> android/app/build.gradle
            echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
            echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
            echo "}" >> android/app/build.gradle
          fi

      - name: Build Debug APK via Gradle
        working-directory: ./android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Storm_Track_Ultra_v2_2_APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
