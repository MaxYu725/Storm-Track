name: Validate HK signal frontend Beta

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - analysis/**
      - scripts/reconcile-beta-case-identities.mjs
      - tests/**
      - .github/workflows/hk-signal-beta-validation.yml

permissions:
  contents: write

jobs:
  patch-live-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/simplified-generic-storm-labels
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Replace generic-name functions by boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_function(text, name, replacement):
              marker = f'function {name}('
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing function {name}')
              opening = text.find('{', start)
              if opening < 0:
                  raise SystemExit(f'missing opening brace for {name}')
              depth = 0
              end = None
              for i in range(opening, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'unterminated function {name}')
              return text[:start] + replacement + text[end:]

          frontend_function = '''function isGenericStormName(value) {
        const text = normalizeName(value);
        if (!text) return true;
        if (/^(UNNAMED|NAMELESS|TROPICALDEPRESSION|TROPICALSTORM|TD|TS|熱帶低氣壓|熱帶低壓|热带低气压|热带低压|熱帶風暴|热带风暴|未命名熱帶氣旋|未命名热带气旋|未命名)\\d*$/.test(text)) return true;
        return /^(?:(?:TROPICALDEPRESSION|TROPICALSTORM|熱帶低氣壓|熱帶低壓|热带低气压|热带低压|熱帶風暴|热带风暴))?(?:TC|TD|TS)\\d+[A-Z]?$/.test(text);
    }'''
          identity_function = '''function isGenericName(value) {
    const text = normalizeName(value);
    if (!text) return true;
    if (/^(UNNAMED|NAMELESS|TROPICALDEPRESSION|TROPICALSTORM|TD|TS|熱帶低氣壓|熱帶低壓|热带低气压|热带低压|熱帶風暴|热带风暴|未命名熱帶氣旋|未命名热带气旋|未命名)\\d*$/.test(text)) return true;
    return /^(?:(?:TROPICALDEPRESSION|TROPICALSTORM|熱帶低氣壓|熱帶低壓|热带低气压|热带低压|熱帶風暴|热带风暴))?(?:TC|TD|TS)\\d+[A-Z]?$/.test(text);
  }'''

          index = Path('index.html')
          index.write_text(replace_function(index.read_text(), 'isGenericStormName', frontend_function))
          identity = Path('analysis/storm-case-identity.js')
          identity.write_text(replace_function(identity.read_text(), 'isGenericName', identity_function))

          frontend = Path('tests/frontend-storm-identity-grouping.test.cjs')
          text = frontend.read_text()
          label_marker = "  '熱帶風暴',\n"
          if label_marker not in text:
              raise SystemExit('missing frontend generic label marker')
          text = text.replace(label_marker, label_marker + "  '热带低压',\n  '热带风暴',\n", 1)
          case_marker = 'const distinctNamedStorms = mergeStormSources(['
          if case_marker not in text:
              raise SystemExit('missing distinct named storm marker')
          gaenari_case = """const gaenariRename = mergeStormSources([\n  storm({ agency: 'CMA', sourceId: '3308554', nameTc: '热带低压', nameEn: null, lat: 25.5, lon: 124.9, time: '2026-08-22T03:00:00Z' }),\n  storm({ agency: 'JMA', sourceId: 'TC2623', nameTc: '簡拉維', nameEn: 'GAENARI', lat: 25.0, lon: 123.8, time: '2026-08-22T06:00:00Z' })\n]);\nassert.equal(gaenariRename.length, 1, 'simplified Chinese generic TD label must merge with the newly named GAENARI track');\nassert.deepEqual(Object.keys(gaenariRename[0].sources).sort(), ['CMA', 'JMA']);\n\n"""
          frontend.write_text(text.replace(case_marker, gaenari_case + case_marker, 1))

          case_test = Path('tests/storm-case-identity.test.cjs')
          text = case_test.read_text()
          source_marker = 'function source(agency, sourceId, time, lat, lon) {'
          if source_marker not in text:
              raise SystemExit('missing case identity source marker')
          generic_assertions = """assert.equal(identity.isGenericName('热带低压'), true, 'simplified Chinese tropical depression label must be generic');\nassert.equal(identity.isGenericName('热带风暴'), true, 'simplified Chinese tropical storm label must be generic');\nassert.equal(identity.isGenericName('GAENARI'), false, 'formal storm names must remain specific');\n\n"""
          case_test.write_text(text.replace(source_marker, generic_assertions + source_marker, 1))
          PY

      - name: Run focused regressions
        run: |
          set -euo pipefail
          node tests/frontend-storm-identity-grouping.test.cjs
          node tests/storm-case-identity.test.cjs
          git diff --check

      - name: Commit only the bounded fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-fix-simplified-generic-labels.yml
          git checkout origin/main -- .github/workflows/hk-signal-beta-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html analysis/storm-case-identity.js tests/frontend-storm-identity-grouping.test.cjs tests/storm-case-identity.test.cjs .github/workflows/hk-signal-beta-validation.yml .github/workflows/one-shot-fix-simplified-generic-labels.yml
          git commit -m "Fix GAENARI duplicate live grouping"
          git push origin HEAD:fix/simplified-generic-storm-labels

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check frontend module syntax
        run: |
          node --check analysis/storm-analysis-core.js
          node --check analysis/hk-impact-engine.js
          node --check analysis/hko-signal-risk-inputs.js
          node --check analysis/hk-threat-assessment.js
          node --check analysis/basic-hk-signal-forecast.js
          node --check analysis/frontend-hk-threat-ui.js
          node --check analysis/storm-case-identity.js
          node --check scripts/reconcile-beta-case-identities.mjs

      - name: Verify Beta integration surface
        run: |
          grep -F '<script src="./analysis/storm-analysis-core.js"></script>' index.html
          grep -F '<script src="./analysis/frontend-hk-threat-ui.js"></script>' index.html
          grep -F 'StormHkThreatUi?.renderGroupSummary(group)' index.html
          grep -F '${hkThreatHtml}' index.html
          grep -F "get('beta') === 'hk-signal'" analysis/frontend-hk-threat-ui.js
          grep -F '香港影響 Beta' analysis/frontend-hk-threat-ui.js
          grep -F '非香港天文台官方風球預測' analysis/frontend-hk-threat-ui.js

      - name: Run HK signal regression suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/storm-analysis-core.test.cjs
            tests/hk-impact-engine.test.cjs
            tests/hko-signal-risk-inputs.test.cjs
            tests/hk-threat-assessment.test.cjs
            tests/hk-threat-rule-scenarios.test.cjs
            tests/hk-missing-numeric-semantics.test.cjs
            tests/hk-agency-evidence-independence.test.cjs
            tests/hk-signal-timing-uncertainty.test.cjs
            tests/hk-signal-timing-cadence-invariance.test.cjs
            tests/hk-signal-crossing-invariants.test.cjs
            tests/hk-forecast-horizon-invariants.test.cjs
            tests/hk-wind-field-selection-invariants.test.cjs
            tests/hk-interpolation-reliability-invariants.test.cjs
            tests/hk-interpolation-chord-invariants.test.cjs
            tests/hk-current-proximity-interpolation-independence.test.cjs
            tests/hk-minority-exact-threat-preservation.test.cjs
            tests/hk-interpolation-confirmation-escalation.test.cjs
            tests/hk-wind-field-interpolation-independence.test.cjs
            tests/hk-wind-field-freshness-escalation-invariants.test.cjs
            tests/basic-hk-signal-forecast.test.cjs
            tests/frontend-hk-threat-ui.test.cjs
            tests/frontend-hk-signal-beta-gate.test.cjs
            tests/frontend-storm-identity-grouping.test.cjs
            tests/storm-case-identity.test.cjs
          )
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done

      - name: Check whitespace
        run: git diff --check origin/main...HEAD
