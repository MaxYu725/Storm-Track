name: Validate HK signal frontend Beta

on:
  pull_request:
    branches:
      - main
    paths:
      - README.md
      - docs/CONSENSUS_TRACK_ROADMAP.md
      - docs/HK_SIGNAL_V2_SHADOW.md
      - index.html
      - observation.html
      - sw.js
      - analysis/**
      - scripts/reconcile-beta-case-identities.mjs
      - scripts/validate-consensus-track-observation-ui.mjs
      - tests/**
      - .github/workflows/hk-signal-beta-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check frontend module syntax
        run: |
          node --check sw.js
          node --check analysis/storm-analysis-core.js
          node --check analysis/hk-impact-engine.js
          node --check analysis/hko-signal-risk-inputs.js
          node --check analysis/hk-threat-assessment.js
          node --check analysis/basic-hk-signal-forecast.js
          node --check analysis/frontend-hk-threat-ui.js
          node --check analysis/hko-signal-statement.js
          node --check analysis/settings-panel-ui.js
          node --check analysis/wind-field-overlay.js
          node --check analysis/storm-case-identity.js
          node --check analysis/hk-signal-observation-board.js
          node --check analysis/consensus-track-observation-board.js
          node --check analysis/consensus-track-observation-ui.js
          node --check scripts/reconcile-beta-case-identities.mjs
          node --check scripts/validate-consensus-track-observation-ui.mjs

      - name: Verify Beta integration surface
        run: |
          grep -F '<script src="./analysis/storm-analysis-core.js"></script>' index.html
          grep -F '<script src="./analysis/frontend-hk-threat-ui.js"></script>' index.html
          grep -F 'StormHkThreatUi?.renderGroupSummary(group)' index.html
          grep -F '${hkThreatHtml}' index.html
          grep -F "get('beta') === 'hk-signal'" analysis/frontend-hk-threat-ui.js
          grep -F "script.src = './analysis/settings-panel-ui.js'" analysis/frontend-hk-threat-ui.js
          grep -F "script.src = './analysis/hko-signal-statement.js'" analysis/frontend-hk-threat-ui.js
          grep -F "script.src = './analysis/wind-field-overlay.js'" analysis/frontend-hk-threat-ui.js
          grep -F 'HKO 官方信號資訊' analysis/hko-signal-statement.js
          grep -F '官方原意優先，模糊時間不轉為精確時刻' analysis/hko-signal-statement.js
          grep -F '資料來源 / 路徑圖例' analysis/settings-panel-ui.js
          grep -F 'storm-settings-backdrop' analysis/settings-panel-ui.js
          grep -F '模式風場 Beta' analysis/wind-field-overlay.js
          grep -F '香港影響 Beta · V1 / V2' analysis/frontend-hk-threat-ui.js
          grep -F 'V1 frozen' analysis/frontend-hk-threat-ui.js
          grep -F 'V2 shadow' analysis/frontend-hk-threat-ui.js
          grep -F 'v1RemainsEvaluationBaseline: true' analysis/frontend-hk-threat-ui.js
          grep -F '非香港天文台官方風球預測' analysis/frontend-hk-threat-ui.js
          grep -F '<script src="./analysis/hk-signal-observation-board.js"></script>' observation.html
          grep -F 'Observation-only · v1' observation.html
          grep -F '不評分、不校準、不修改 forecast' observation.html
          grep -F "script.src = './analysis/consensus-track-observation-ui.js'" analysis/hk-signal-observation-board.js
          grep -F 'Consensus Track Beta｜Prospective Observation' analysis/consensus-track-observation-ui.js
          grep -F 'valid-time diagnostics only · 無 skill / truth / probability' analysis/consensus-track-observation-ui.js
          grep -F 'CT-1C 已把 read-only prospective diagnostics 加入現有 Observation Board' README.md
          grep -F 'HK Signal V2 Shadow' README.md
          grep -F 'SAUDEL' docs/HK_SIGNAL_V2_SHADOW.md
          grep -F '**Status: complete / read-only production observation surface.**' docs/CONSENSUS_TRACK_ROADMAP.md

      - name: Run HK signal regression suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/service-worker-cache-policy.test.cjs
            tests/storm-analysis-core.test.cjs
            tests/consensus-track-dateline.test.cjs
            tests/hk-impact-engine.test.cjs
            tests/hko-signal-risk-inputs.test.cjs
            tests/hko-signal-statement.test.cjs
            tests/hk-threat-assessment.test.cjs
            tests/hk-threat-rule-scenarios.test.cjs
            tests/hk-missing-numeric-semantics.test.cjs
            tests/hk-agency-evidence-independence.test.cjs
            tests/hk-signal-timing-uncertainty.test.cjs
            tests/hk-signal-timing-cadence-invariance.test.cjs
            tests/hk-signal-crossing-invariants.test.cjs
            tests/hk-forecast-horizon-invariants.test.cjs
            tests/hk-wind-field-selection-invariants.test.cjs
            tests/hk-interpolation-reliability-invariants.test.cjs
            tests/hk-interpolation-chord-invariants.test.cjs
            tests/hk-current-proximity-interpolation-independence.test.cjs
            tests/hk-minority-exact-threat-preservation.test.cjs
            tests/hk-interpolation-confirmation-escalation.test.cjs
            tests/hk-wind-field-interpolation-independence.test.cjs
            tests/hk-wind-field-freshness-escalation-invariants.test.cjs
            tests/basic-hk-signal-forecast.test.cjs
            tests/hk-signal-v2-shadow.test.cjs
            tests/frontend-hk-threat-ui.test.cjs
            tests/frontend-beta-prospective-observation.test.cjs
            tests/frontend-hk-signal-beta-gate.test.cjs
            tests/frontend-storm-identity-grouping.test.cjs
            tests/storm-case-identity.test.cjs
            tests/settings-panel-ui.test.cjs
            tests/wind-field-overlay.test.cjs
            tests/hk-signal-observation-board.test.cjs
            tests/consensus-track-observation-board.test.cjs
          )
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done

      - name: Install lightweight browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0

      - name: Start local observation frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/storm-track-observation-http.log 2>&1 &
          echo $! > /tmp/storm-track-observation-http.pid
          sleep 2
          curl --fail --retry 3 -sS http://127.0.0.1:4173/observation.html >/dev/null

      - name: Smoke-test Consensus Track observation UI
        run: node scripts/validate-consensus-track-observation-ui.mjs

      - name: Check whitespace
        run: git diff --check origin/main...HEAD
